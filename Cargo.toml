[workspace]
resolver = "2"
members = [
    "crates/crap-core",
    "crates/crap-examples",
    "crates/crap4rs",
    "crates/crap4ts",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/breezy-bays-labs/crap-rs"
authors = ["Christopher Bays <cmbays@breezybayslabs.com>"]

# ── Workspace dependency catalog ──────────────────────────────────────
#
# Every dependency used by any crate in the workspace declares its
# version pin here. Per-crate Cargo.toml files reference these via
# `{ workspace = true }` so a version bump touches one place.
#
# `crap-core` is the language-agnostic foundation; `crap4rs` is the
# Rust adapter. Future siblings (`crap4ts`) inherit the same pins.
[workspace.dependencies]
# ── In-workspace crates ──
crap-core = { path = "crates/crap-core", version = "0.8.0" }

# ── CLI (crap4rs only today) ──
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_complete_nushell = "4"

# ── AST parsing for complexity analysis (Rust adapter only) ──
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# ── AST parsing for TypeScript adapter (crap4ts only) ──
# oxc 0.129 is the current latest. Earlier versions (0.96–0.126)
# had progressively-lower MSRV floors (1.88–1.92); 0.127+ requires
# Rust 1.93, which matches the workspace floor. The walker is still
# a stub (crap4ts adapters `unimplemented!()`); the dep is wired so
# the cdylib link surface is locked in. Real walker lands in a
# follow-up pipeline.
oxc = "0.129"

# ── napi-rs bindings for the Node.js cdylib (crap4ts only) ──
# napi 3.x is the current stable line (MSRV 1.88; workspace floor is
# higher at 1.93). napi_build::setup()
# emits the macOS `-undefined dynamic_lookup` link arg automatically,
# so no `.cargo/config.toml` rustflags are needed.
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
napi-build = "2"

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default fast float parser may lose the
# last ulp on read (e.g. coverage_percent 90.79017890334245 parsing back
# as ...44), which would make the wire envelope's serialize→deserialize
# round-trip lossy. The exact parser keeps the wire contract bit-exact;
# the round-trip proptest in crap-core's adapters::wire pins it.
serde_json = { version = "1", features = ["float_roundtrip"] }

# ── Terminal output ──
comfy-table = { version = "7", features = ["custom_styling"] }
colored = "3"

# ── Config file parsing ──
toml = "0.8"

# ── Annotated TOML example emission from the config type ──
# `documented` 0.9.2 (`#[derive(DocumentedFields)]`) exposes each field's
# `///` doc as an associated constant; `toml_edit` 0.22 attaches those
# docs as leading TOML comments when rendering `crap.example.toml`.
# `toml_edit` is pinned to 0.22 (already in-tree transitively via `toml`
# 0.8, MSRV 1.66) NOT the 0.25 `cargo add` default (MSRV 1.85 + a second
# major in the tree). `documented` MSRV is 1.70 — both clear the 1.93
# workspace floor.
documented = "0.9"
toml_edit = "0.22"

# ── JSON Schema generation from the annotated config type ──
# schemars 1.2.1 derives a JSON Schema from `ConfigSchema` (the config
# wire type). Doc comments (`///`) on each field auto-become the
# property's `description`, so the schema and the docs.rs hovers share
# one prose source. MSRV 1.74 — comfortably below the workspace floor
# of 1.93. The `derive` default feature backs `#[derive(JsonSchema)]`.
schemars = "1"

# ── Regex (hunk header parsing in diff adapter) ──
regex = "1"

# ── Error handling ──
thiserror = "2"
anyhow = "1"

# ── File discovery ──
ignore = "0.4"

# ── Glob matching for per-path threshold overrides ──
globset = "0.4"

# ── Compile-time templates for HTML and Markdown reporters ──
# askama 0.16 ships compile-time-checked Jinja-like templates with
# auto-escaping by extension (.html → html escape, .txt → none).
# MSRV 1.88 — comfortably below the workspace floor of 1.93. License
# MIT OR Apache-2.0, matches the workspace.
askama = "0.16"

# ── Dev-dependency catalog (consumed via `{ workspace = true }`) ──
proptest = "1"
pretty_assertions = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
# Q4 fuzzing (dev/test only). bolero `check!` targets are authored as
# plain `#[test]` fns and run on STABLE via the existing
# `cargo nextest run --workspace --all-targets` lane (bounded-random
# discovery + an explicit committed-corpus replay test) — no nightly,
# no sanitizer, no cargo-bolero binary on the PR path. Nightly is needed
# ONLY for the optional coverage-guided `cargo bolero fuzz` cron lane.
# bolero MSRV 1.66 << workspace floor 1.93. (`arbitrary`, for the
# Istanbul structured fuzz arm, joins the catalog in its own sub-issue.)
bolero = "0.13"
# Schema round-trip validation for `--format scorecard-row` (issue #111).
jsonschema = { version = "0.30", default-features = false }
# BDD execution of `tests/features/*.feature` files (issue #115).
# Per-crate `[dev-dependencies]` adds `features = ["libtest"]`; the
# libtest feature is dev-only and is NOT lifted to workspace scope
# because cucumber's libtest feature is adapter-specific (the
# json_reporter_cucumber harness is crap4rs-only).
cucumber = { version = "0.22" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Cross-crate binary invocation for the wire-envelope snapshot test.
# crap-core's `tests/wire_envelope_snapshot.rs` runs the crap4rs
# binary; `env!("CARGO_BIN_EXE_crap4rs")` is only set inside the
# crap4rs crate's tests, so cross-crate invocation needs assert_cmd.
assert_cmd = "2"

# ── Q4 fuzz profile ───────────────────────────────────────────────────
# `cargo bolero test` builds with `--profile fuzz` (the coverage-guided
# nightly lane in `.github/workflows/fuzz-nightly.yml`). Without this
# profile the CLI errors `profile 'fuzz' is not defined`. bolero's
# recommended shape (inherits dev + opt for throughput). The stable
# per-PR lane runs the `check!` targets as ordinary nextest tests and
# never uses this profile.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
