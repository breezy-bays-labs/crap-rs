[package]
name = "crap4ts"
version = "2.0.0-rc.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TypeScript adapter for crap-rs — Rust-powered CRAP score analyzer combining oxc AST complexity with Istanbul JSON coverage"
keywords = ["crap", "complexity", "coverage", "typescript", "quality"]
categories = ["development-tools::testing", "command-line-utilities"]
readme = "README.md"

# Single-crate cdylib + bin (CAO A3). The cdylib artifact powers the
# napi-rs Node.js binding; the bin artifact is the standalone CLI that
# mirrors crap4rs/src/main.rs. Both share `src/adapters/*`.
[lib]
name = "crap4ts"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "crap4ts"
path = "src/main.rs"

[features]
# Default build is the standalone `crap4ts` CLI binary — no napi-rs
# linkage, no Node-provided symbols at link time. The napi binding is
# only relevant when producing the `.node` cdylib, so it lives behind
# a feature that the cdylib build (and only the cdylib build) flips
# on. Without this split the `crap4ts` bin would fail to link with
# "Undefined symbols: _napi_create_function …" because `napi_build`'s
# macOS `-undefined dynamic_lookup` directive only applies to the
# `cdylib` crate-type, not to the bin.
default = []
napi-binding = ["dep:napi", "dep:napi-derive"]

[dependencies]
# Language-agnostic foundation: domain types, port traits, CLI shell.
crap-core = { workspace = true }

# TypeScript AST parsing (stubbed in S5 — wired so the dep graph + license
# allowlist are settled before the real walker lands).
oxc = { workspace = true }

# napi-rs Node.js bindings. Optional / behind the `napi-binding`
# feature — see the [features] block above for why. `napi-build` in
# `[build-dependencies]` stays unconditional because its `setup()`
# only emits link directives for the cdylib crate-type, so it's a
# safe no-op for the standalone bin build.
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }

# Serialization — IstanbulParseDiagnostic implements `ParseDiagnostic`
# which requires `Serialize + DeserializeOwned`.
serde = { workspace = true }

# Istanbul JSON coverage parsing — the production code path in
# `adapters::coverage` consumes `serde_json::from_str` to deserialize
# `coverage-final.json`. Previously dev-only while the parser was a
# stub; promoted to runtime in W1.1 (crap-rs#181) when the parser
# became real.
serde_json = { workspace = true }

[dev-dependencies]
# `cli_init_integration` smoke-tests the `crap4ts init` subcommand
# (crap-rs#73) which crap4ts inherits from crap-core via AdapterMeta.
# Each scenario writes into a tempdir so the test doesn't pollute cwd.
tempfile = { workspace = true }

# End-to-end smoke tests (W1.3) invoke the `crap4ts` binary via
# `assert_cmd::Command::cargo_bin` and assert on stdout/stderr/exit
# code. Same cross-crate-invocation pattern crap-core uses for the
# wire-envelope snapshot modules.
assert_cmd = { workspace = true }

# Property-test invariant suite for the oxc walker (crap-rs#207). A
# constrained AST grammar generates valid TS source to assert the 6
# cyclomatic invariants over generated (not hand-picked) inputs —
# independent-axis verification for the #200/#205 traversal arms.
# Regression files in `proptest-regressions/` are committed to git.
proptest = { workspace = true }

# W3.3 (crap-rs#191): cucumber-rs harnesses execute the crap4ts Gherkin
# specs as integration tests. `libtest` feature emits libtest-compatible
# JSON so nextest's `--list` probe degrades gracefully; the harnesses
# are still excluded from nextest via `.config/nextest.toml`'s
# `binary(/.*_cucumber$/)` filter and run under `cargo test --test`.
# The feature is crate-local (not lifted to workspace scope) — only
# crap4rs and crap4ts run cucumber harnesses.
cucumber = { workspace = true, features = ["libtest"] }
tokio = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# ── Cucumber-rs test targets (crap-rs#191) ──
# `harness = false` is mandatory for cucumber-rs (it prints its own
# output instead of going through libtest). Names MUST end in
# `_cucumber` so `.config/nextest.toml` excludes them from nextest
# probing — the suffix is load-bearing, not cosmetic.
[[test]]
name = "cyclomatic_walker_cucumber"
harness = false

[[test]]
name = "metric_unsupported_cucumber"
harness = false

[[test]]
name = "parity_with_v1_cucumber"
harness = false

[[test]]
name = "istanbul_parser_cucumber"
harness = false

[[test]]
name = "arrow_function_coverage_cucumber"
harness = false

[[test]]
name = "file_extensions_cucumber"
harness = false

[[test]]
name = "branch_coverage_cucumber"
harness = false
