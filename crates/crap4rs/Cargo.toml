[package]
name = "crap4rs"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CRAP score analyzer for Rust — find complex, under-tested functions"
keywords = ["crap", "complexity", "coverage", "testing", "quality"]
categories = ["development-tools::testing", "command-line-utilities"]
readme = "README.md"

[package.metadata.binstall]
# The `crap4rs-v{version}` tag prefix is the per-crate tag pattern created
# by release-plz on every crap4rs publish (see release-plz.toml workspace
# `git_tag_name`). The `release-plz.yml` workflow's build-crap4rs-binaries
# matrix produces tarballs at exactly the `{name}-{target}.tar.gz` shape
# this URL expects, and the matrix's filename-invariant assertion step
# fails loudly if a future edit drifts that shape.
pkg-url = "{ repo }/releases/download/crap4rs-v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
# Binary lives at the archive root (the build matrix's
# `tar -C target/{target}/release crap4rs` places it there).
# `"."` resolves to an empty source path under cargo-binstall ≥ 1.x and forces fallback to
# `cargo install`. `{ bin }{ binary-ext }` resolves to `crap4rs` on Linux/macOS, `crap4rs.exe`
# on Windows. Closes #101.
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "crap4rs"
path = "src/lib.rs"

[[bin]]
name = "crap4rs"
path = "src/main.rs"

[dependencies]
# Language-agnostic foundation: domain types, port traits, shared invariants.
crap-core = { workspace = true }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }

# AST parsing for complexity analysis
syn = { workspace = true }
proc-macro2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Terminal output
comfy-table = { workspace = true }
colored = { workspace = true }

# Config file parsing
toml = { workspace = true }

# Regex (hunk header parsing in diff adapter)
regex = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File discovery
ignore = { workspace = true }

# Glob matching for per-path threshold overrides
globset = { workspace = true }

[dev-dependencies]
# Pull `crap_core::test_strategies::*` (proptest generators + the
# `DummyParseDiagnostic` stub) into crap4rs's test build via the
# `test-helpers` feature. Production builds leave it off.
crap-core = { workspace = true, features = ["test-helpers"] }
proptest = { workspace = true }
pretty_assertions = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
# Schema round-trip validation for `--format scorecard-row`.
# Validates emitted Row::CrapDelta JSON against the locked schema
# fragment at tests/fixtures/scorecard/schema.json.
jsonschema = { workspace = true }
# BDD execution of `tests/features/*.feature` files (issue #115).
# Adopted incrementally: `json_reporter.feature` is the POC; future
# feature files migrate one at a time. cucumber-rs requires a test
# target with `harness = false` because it prints its own output
# instead of the libtest harness. The `libtest` feature is added per
# crate (NOT lifted to workspace scope) — only crap4rs runs the
# harness; future siblings (crap4ts) consume their own bindings.
cucumber = { workspace = true, features = ["libtest"] }
tokio = { workspace = true }
# Cross-crate binary invocation for the multi-language BDD harness:
# `multi_lang_html_cucumber.rs` runs the `crap-render` binary that
# ships from crap-core (PR ζ #315). `env!("CARGO_BIN_EXE_*")` is only
# set inside the bin's own crate's tests, so assert_cmd's workspace-
# aware `Command::cargo_bin("crap-render")` is required here.
assert_cmd = { workspace = true }

# ── Cucumber-rs test targets ──
# Each migrated `.feature` file gets its own `[[test]]` entry. The
# `harness = false` flag is mandatory for cucumber-rs (see #115).
[[test]]
name = "json_reporter_cucumber"
harness = false

[[test]]
name = "cli_ergonomics_cucumber"
harness = false

[[test]]
name = "cli_init_cucumber"
harness = false

[[test]]
name = "github_annotations_cucumber"
harness = false

[[test]]
name = "multi_lang_html_cucumber"
harness = false
