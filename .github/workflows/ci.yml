name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default workflow permissions: least privilege. Per-job overrides below
# elevate where needed (e.g. scorecard-smoke needs `pull-requests: write`
# to post the sticky scorecard comment). Closes the workflow-wide leg of
# the `excessive-permissions` zizmor audit.
permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always
  # Single source of truth for the smoke jobs' threshold input — both
  # `scorecard-smoke-rust` and `scorecard-smoke-ts` (and the preset
  # spot-check steps under `scorecard-smoke-rust`) consume this. The
  # rust smoke uses a tighter strict cutoff for its main invocation
  # (see the in-job rationale), so this env var owns the TS smoke's
  # default-tier check + the preset spot-checks' baseline value.
  CRAP_SMOKE_THRESHOLD: '15'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86
          - os: macos-latest
            name: macos-arm
          - os: macos-15-intel
            name: macos-x86
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@f48d2f8ba2b452934c948b7be1a768079c3632ff # v2
        with:
          tool: cargo-nextest@0.9
      - name: Verify cargo + nextest resolve (broken-rustup canary)
        # Bare `cargo` / `cargo nextest` here confirm the macOS rustup
        # reinstall put ~/.cargo/bin on PATH and that nextest resolves —
        # failing at a clearly-labelled step instead of deep in the run.
        run: |
          cargo --version
          cargo nextest --version
      - run: cargo nextest run --workspace --all-targets
      # Cucumber-rs targets (#115) speak their own CLI, not libtest's
      # `--list --format terse`; nextest excludes them via
      # `.config/nextest.toml` and they run via `cargo test`. Without
      # this step the `@wired` BDD status would be enforced only by the
      # `lefthook.yml` pre-push hook, not on every PR.
      - run: >-
          cargo test
          --test json_reporter_cucumber
          --test metric_unsupported_cucumber
          --test cyclomatic_walker_cucumber
          --test parity_with_v1_cucumber
          --test istanbul_parser_cucumber
          --test arrow_function_coverage_cucumber
          --test file_extensions_cucumber
          --test branch_coverage_cucumber

  crap4ts-build:
    # Per-platform build check for the new `crap4ts` shell crate (S5,
    # #137). Two artifacts share the crate: the standalone `crap4ts`
    # bin (default features) and the `libcrap4ts` cdylib used by the
    # napi-rs Node binding (`--features napi-binding --lib`). Both
    # need to compile cleanly on every platform the workspace claims
    # to support so the v2 walker pipeline (follow-up) doesn't
    # discover platform-link surprises after the fact.
    #
    # The macOS dynamic_lookup link arg comes from `napi_build::setup()`
    # in `crates/crap4ts/build.rs`; on the bin target (without the
    # `napi-binding` feature) there are no napi symbols to resolve,
    # which is why the bin builds with default features only.
    #
    # Coverage of the bin path is already in the `test` job's
    # `cargo nextest run --workspace --all-targets`; this job is the
    # cdylib-specific gate. linux-arm now runs on the GitHub-hosted
    # `ubuntu-24.04-arm` image (GA early 2026 for public repos on this
    # org's billing tier) — the cdylib gate covers all four platforms
    # crap4ts ships native binaries for (#154). Scope is `crap4ts-build`
    # only; extending the `test` matrix to linux-arm stays a separate
    # decision.
    name: crap4ts build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86
          - os: ubuntu-24.04-arm
            name: linux-arm
          - os: macos-latest
            name: macos-arm
          - os: macos-15-intel
            name: macos-x86
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: crap4ts-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build crap4ts bin (default features)
        run: cargo build --package crap4ts --release
      - name: No-feature bin canary -- bin must not carry napi_ symbols
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/crap4ts"
          test -f "$BIN"
          if nm "$BIN" 2>/dev/null | grep -q "napi_"; then
            echo "::error::bin links napi_ symbols (feature-gate leakage)"
            nm "$BIN" | grep "napi_" | head -10
            exit 1
          fi
          case "$RUNNER_OS" in
            macOS)
              if otool -L "$BIN" | grep -i napi; then
                echo "::error::bin has napi dylib linkage"
                exit 1
              fi
              ;;
          esac
          echo "OK: no napi_ symbols in standalone bin"
      - name: Build crap4ts cdylib (napi-binding feature)
        run: cargo build --package crap4ts --features napi-binding --lib --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@f48d2f8ba2b452934c948b7be1a768079c3632ff # v2
        with:
          tool: cargo-nextest@0.9
      - uses: taiki-e/install-action@f48d2f8ba2b452934c948b7be1a768079c3632ff # v2
        with:
          tool: cargo-llvm-cov@0.6
      - run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          retention-days: 7

  self-check:
    name: Self-referential CRAP check
    runs-on: ubuntu-latest
    needs: [coverage, clippy, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov
      - run: cargo build --release --package crap4rs
      # S4 (#136) widens self-check from one-shot `--src crates/crap4rs/src`
      # to per-crate run-twice. Both must pass. NOT `--src crates` —
      # InputArgs.src is single-path; recursive walk would pull in
      # crates/crap4ts/napi/ (post-S5), tests/fixtures/*.lcov, proptest
      # seeds. Targeted `--src` per crate keeps the boundary strict.
      - name: Debug — LCOV SF path shape
        # Diagnostic only. LcovParser::normalize_path strips an absolute
        # `--src` prefix from absolute SF records, so absolute paths are
        # fine. This step prints a sample so a future run-twice mismatch
        # has visible evidence (e.g. path divergence between
        # `--src crates/crap-core/src` and the SF prefix in lcov.info).
        run: |
          set -euo pipefail
          echo "First 5 SF records in lcov.info:"
          head -200 lcov.info | grep '^SF:' | head -5 || true
          echo "Working directory: $PWD"
      # --threshold 15 (the post-#272 `default` tier) is a temporary
      # softening of the self-check while crap-rs#273 refactors the 23
      # functions in (8, 15] CRAP back under the new --strict cutoff
      # (cognitive 8). When #273 lands all three legs flip back to
      # --strict and this comment + the tracked: marker can come out.
      # tracked: crap-rs#273
      - name: Self-CRAP — crap-core
        run: ./target/release/crap4rs --coverage lcov.info --src crates/crap-core/src --threshold 15 --color always
      # tracked: crap-rs#273
      - name: Self-CRAP — crap4rs
        run: ./target/release/crap4rs --coverage lcov.info --src crates/crap4rs/src --threshold 15 --color always
      # crap4ts/src is Rust — analyzed by the crap4rs binary, NOT crap4ts
      # (which needs Istanbul JSON; there is no TS in crates/crap4ts/src).
      # Reuses the single ./target/release/crap4rs built once above
      # (rust-cache warm) — no per-leg recompile.
      # tracked: crap-rs#273
      - name: Self-CRAP — crap4ts (Rust source)
        run: ./target/release/crap4rs --coverage lcov.info --src crates/crap4ts/src --threshold 15 --color always

  self-crap-view:
    name: domain/view.rs per-function CC <= 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [coverage]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov
      - run: cargo build --release --package crap4rs
      - name: Assert max CC in crates/crap-core/src/domain/view.rs is <= 15
        # S2 (#134) moved domain/view.rs from crates/crap4rs/src/ to
        # crates/crap-core/src/. Run-twice for a workspace gate is the
        # S4 plan; until then, this targeted invocation analyzes
        # crap-core's source where view.rs now lives. The substring
        # filter still matches "domain/view.rs" verbatim.
        run: |
          set -euo pipefail
          ./target/release/crap4rs --coverage lcov.info --src crates/crap-core/src --threshold 1000 --format json > view-report.json
          python3 - <<'PY'
          import json, sys
          MAX_CC = 15
          with open("view-report.json") as fh:
              data = json.load(fh)
          view_fns = [
              f for f in data["result"]["functions"]
              if "domain/view.rs" in f["scored"]["identity"]["file_path"]
          ]
          offenders = [f for f in view_fns if f["scored"]["complexity"] > MAX_CC]
          if offenders:
              print(f"FAIL: {len(offenders)} function(s) in domain/view.rs exceed CC {MAX_CC}:")
              for f in sorted(offenders, key=lambda x: x["scored"]["complexity"], reverse=True):
                  ident = f["scored"]["identity"]
                  print(f"  CC={f['scored']['complexity']} {ident['qualified_name']} ({ident['file_path']})")
              sys.exit(1)
          worst = max((f["scored"]["complexity"] for f in view_fns), default=0)
          print(f"PASS: {len(view_fns)} fn(s) in domain/view.rs, worst CC={worst} (limit {MAX_CC})")
          PY

  mutants:
    name: Mutation testing (crap-core view.rs + crap4ts walker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@f48d2f8ba2b452934c948b7be1a768079c3632ff # v2
        with:
          tool: cargo-mutants
      - name: Run cargo mutants on crates/crap-core/src/domain/view.rs
        # S2 (#134) moved view.rs from crap4rs to crap-core. Update
        # both --package and --file to follow the move.
        run: cargo mutants --package crap-core --file crates/crap-core/src/domain/view.rs --no-shuffle --in-place
      - name: Run cargo mutants on crates/crap4ts/src/adapters/walker/mod.rs
        # crap-rs#209: the walker is the highest-leverage file in the
        # crap4ts adapter (every decision-point + function-discovery +
        # span-to-line decision routes through it).
        #
        # PER-MERGE GATE (not per-PR). The `on:` block restricts CI to
        # `push: [main]` + `pull_request: [main]`, so a `push` event is
        # exactly a merge-to-main. This step's `if:` therefore runs the
        # walker mutation pass ONLY on merge-to-main; the view.rs step
        # above has no `if:` and stays per-PR. Rationale (crap-rs#209 AC
        # amended from "≤8 min per-PR" → "per-merge"): the walker has
        # ~5× view.rs's mutant count (157 vs ~30) and a full pass is
        # ~1 h even under `-j 4` copy mode — a recurring per-PR tax that
        # is not worth it for a file that changes rarely once Cluster W
        # (#200/#205/#207/#209) lands. Gating at merge keeps every
        # crap4ts PR fast while still gating the walker before
        # crap4ts@2.0.0 GA. Trade-off: a walker regression surfaces at
        # merge, not on the introducing PR (acceptable — the #207
        # proptest suite is the per-PR behavioural net; mutants is the
        # deeper periodic gate). User-confirmed sequencing decision
        # 2026-05-16.
        #
        # `-j 4` copy mode (parallel workers, each reusing the prebuilt
        # `target/` via `.cargo/mutants.toml`'s `copy_target = true`)
        # keeps even the per-merge run tractable. `-j N` and
        # `--in-place` are mutually exclusive by design (parallel
        # workers REQUIRE source copies) — see AGENTS.md "Mutation
        # testing". `--no-shuffle` keeps mutant order deterministic for
        # flaky-mutant triage. The `--skip envelope` test-arg the
        # crap-core run relies on is NOT passed inline: it lives in the
        # repo-global `.cargo/mutants.toml`
        # (`additional_cargo_test_args = ["--", "--skip", "envelope"]`)
        # which cargo-mutants applies to EVERY invocation in this
        # workspace, so it is replicated automatically here — see
        # AGENTS.md "Why additional_cargo_test_args …".
        if: github.event_name == 'push'
        run: cargo mutants -j 4 --package crap4ts --file crates/crap4ts/src/adapters/walker/mod.rs --no-shuffle

  scorecard-smoke-rust:
    # Composite-action-driven smoke for the `crap4rs` dispatch path.
    # The previous Layer 1 direct-binary probe (envelope-shape +
    # markdown-header checks) was dropped in PR #292 — that surface is
    # now owned by the wire-envelope canaries
    # (`crates/crap-core/tests/wire_envelope_crap4rs.rs` + sibling TS
    # files) which assert `tool_version` non-empty pre-strip + the
    # full envelope shape on every `cargo nextest run`. The smoke
    # below stays scoped to exercising the public composite action's
    # plumbing (input parsing, output emission, sticky-comment shape,
    # inline annotations) against the PR's locally-built binary.
    name: Scorecard action smoke — Rust (analysis-only)
    runs-on: ubuntu-latest
    needs: [coverage]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      - name: Build PR binary
        run: cargo build --release --package crap4rs

      - name: Dogfood the scorecard action (rust dispatch)
        id: crap
        uses: ./.github/actions/scorecard-smoke
        with:
          bin-path: ./target/release/crap4rs
          language: rust
          coverage: lcov.info
          src: crates/crap4rs/src
          # Strict cutoff (matches `--strict` for the cognitive metric,
          # see #218 for the calibration). Default threshold 15 turns
          # up zero findings on the current codebase, which leaves the
          # annotations dogfood with nothing to render. Strict surfaces
          # the genuinely-worst routines so a regression in the
          # github-annotations reporter (envelope shape, escape codec,
          # truncation notice) is detectable on the PR itself. Tracking
          # cleanup of the offending functions in
          # https://github.com/breezy-bays-labs/crap-rs/issues/289 so
          # this can eventually flip to `analysis-gate: 'true'`.
          threshold: '8'
          comment-mode: ${{ github.event_name == 'pull_request' && 'sticky' || 'none' }}
          comment-header: 'crap-scorecard-self'
          # End-to-end smoke for the github-annotations reporter — the
          # runner intercepts `::warning ...` lines from the action's
          # stdout and renders them inline on this PR's Files Changed
          # tab. The action's `Emit inline annotations` step runs the
          # PR-staged crap4rs with `--format github-annotations`, so a
          # broken envelope shape or escape regression surfaces as a
          # missing/mangled annotation on the PR itself.
          annotations: 'true'

      # ----------------------------------------------------------------
      # Preset spot-checks (PR #292 acceptance gate #11).
      #
      # The plan calls out that we must verify the preset-to-raw
      # threshold mapping mechanically — documentation rots; CI doesn't.
      # Each step below invokes the scorecard action with a different
      # preset shape and asserts the resolved threshold matches the
      # locked calibration table (strict=8, default=15, lenient=25),
      # plus one mixed step covering the actual-conflict warning case.
      #
      # All four steps reuse the workspace's own lcov.info + the
      # PR-staged crap4rs binary; they do NOT post sticky comments
      # (the main dogfood above owns that surface) and they do NOT
      # exercise inline annotations (covered above) — they exist
      # solely to lock the preset surface.
      # ----------------------------------------------------------------
      - name: Preset spot-check — strict
        id: preset-strict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: strict
          comment-mode: 'none'
      - name: Assert strict resolved to 8
        env:
          RESOLVED: ${{ steps.preset-strict.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "8" ]; then
            echo "::error::strict preset resolved to '$RESOLVED'; expected 8"
            exit 1
          fi
          echo "strict → threshold=8 ✓"

      - name: Preset spot-check — default
        id: preset-default
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: default
          comment-mode: 'none'
      - name: Assert default resolved to env var
        env:
          RESOLVED: ${{ steps.preset-default.outputs.threshold-resolved }}
          EXPECTED: ${{ env.CRAP_SMOKE_THRESHOLD }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::default preset resolved to '$RESOLVED'; expected $EXPECTED"
            exit 1
          fi
          echo "default → threshold=$EXPECTED ✓"

      - name: Preset spot-check — lenient
        id: preset-lenient
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: lenient
          comment-mode: 'none'
      - name: Assert lenient resolved to 25
        env:
          RESOLVED: ${{ steps.preset-lenient.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "25" ]; then
            echo "::error::lenient preset resolved to '$RESOLVED'; expected 25"
            exit 1
          fi
          echo "lenient → threshold=25 ✓"

      - name: Preset spot-check — actual-conflict warning (strict + threshold:20)
        id: preset-conflict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: strict
          threshold: '20'
          comment-mode: 'none'
      - name: Assert explicit threshold wins on conflict
        env:
          RESOLVED: ${{ steps.preset-conflict.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          # Explicit `threshold: '20'` differs from strict-derived 8,
          # so the action emits a `::warning::` and the explicit value
          # wins (additive shim discipline per ADR public-api-shim).
          # The warning itself surfaces in the workflow log; this step
          # locks the wins-on-conflict half of the contract.
          if [ "$RESOLVED" != "20" ]; then
            echo "::error::explicit threshold:20 + strict preset resolved to '$RESOLVED'; expected 20 (explicit wins)"
            exit 1
          fi
          echo "strict + threshold:20 → threshold=20 (explicit wins, warning emitted) ✓"

      - name: Preset spot-check — no-conflict (default + threshold:15)
        id: preset-no-conflict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: default
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert no-conflict resolves cleanly
        env:
          RESOLVED: ${{ steps.preset-no-conflict.outputs.threshold-resolved }}
          EXPECTED: ${{ env.CRAP_SMOKE_THRESHOLD }}
        run: |
          set -euo pipefail
          # default preset derives the same value the explicit
          # threshold passes, so no actual conflict, no warning, no
          # surprise. This is the "you set both" case that the plan
          # explicitly does NOT warn on (the false-default-
          # indistinguishable-from-explicit gotcha — see the
          # `Resolve presets` step's inline rationale).
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::default preset + matching threshold resolved to '$RESOLVED'; expected $EXPECTED"
            exit 1
          fi
          echo "default + threshold:$EXPECTED → threshold=$EXPECTED (no conflict, no warning) ✓"

  scorecard-smoke-ts:
    # Sibling of `scorecard-smoke-rust` for the TypeScript dispatch
    # path. Build crap4ts from the PR, stage it on PATH (the only
    # install strategy the action's typescript branch supports today —
    # see AGENTS.md "crap4ts install constraint"), prepare a tiny
    # Istanbul JSON fixture from the workspace's ts-fixtures corpus,
    # then dogfood the composite action with `.json` coverage and
    # assert the same outputs land as the rust dispatch.
    #
    # Layer 1 direct-binary probe was dropped in PR #292 (canary
    # takeover — see scorecard-smoke-rust rationale + the three wire
    # envelope canaries in `crates/crap-core/tests/wire_envelope_*.rs`).
    name: Scorecard action smoke — TypeScript (analysis-only)
    runs-on: ubuntu-latest
    # comment-mode: 'none' below — this job never posts a PR comment,
    # so `contents: read` is sufficient. The rust-side
    # `scorecard-smoke-rust` job owns the per-PR sticky-comment slot
    # and elevates accordingly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Build crap4ts from the PR's source so the smoke dogfoods this
      # PR's binary, not a downstream release. Mirrors the
      # `scorecard-smoke-rust` pattern for crap4rs.
      - name: Build PR crap4ts binary
        run: cargo build --release --bin crap4ts

      # Prepare a tiny Istanbul fixture under a stable workspace path
      # (RUNNER_TEMP/ts-smoke) so the action's `--src` input resolves
      # the coverage `path` entries cleanly. The jest fixture template
      # uses `{SRC_ROOT}` substitution (matches
      # `crates/crap-core/tests/wire_envelope_crap4ts.rs::build_fixture`).
      - name: Prepare Istanbul JSON fixture
        id: fixture
        env:
          SRC_ROOT: ${{ runner.temp }}/ts-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/simple.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/arrow.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/Button.tsx "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/map.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/mixed.ts "$SRC_ROOT/"
          # `{SRC_ROOT}` is the literal placeholder used by every
          # fixture under `crates/crap4ts/tests/fixtures/istanbul-jest/`;
          # the wire_envelope_crap4ts test substitutes the same way.
          sed "s|{SRC_ROOT}|$SRC_ROOT|g" \
            crates/crap4ts/tests/fixtures/istanbul-jest/coverage-final.json \
            > "$SRC_ROOT/coverage-final.json"
          echo "coverage=$SRC_ROOT/coverage-final.json" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_ROOT" >> "$GITHUB_OUTPUT"

      - name: Dogfood the scorecard action (typescript dispatch)
        id: crap
        uses: ./.github/actions/scorecard-smoke
        with:
          bin-path: ./target/release/crap4ts
          language: typescript
          coverage: ${{ steps.fixture.outputs.coverage }}
          src: ${{ steps.fixture.outputs.src }}
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          # No sticky comment on the ts smoke — the crap4rs sticky
          # comment owns the per-PR scorecard slot; a second sticky
          # under a different header is review noise.
          comment-mode: 'none'

  scorecard-smoke-multi-lang:
    # Multi-language single-CI smoke for PR #293 — exercises the
    # `languages: rust,typescript` / `languages: all` dispatch path
    # added by the multi-language extension. Stages BOTH PR-built
    # binaries onto PATH (so the action's pre-installed-detection
    # picks them up), prepares both Rust LCOV + TS Istanbul fixtures,
    # then runs the 8 parsing-edge-case spot checks the PR β
    # acceptance gates call out. Single CI job (not a matrix) since
    # each spot check is one composite-action invocation, and the
    # invocations share the same staged binaries + fixture prep.
    #
    # SECURITY NOTE: every `run:` block reads only step outputs and
    # workflow env vars via the `env:` indirection pattern (per the
    # GH-workflow-injection guidance). No `github.event.*` /
    # `github.head_ref` interpolation appears in any shell body.
    name: Scorecard action smoke — multi-language
    runs-on: ubuntu-latest
    needs: [coverage]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      # Build BOTH binaries from the PR's source so the multi-language
      # smoke dogfoods this PR's adapters end-to-end. Mirrors the
      # `scorecard-smoke-rust` (`cargo build --release --package crap4rs`)
      # and `scorecard-smoke-ts` (`cargo build --release --bin crap4ts`)
      # patterns combined. `--bin crap4ts` lives in the crap4ts package
      # (not crap4rs), so the build invokes both packages explicitly.
      - name: Build PR binaries (crap4rs + crap4ts)
        run: cargo build --release --package crap4rs --package crap4ts

      - name: Stage PR binaries as pre-installed adapters
        run: |
          set -euo pipefail
          # Multi-language mode requires BOTH adapters discoverable on
          # PATH. The public scorecard action's pre-installed-detection
          # short-circuits its binstall steps when `crap4rs --version`
          # and `crap4ts --version` resolve to executables under PATH,
          # so staging both into `$HOME/.cargo/bin` (which the GitHub-
          # hosted runner pre-pends to PATH) is the standard pattern.
          # The `scorecard-smoke` internal composite uses the same shape.
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 ./target/release/crap4rs "$HOME/.cargo/bin/crap4rs"
          install -m 0755 ./target/release/crap4ts "$HOME/.cargo/bin/crap4ts"
          crap4rs --version
          crap4ts --version

      # Prepare a tiny Istanbul fixture under a stable workspace path
      # so the action's `--src-ts` input resolves the coverage `path`
      # entries cleanly. Same template substitution as `scorecard-smoke-ts`.
      - name: Prepare Istanbul JSON fixture (TS side)
        id: ts-fixture
        env:
          SRC_ROOT: ${{ runner.temp }}/ts-multi-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/simple.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/arrow.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/Button.tsx "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/map.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/mixed.ts "$SRC_ROOT/"
          sed "s|{SRC_ROOT}|$SRC_ROOT|g" \
            crates/crap4ts/tests/fixtures/istanbul-jest/coverage-final.json \
            > "$SRC_ROOT/coverage-final.json"
          echo "coverage=$SRC_ROOT/coverage-final.json" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_ROOT" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Spot-check matrix (PR #293 acceptance gate #7).
      #
      # 8 single-step invocations covering the parsing edge cases the
      # shape doc Open Q 2 enumerated. Each step pairs a `with:` block
      # exercising one input shape with a matching assertion step
      # reading the action's resolved outputs. The full list:
      #   1. languages: rust              — single-language back-compat
      #   2. languages: typescript        — single-language back-compat
      #   3. languages: rust,typescript   — multi-language explicit
      #   4. languages: all               — multi-language convenience
      #   5. "languages: rust, typescript" (whitespace) — multi-language
      #   6. languages: rust,rust         — dedup warning + single-lang
      #   7. languages: rust,typescript w/o coverage-ts — actionable error
      #   8. languages: garbage           — actionable error
      #
      # Cases 1-6 succeed and assert output shape; cases 7-8 are
      # expected-failure invocations exercised via `continue-on-error:
      # true` + a follow-up step that asserts the prior step's outcome
      # was `failure` — that proves the error surfaced rather than
      # silently passing.
      # ----------------------------------------------------------------

      - name: Spot-check 1 — languages=rust (single-language back-compat)
        id: spot-rust
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: rust
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 1 single-language outputs
        env:
          ROW_JSON: ${{ steps.spot-rust.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-rust.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-rust.outputs.row-json-typescript }}
          MARKDOWN: ${{ steps.spot-rust.outputs.markdown }}
        run: |
          set -euo pipefail
          # Single-language back-compat invariants:
          #   * legacy `row-json` populated (every existing consumer)
          #   * split `row-json-rust` ALSO populated (forward-compat)
          #   * split `row-json-typescript` empty (TS didn't run)
          #   * markdown carries NO `## CRAP scorecard` outer wrapper
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 1: legacy row-json empty in single-language rust mode"
            exit 1
          fi
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 1: row-json-rust empty in languages=rust"
            exit 1
          fi
          if [ -n "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 1: row-json-typescript non-empty in languages=rust (got: $ROW_JSON_TS)"
            exit 1
          fi
          if printf '%s' "$MARKDOWN" | grep -qE '^## CRAP scorecard$'; then
            echo "::error::spot-check 1: single-language markdown should NOT carry the multi-language outer wrapper"
            exit 1
          fi
          echo "spot-check 1 (languages=rust) ✓"

      - name: Spot-check 2 — languages=typescript (single-language back-compat)
        id: spot-ts
        uses: ./.github/actions/scorecard
        with:
          coverage: ${{ steps.ts-fixture.outputs.coverage }}
          src: ${{ steps.ts-fixture.outputs.src }}
          languages: typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 2 single-language outputs
        env:
          ROW_JSON: ${{ steps.spot-ts.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-ts.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-ts.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 2: legacy row-json empty in single-language typescript mode"
            exit 1
          fi
          if [ -n "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 2: row-json-rust non-empty in languages=typescript"
            exit 1
          fi
          if [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 2: row-json-typescript empty in languages=typescript"
            exit 1
          fi
          echo "spot-check 2 (languages=typescript) ✓"

      - name: Spot-check 3 — languages=rust,typescript (multi-language explicit)
        id: spot-multi
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: rust,typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 3 multi-language outputs
        env:
          ROW_JSON: ${{ steps.spot-multi.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-multi.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-multi.outputs.row-json-typescript }}
          MARKDOWN: ${{ steps.spot-multi.outputs.markdown }}
        run: |
          set -euo pipefail
          # Multi-language invariants:
          #   * legacy `row-json` EMPTY (with `::warning::` in job log
          #     directing consumers to the split outputs)
          #   * both split outputs populated
          #   * markdown carries `## CRAP scorecard` wrapper + per-
          #     language `### Rust (crap4rs)` AND `### TypeScript
          #     (crap4ts)` section headers
          if [ -n "$ROW_JSON" ]; then
            echo "::error::spot-check 3: legacy row-json should be EMPTY in multi-language mode (got: $ROW_JSON)"
            exit 1
          fi
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 3: row-json-rust empty in multi-language mode"
            exit 1
          fi
          if [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 3: row-json-typescript empty in multi-language mode"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^## CRAP scorecard$'; then
            echo "::error::spot-check 3: multi-language markdown missing '## CRAP scorecard' outer wrapper"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^### Rust \(crap4rs\)$'; then
            echo "::error::spot-check 3: multi-language markdown missing '### Rust (crap4rs)' section header"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^### TypeScript \(crap4ts\)$'; then
            echo "::error::spot-check 3: multi-language markdown missing '### TypeScript (crap4ts)' section header"
            exit 1
          fi
          echo "spot-check 3 (languages=rust,typescript) ✓"

      - name: Spot-check 4 — languages=all (multi-language convenience expansion)
        id: spot-all
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: all
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 4 expansion matches explicit form
        env:
          ROW_JSON_RUST: ${{ steps.spot-all.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-all.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          # `all` is the convenience expansion for the full multi-language
          # set. Today that's rust,typescript; the dispatch should
          # behave IDENTICALLY to the explicit form (spot-check 3).
          if [ -z "$ROW_JSON_RUST" ] || [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 4: languages=all did not produce both split outputs"
            exit 1
          fi
          echo "spot-check 4 (languages=all) ✓"

      - name: Spot-check 5 — languages with whitespace (multi-language)
        id: spot-ws
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: 'rust, typescript'
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 5 whitespace tolerated
        env:
          ROW_JSON_RUST: ${{ steps.spot-ws.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-ws.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          if [ -z "$ROW_JSON_RUST" ] || [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 5: 'rust, typescript' (whitespace) did not produce both split outputs"
            exit 1
          fi
          echo "spot-check 5 (languages='rust, typescript') ✓"

      - name: Spot-check 6 — languages=rust,rust (dedup → single-language + warning)
        id: spot-dedup
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: 'rust,rust'
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 6 dedup collapses to single-language
        env:
          ROW_JSON_RUST: ${{ steps.spot-dedup.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-dedup.outputs.row-json-typescript }}
          ROW_JSON: ${{ steps.spot-dedup.outputs.row-json }}
        run: |
          set -euo pipefail
          # The dedupe warning itself goes to the workflow log (the
          # action emits `::warning::scorecard action: 'languages:
          # rust,rust' contains duplicate token 'rust' ...`); this
          # assertion locks the dedupe BEHAVIOR (single-language dispatch
          # after collapse), not the warning text. After collapse,
          # `rust,rust` should behave identically to `languages: rust`
          # (spot-check 1).
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' did not produce row-json-rust"
            exit 1
          fi
          if [ -n "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' produced TS output (should collapse to single-language rust)"
            exit 1
          fi
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' should populate legacy row-json (single-language back-compat)"
            exit 1
          fi
          echo "spot-check 6 (languages=rust,rust → dedup ✓)"

      - name: Spot-check 7 — multi-language without coverage-ts (actionable error)
        id: spot-missing-pair
        uses: ./.github/actions/scorecard
        continue-on-error: true
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          # Intentionally OMIT coverage-ts + src-ts; the pre-execution
          # validator in `Resolve presets` should error actionably.
          languages: rust,typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 7 surfaced the paired-input error
        env:
          OUTCOME: ${{ steps.spot-missing-pair.outcome }}
        run: |
          set -euo pipefail
          # `continue-on-error: true` makes the action's failure
          # non-fatal to the job; we then assert the OUTCOME was
          # actually `failure` so the pre-execution validator didn't
          # silently let multi-language mode run without the paired
          # input set.
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::spot-check 7: action should have failed on missing coverage-ts but outcome=$OUTCOME"
            exit 1
          fi
          echo "spot-check 7 (missing coverage-ts → actionable error ✓)"

      - name: Spot-check 8 — languages=garbage (actionable error)
        id: spot-garbage
        uses: ./.github/actions/scorecard
        continue-on-error: true
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: garbage
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 8 surfaced the unsupported-token error
        env:
          OUTCOME: ${{ steps.spot-garbage.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::spot-check 8: action should have failed on languages=garbage but outcome=$OUTCOME"
            exit 1
          fi
          echo "spot-check 8 (languages=garbage → actionable error ✓)"

  msrv:
    # Pre-flight gate at the workspace's declared `rust-version`. The
    # original CEng audit (B3) ran lib-only `cargo +1.85 check` and
    # missed dev-dep MSRV blockers (cucumber 0.22 needs 1.88, jsonschema
    # → idna → icu chain needs 1.86). `--all-targets` exercises the
    # full target set (lib, bin, tests) and surfaces those.
    # Bumped 1.88 → 1.93 to unlock current oxc (the TS walker dep) and
    # avoid the running carry-cost of holding oxc back across releases.
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2ea1b3bdd0261867664fd125505456a7b9c3385c # tracks @1.93 branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: crap4rs-msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # cargo-deny is the supply-chain gate itself; the SHA pin guards
      # against tag poisoning silently disabling every other
      # supply-chain check. The repo-wide SHA-pinning sweep (#233)
      # brought every other action up to the same standard — see
      # AGENTS.md "Supply-chain hygiene".
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2
        with:
          command: check

  ast-purity:
    # Source-level grep enforcing that crap-core stays AST-library-pure.
    # The hexagonal layout (CLAUDE.md) bans `syn`, `quote`, `proc-macro2`,
    # `tree-sitter`, `swc`, `oxc` from crap-core so the same library can
    # be linked by every adapter (crap4rs via syn, future crap4ts via
    # swc/oxc). cargo-deny's transitive ban (`bans.deny.wrappers`) would
    # false-positive on serde_derive's proc-macro chain or require a
    # fragile, ever-growing wrapper list — see deny.toml's "AST-library
    # policy" comment for the full rationale.
    #
    # Hardened in #145 with two additional checks:
    #   - Grouped-import multi-line regex (catches `use { syn::Foo };`
    #     and the multi-line `use {\n    syn::Item,\n};` form that the
    #     original leading-token regex misses).
    #   - Direct-dependency `cargo metadata --no-deps` check (catches
    #     `syn = "2.0"` being added to crates/crap-core/Cargo.toml).
    #
    # No untrusted input is interpolated into any `run:` block; every
    # regex / jq expression is a literal static string.
    name: crap-core AST-library purity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install ripgrep
        # `ubuntu-latest` runner images do not ship ripgrep on every
        # generation (empirically observed via #261's `command -v rg`
        # guard tripping on this PR's run). Three steps in this job
        # shell `rg` — the L2 grouped-import check, the L3.5 adapter-
        # name literal check (#161), and the L4 adapter-vocabulary
        # check (#261). The L2 and L3.5 steps use the
        # `if rg ...; then`/`|| true` patterns that silently treat a
        # missing `rg` as "no matches found" and exit 0; the L4 step
        # added in #261 surfaces this loudly via `command -v rg`.
        # Explicit install closes the gap so all three layers
        # actually execute. ~10-15s wall-clock overhead per CI run.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Reject AST-library imports in crap-core (leading-token form)
        # Scope: crap-core ONLY. oxc/swc imports are legitimate in
        # crates/crap4ts/ once that lands; crap4rs uses syn. Do NOT
        # widen the path below to `crates/*/src/` — that would reject
        # every adapter. Static pattern, no untrusted-input
        # interpolation. Regex notes:
        #   - Matches both `use` and `extern crate` forms.
        #   - Optional `(::)?` handles absolute-path imports
        #     (`use ::syn::Foo`).
        #   - Trailing `([_:; ]|$)` is a portable word-boundary
        #     substitute that works on GNU and BSD grep (avoids `\b`/
        #     `\w` non-portable shortcuts). Catches `syn::`, `syn;`,
        #     `syn_codegen::`, `swc_ecma_parser::`,
        #     `tree_sitter_typescript::`, etc.; rejects false
        #     positives like `use syntactic_analysis::X`.
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*(use|extern[[:space:]]+crate)[[:space:]]+(::)?(syn|quote|proc_macro2?|tree_sitter|swc|oxc)([_:; ]|$)' crates/crap-core/src/; then
            echo "::error::crap-core must not import AST libraries (leading-token form, e.g. \`use syn::Foo;\`) — see CLAUDE.md and shaping.md"
            exit 1
          fi
          echo "crap-core leading-token imports: clean"
      - name: Reject AST-library imports in crap-core (grouped-import form)
        # Catches `use { syn::Foo };` and the multi-line variant
        # `use {\n    syn::Item,\n};` which the leading-token regex
        # above misses (since the first token after `use` is `{`, not
        # the banned crate). Uses ripgrep's multiline mode (-U) +
        # PCRE2 for `\b` word boundaries. ripgrep ships on
        # ubuntu-latest's default toolchain.
        #
        # The pattern bounds the match to a single `use { … }` block
        # via `[^}]*`, so nested braces inside a different scope
        # cannot drag a false-positive across statements.
        run: |
          set -euo pipefail
          if rg -nU --pcre2 'use\s*\{[^}]*\b(syn|quote|proc_macro2?|tree_sitter|swc|oxc)\b' crates/crap-core/src/; then
            echo "::error::crap-core must not import AST libraries (grouped-import form, e.g. \`use { syn::Foo };\`) — see CLAUDE.md and shaping.md"
            exit 1
          fi
          echo "crap-core grouped imports: clean"
      - name: Reject AST-library direct dependencies in crap-core/Cargo.toml
        # `cargo metadata --no-deps` lists workspace packages with
        # their declared dependencies but does NOT resolve the
        # transitive graph — so serde_derive's transitive `syn` does
        # not false-positive (the documented reason cargo-deny
        # transitive bans were rejected; see shaping.md "Patterns
        # NOT copied" #3). Caught case: someone adds
        # `syn = "2.0"` directly to crates/crap-core/Cargo.toml.
        run: |
          set -euo pipefail
          banned=$(cargo metadata --format-version 1 --no-deps |
            jq -r '
              .packages[] |
              select(.name == "crap-core") |
              .dependencies[] |
              select(.name | test("^(syn|quote|proc-macro2|tree-sitter|swc|oxc)$")) |
              .name')
          if [ -n "$banned" ]; then
            echo "::error::crap-core declares banned direct dependency: $banned (see CLAUDE.md and shaping.md)"
            exit 1
          fi
          echo "crap-core direct dependencies: clean"
      - name: Reject adapter-name string literals in crap-core
        # Structural protection against silent re-coupling: if a future
        # change re-introduces `"crap4rs"` or `"crap4ts"` as a string
        # literal in crap-core source, that's a regression — adapter
        # names belong in `AdapterMeta` supplied by the binary, never
        # baked into the language-agnostic library (#161).
        #
        # Doc comments and code comments (`///`, `//!`, `//`, `/*`
        # block openers, leading `*` continuation lines) are allowed
        # to mention the adapter names — those are legitimate
        # references in the API surface docstrings. The awk filter
        # strips rg's `path:lineno:` prefix and only fires on lines
        # whose content (after optional whitespace) does NOT start
        # with a comment marker.
        #
        # No untrusted-input interpolation: literals and patterns are
        # static; `rg`/`awk` invocations contain no `${{ github.* }}`
        # references.
        run: |
          set -euo pipefail
          hits=$(rg -nF -e '"crap4rs"' -e '"crap4ts"' crates/crap-core/src 2>/dev/null || true)
          if [ -z "$hits" ]; then
            echo "crap-core adapter-name literals: clean"
            exit 0
          fi
          non_comment_hits=$(echo "$hits" | awk -F: '
            {
              content = ""
              for (i = 3; i <= NF; i++) content = content (i > 3 ? ":" : "") $i
              gsub(/^[ \t]+/, "", content)
              if (content !~ /^(\/\/|\/\*|\*)/) print
            }
          ')
          if [ -n "$non_comment_hits" ]; then
            echo "::error::crap-core must not contain \"crap4rs\" / \"crap4ts\" string literals — adapter names belong in AdapterMeta from the binary (see #161)"
            echo "$non_comment_hits"
            exit 1
          fi
          echo "crap-core adapter-name literals: clean (comment-only references allowed)"
      - name: Reject adapter-vocabulary string literals in crap-core
        # Layer 4 of crap-core's purity gate. Layers 1-3 (above) ban
        # `syn`/`oxc`/`tree_sitter`/etc. at the import + direct-dep
        # level. This layer bans the vocabulary of adapter-specific
        # coverage source formats from appearing inside user-facing
        # string literals (`format!`, `#[error("…")]`, bare `"…"`).
        #
        # Banlist (case-sensitive, proper-noun forms): `LCOV`,
        # `Istanbul`, `TypeScript`, `LCOV-flavou?red`. These are
        # source-format tokens, not AST-library tokens — a leak via
        # `format!("Failed to parse LCOV: {err}")` is not caught by
        # L1/L2/L3 because no import or dep change is required. The
        # case-sensitive proper-noun match is the noise filter that
        # distinguishes user-prose ("LCOV parse issue") from
        # filename literals like `"lcov.info"` and fixture paths
        # like `"src/adapters/lcov.rs"` — those use lowercase by
        # convention and aren't English-prose leaks.
        #
        # `rg` flag note: ripgrep treats patterns as regex by
        # default; the `-E` flag in ripgrep means `--encoding`,
        # NOT `--extended-regex` (which is grep's `-E`). Bare
        # invocation `rg PATTERN PATH` is the right shape.
        #
        # Tool-presence check: `rg` must be on PATH or the gate
        # would silently pass via `|| true` (the false-sense-of-
        # security trap). On `ubuntu-latest` ripgrep is preinstalled.
        #
        # Doc/inline/block comments are allowed to mention these
        # tokens (the awk filter skips lines whose content starts
        # with `//`, `/*`, `* ` followed by space, or bare `*` at
        # end of line — covering `///`, `//!`, `/* … */` openers,
        # and ` * ` / ` *` continuation lines without swallowing
        # Rust deref-assignment like `*ptr = "LCOV"`).
        #
        # The bare `*` form (no space) is intentionally NOT
        # comment-skipped — Rust comment continuation uses ` * `
        # (space-asterisk-space) or a bare ` *` (space-asterisk-EOL).
        # Deref-assign idioms (`*ptr = "Istanbul";`) must still
        # trip the lint.
        #
        # No untrusted input interpolated; `rg`/`awk` patterns are
        # literal static strings.
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "::error::ripgrep (rg) is required by the ast-purity-strings lint but is not on PATH"
            exit 1
          fi
          hits=$(rg -n '"[^"]*(LCOV|Istanbul|TypeScript|LCOV-flavou?red)[^"]*"' crates/crap-core/src 2>/dev/null || true)
          if [ -z "$hits" ]; then
            echo "crap-core adapter-vocabulary literals: clean"
            exit 0
          fi
          non_comment_hits=$(echo "$hits" | awk -F: '
            {
              content = ""
              for (i = 3; i <= NF; i++) content = content (i > 3 ? ":" : "") $i
              gsub(/^[ \t]+/, "", content)
              if (content !~ /^(\/\/|\/\*|\* |\*$)/) print
            }
          ')
          if [ -n "$non_comment_hits" ]; then
            echo "::error::crap-core must not contain LCOV/Istanbul/TypeScript string literals — coverage source format names belong to adapters, not the domain library (see #261)"
            echo "$non_comment_hits"
            exit 1
          fi
          echo "crap-core adapter-vocabulary literals: clean (comment-only references allowed)"

  mutants-skip-lint:
    # Mechanical enforcement of the carry-forward rule documented at the top
    # of `.cargo/mutants.toml`: every test that shells `cargo_bin("crap4rs"|
    # "crap4ts")` under a scoped `cargo mutants` gate that doesn't build
    # that bin must carry a `--skip` substring token in
    # `additional_cargo_test_args`. #224's root cause was that rule being
    # silently violated when `crap4rs_no_flag_default_cognitive_still_works`
    # landed without the matching token, which aborted the entire `crap4ts`
    # walker mutants run (`cargo mutants` exited 4, zero mutants tested,
    # gate went silently dead). The rule was documented but not enforced;
    # this job is the enforcement.
    #
    # See `scripts/mutants-skip-lint.py` for the limitation notes (literal
    # `cargo_bin("X")` in `#[test]` fn body only; helper-mediated and
    # parameterized-bin-name calls are out of scope).
    #
    # Mirrors the `lefthook.yml` pre-push step — single source of truth in
    # `scripts/mutants-skip-lint.py`.
    #
    # `actions/checkout` is SHA-pinned with a trailing `# v4` comment, in
    # line with the repo-wide convention; `persist-credentials: false`
    # keeps the checkout token out of the runner's `.git/config` (this
    # job never pushes), and `permissions: contents: read` enforces
    # least privilege. See AGENTS.md "Supply-chain hygiene" for the
    # SHA-pin + Dependabot policy.
    name: mutants-skip lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lint .cargo/mutants.toml `--skip` coverage of adapter-bin-shelling tests
        run: python3 scripts/mutants-skip-lint.py

  bdd-tracked-lint:
    # Mechanical enforcement of AGENTS.md "BDD hygiene" Rule 2: every
    # `@unwired` or `@wip` scenario across `crates/*/tests/features/`
    # must carry a `# tracked: crap-rs#<n>` comment inside its
    # scenario block, naming the issue that owns the wiring deferral.
    # Without this gate, the rule was documented but unenforced —
    # documentation rots; CI doesn't.
    #
    # See `scripts/bdd-tracked-lint.py` for the parser shape and
    # limitations. Mirrors the `lefthook.yml` pre-push step — single
    # source of truth in the script.
    #
    # Conventions follow the post-#264 supply-chain hardening: scoped
    # `permissions: contents: read`, `persist-credentials: false` on
    # checkout, no cache (the lint is pure-Python and finishes in
    # under a second; caching is overhead, not savings).
    name: bdd-tracked-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: 'Lint `# tracked: crap-rs#<n>` comment coverage of @unwired/@wip scenarios'
        run: python3 scripts/bdd-tracked-lint.py

  docs:
    name: cargo doc (warnings as errors)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: crap4rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  zizmor:
    # Mechanical enforcement of the SHA-pin + workflow-security policy.
    # Runs `zizmor` (https://woodruffw.github.io/zizmor/) over every
    # workflow + composite action. The `unpinned-uses` audit is the
    # primary gate — any new floating-tag `uses:` reference (in a
    # workflow OR a composite action) fails CI here. Other zizmor
    # audits (template-injection, excessive-permissions, etc.) ride
    # along as additional supply-chain hygiene checks at no marginal
    # cost. Dedicated job (parallelizable, fail-fast) rather than
    # chained into ast-purity / cargo-deny so a supply-chain regression
    # surfaces without waiting on the Rust toolchain. zizmor itself is
    # installed via `pipx run` from the public Python registry — no
    # third-party action wrapper to pin (the wrapper itself would just
    # be another `uses:` reference to keep fresh).
    #
    # See AGENTS.md "Supply-chain hygiene" for the convention this job
    # enforces.
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor on .github/
        # `pipx run` fetches a pinned-by-PyPI build into a transient
        # venv; the `>=1.5,<2` constraint locks the audit ruleset to
        # the 1.x major so a zizmor release tightening rules doesn't
        # flip CI red between PRs. Bumping the constraint is a manual
        # edit (no Dependabot ecosystem covers this invocation form);
        # the major-version cap means 2.x lands via human-reviewed PR.
        run: pipx run 'zizmor>=1.5,<2' .github/
