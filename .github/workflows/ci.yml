name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default workflow permissions: least privilege. Per-job overrides below
# elevate where needed (e.g. scorecard-smoke needs `pull-requests: write`
# to post the sticky scorecard comment). Closes the workflow-wide leg of
# the `excessive-permissions` zizmor audit.
permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always
  # Determinism + speed knob for the bolero Q4 fuzz `check!` targets
  # (`tests/fuzz_*`), which run on stable as ordinary tests in the
  # `Test (*)` + `coverage` nextest lanes. Pins the bounded-random
  # iteration count so PR runs are fast and reproducible in cost; the
  # committed corpus/crashes seeds carry the deterministic regression
  # weight (replayed explicitly by each target's replay test).
  BOLERO_RANDOM_ITERATIONS: '1000'
  # Single source of truth for the smoke jobs' threshold input — both
  # `scorecard-smoke-rust` and `scorecard-smoke-ts` (and the preset
  # spot-check steps under `scorecard-smoke-rust`) consume this. The
  # rust smoke uses a tighter strict cutoff for its main invocation
  # (see the in-job rationale), so this env var owns the TS smoke's
  # default-tier check + the preset spot-checks' baseline value.
  CRAP_SMOKE_THRESHOLD: '15'

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86
          - os: macos-latest
            name: macos-arm
          - os: macos-15-intel
            name: macos-x86
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2
        with:
          tool: cargo-nextest@0.9
      - name: Verify cargo + nextest resolve (broken-rustup canary)
        # Bare `cargo` / `cargo nextest` here confirm the macOS rustup
        # reinstall put ~/.cargo/bin on PATH and that nextest resolves —
        # failing at a clearly-labelled step instead of deep in the run.
        run: |
          cargo --version
          cargo nextest --version
      - run: cargo nextest run --workspace --all-targets
      # Cucumber-rs targets (#115) speak their own CLI, not libtest's
      # `--list --format terse`; nextest excludes them via
      # `.config/nextest.toml` and they run via `cargo test`. Without
      # this step the `@wired` BDD status would be enforced only by the
      # `lefthook.yml` pre-push hook, not on every PR.
      #
      # Ordering is load-bearing for `multi_lang_html_cucumber`: it
      # resolves the `crap-render` binary via
      # `assert_cmd::cargo_bin("crap-render")`. `crap-render` ships in
      # crap-core, not crap4rs, so `CARGO_BIN_EXE_crap-render` is unset
      # for this crap4rs-package test — `cargo_bin` instead discovers
      # the binary in the shared target dir. The preceding
      # `cargo nextest run --workspace --all-targets` step builds it
      # there. Keep that step before this one; reordering would leave
      # crap-render unbuilt and silently break this harness.
      - run: >-
          cargo test
          --test json_reporter_cucumber
          --test metric_unsupported_cucumber
          --test cyclomatic_walker_cucumber
          --test parity_with_v1_cucumber
          --test istanbul_parser_cucumber
          --test arrow_function_coverage_cucumber
          --test file_extensions_cucumber
          --test branch_coverage_cucumber
          --test cli_init_cucumber
          --test cli_ergonomics_cucumber
          --test delta_cucumber
          --test diff_cucumber
          --test complexity_breakdown_cucumber
          --test group_by_file_cucumber
          --test sarif_reporter_cucumber
          --test saved_view_presets_cucumber
          --test format_advice_cucumber
          --test multi_root_cucumber
          --test github_annotations_cucumber
          --test multi_lang_html_cucumber

  crap4ts-build:
    # Per-platform build check for the new `crap4ts` shell crate (S5,
    # #137). Two artifacts share the crate: the standalone `crap4ts`
    # bin (default features) and the `libcrap4ts` cdylib used by the
    # napi-rs Node binding (`--features napi-binding --lib`). Both
    # need to compile cleanly on every platform the workspace claims
    # to support so the v2 walker pipeline (follow-up) doesn't
    # discover platform-link surprises after the fact.
    #
    # The macOS dynamic_lookup link arg comes from `napi_build::setup()`
    # in `crates/crap4ts/build.rs`; on the bin target (without the
    # `napi-binding` feature) there are no napi symbols to resolve,
    # which is why the bin builds with default features only.
    #
    # Coverage of the bin path is already in the `test` job's
    # `cargo nextest run --workspace --all-targets`; this job is the
    # cdylib-specific gate. linux-arm now runs on the GitHub-hosted
    # `ubuntu-24.04-arm` image (GA early 2026 for public repos on this
    # org's billing tier) — the cdylib gate covers all four platforms
    # crap4ts ships native binaries for (#154). Scope is `crap4ts-build`
    # only; extending the `test` matrix to linux-arm stays a separate
    # decision.
    name: crap4ts build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86
          - os: ubuntu-24.04-arm
            name: linux-arm
          - os: macos-latest
            name: macos-arm
          - os: macos-15-intel
            name: macos-x86
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: crap4ts-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build crap4ts bin (default features)
        run: cargo build --package crap4ts --release
      - name: No-feature bin canary -- bin must not carry napi_ symbols
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/crap4ts"
          test -f "$BIN"
          if nm "$BIN" 2>/dev/null | grep -q "napi_"; then
            echo "::error::bin links napi_ symbols (feature-gate leakage)"
            nm "$BIN" | grep "napi_" | head -10
            exit 1
          fi
          case "$RUNNER_OS" in
            macOS)
              if otool -L "$BIN" | grep -i napi; then
                echo "::error::bin has napi dylib linkage"
                exit 1
              fi
              ;;
          esac
          echo "OK: no napi_ symbols in standalone bin"
      - name: Build crap4ts cdylib (napi-binding feature)
        run: cargo build --package crap4ts --features napi-binding --lib --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2
        with:
          tool: cargo-nextest@0.9
      - uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2
        with:
          tool: cargo-llvm-cov@0.6
      - name: Generate workspace LCOV (excluding crap-examples)
        # The crap-examples crate is the pedagogical sample whose
        # deliberately-poor coverage feeds the release-plz envelope
        # publication job. Letting it bleed into the workspace
        # aggregate would tank the overall coverage signal that
        # consumers and the self-crap-view downstream gate read off
        # this artifact.
        run: cargo llvm-cov nextest --workspace --exclude crap-examples --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          retention-days: 7

  # PR delta #295 removed the standalone self-check job (Self-referential
  # CRAP check). Its strict-15 cargo-run gating on crap-core/crap4rs/
  # crap4ts source is subsumed by the quickstart-smoke job (in
  # quick-start-smoke.yml) which now dogfoods the composite action with
  # gate-mode: gate-on-analysis + threshold-preset: default (15) — same
  # threshold, but exercises the consumer-facing surface end-to-end
  # instead of a separate cargo-run path. Coverage trade-off documented
  # on PR #313: quickstart-smoke targets crates/crap-core/src only;
  # crap4rs/src + crap4ts/src self-coverage previously asserted here
  # becomes the responsibility of the per-crate clippy + tests gates
  # plus the self-crap-view per-function check below. Restoring
  # per-crate composite-action gating is tracked under crap-rs#273
  # (the ticket that already governs the strict-8 cleanup).

  self-crap-view:
    name: domain/view.rs per-function CC <= 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [coverage]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov
      - run: cargo build --release --package crap4rs
      - name: Assert max CC in crates/crap-core/src/domain/view.rs is <= 15
        # S2 (#134) moved domain/view.rs from crates/crap4rs/src/ to
        # crates/crap-core/src/. Run-twice for a workspace gate is the
        # S4 plan; until then, this targeted invocation analyzes
        # crap-core's source where view.rs now lives. The substring
        # filter still matches "domain/view.rs" verbatim.
        run: |
          set -euo pipefail
          ./target/release/crap4rs --coverage lcov.info --src crates/crap-core/src --threshold 1000 --format json > view-report.json
          python3 - <<'PY'
          import json, sys
          MAX_CC = 15
          with open("view-report.json") as fh:
              data = json.load(fh)
          view_fns = [
              f for f in data["result"]["functions"]
              if "domain/view.rs" in f["scored"]["identity"]["file_path"]
          ]
          offenders = [f for f in view_fns if f["scored"]["complexity"] > MAX_CC]
          if offenders:
              print(f"FAIL: {len(offenders)} function(s) in domain/view.rs exceed CC {MAX_CC}:")
              for f in sorted(offenders, key=lambda x: x["scored"]["complexity"], reverse=True):
                  ident = f["scored"]["identity"]
                  print(f"  CC={f['scored']['complexity']} {ident['qualified_name']} ({ident['file_path']})")
              sys.exit(1)
          worst = max((f["scored"]["complexity"] for f in view_fns), default=0)
          print(f"PASS: {len(view_fns)} fn(s) in domain/view.rs, worst CC={worst} (limit {MAX_CC})")
          PY

  envelope-verify:
    # Shift-left of the release-time envelope assertions (crap-rs#448
    # release hardening). The release-plz `build-crap-examples-envelopes`
    # job and this job run the SAME script — so the per-adapter language /
    # schema_version / non-empty assertions that gate publishing also run
    # on every PR. The rc.4 incident shipped `language: "rust"` for the
    # TypeScript adapter because that authoritative assertion lived ONLY
    # in the release job (post-publish); running it here makes a mislabeled
    # or malformed envelope fail on the PR instead of at release.
    name: Example envelopes — build + verify (shift-left)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: envelope-verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build + verify both example envelopes
        run: bash scripts/build-and-verify-example-envelopes.sh

  mutants:
    name: Mutation testing (crap-core view.rs + crap4ts walker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2
        with:
          tool: cargo-mutants
      - name: Run cargo mutants on crates/crap-core/src/domain/view.rs
        # S2 (#134) moved view.rs from crap4rs to crap-core. Update
        # both --package and --file to follow the move.
        run: cargo mutants --package crap-core --file crates/crap-core/src/domain/view.rs --no-shuffle --in-place
      - name: Run cargo mutants on crates/crap4ts/src/adapters/walker/mod.rs
        # crap-rs#209: the walker is the highest-leverage file in the
        # crap4ts adapter (every decision-point + function-discovery +
        # span-to-line decision routes through it).
        #
        # PER-MERGE GATE (not per-PR). The `on:` block restricts CI to
        # `push: [main]` + `pull_request: [main]`, so a `push` event is
        # exactly a merge-to-main. This step's `if:` therefore runs the
        # walker mutation pass ONLY on merge-to-main; the view.rs step
        # above has no `if:` and stays per-PR. Rationale (crap-rs#209 AC
        # amended from "≤8 min per-PR" → "per-merge"): the walker has
        # ~5× view.rs's mutant count (157 vs ~30) and a full pass is
        # ~1 h even under `-j 4` copy mode — a recurring per-PR tax that
        # is not worth it for a file that changes rarely once Cluster W
        # (#200/#205/#207/#209) lands. Gating at merge keeps every
        # crap4ts PR fast while still gating the walker before
        # crap4ts@2.0.0 GA. Trade-off: a walker regression surfaces at
        # merge, not on the introducing PR (acceptable — the #207
        # proptest suite is the per-PR behavioural net; mutants is the
        # deeper periodic gate). User-confirmed sequencing decision
        # 2026-05-16.
        #
        # `-j 4` copy mode (parallel workers, each reusing the prebuilt
        # `target/` via `.cargo/mutants.toml`'s `copy_target = true`)
        # keeps even the per-merge run tractable. `-j N` and
        # `--in-place` are mutually exclusive by design (parallel
        # workers REQUIRE source copies) — see AGENTS.md "Mutation
        # testing". `--no-shuffle` keeps mutant order deterministic for
        # flaky-mutant triage. The `--skip envelope` test-arg the
        # crap-core run relies on is NOT passed inline: it lives in the
        # repo-global `.cargo/mutants.toml`
        # (`additional_cargo_test_args = ["--", "--skip", "envelope"]`)
        # which cargo-mutants applies to EVERY invocation in this
        # workspace, so it is replicated automatically here — see
        # AGENTS.md "Why additional_cargo_test_args …".
        if: github.event_name == 'push'
        run: cargo mutants -j 4 --package crap4ts --file crates/crap4ts/src/adapters/walker/mod.rs --no-shuffle

  scorecard-smoke-rust:
    # Composite-action-driven smoke for the `crap4rs` dispatch path.
    # The previous Layer 1 direct-binary probe (envelope-shape +
    # markdown-header checks) was dropped in PR #292 — that surface is
    # now owned by the wire-envelope canaries
    # (`crates/crap-core/tests/wire_envelope_crap4rs.rs` + sibling TS
    # files) which assert `tool_version` non-empty pre-strip + the
    # full envelope shape on every `cargo nextest run`. The smoke
    # below stays scoped to exercising the public composite action's
    # plumbing (input parsing, output emission, sticky-comment shape,
    # inline annotations) against the PR's locally-built binary.
    name: Scorecard action smoke — Rust (analysis-only)
    runs-on: ubuntu-latest
    needs: [coverage]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      - name: Build PR binary
        run: cargo build --release --package crap4rs

      - name: Dogfood the scorecard action (rust dispatch)
        id: crap
        uses: ./.github/actions/scorecard-smoke
        with:
          bin-path: ./target/release/crap4rs
          language: rust
          coverage: lcov.info
          src: crates/crap4rs/src
          # Strict cutoff (matches `--strict` for the cognitive metric,
          # see #218 for the calibration). Default threshold 15 turns
          # up zero findings on the current codebase, which leaves the
          # annotations dogfood with nothing to render. Strict surfaces
          # the genuinely-worst routines so a regression in the
          # github-annotations reporter (envelope shape, escape codec,
          # truncation notice) is detectable on the PR itself. Tracking
          # cleanup of the offending functions in
          # https://github.com/breezy-bays-labs/crap-rs/issues/289 so
          # this can eventually flip to `analysis-gate: 'true'`.
          threshold: '8'
          # PR delta #295: suppress sticky. quickstart-smoke (workflow
          # quick-start-smoke.yml) is the single reviewer-facing scorecard;
          # the smoke jobs in ci.yml retain their assertion value (they
          # still build the binary + invoke the action + check outputs)
          # but no longer add reviewer noise to PRs.
          comment-mode: 'none'
          # End-to-end smoke for the github-annotations reporter — the
          # runner intercepts `::warning ...` lines from the action's
          # stdout and renders them inline on this PR's Files Changed
          # tab. The action's `Emit inline annotations` step runs the
          # PR-staged crap4rs with `--format github-annotations`, so a
          # broken envelope shape or escape regression surfaces as a
          # missing/mangled annotation on the PR itself.
          annotations: 'true'

      # ----------------------------------------------------------------
      # Preset spot-checks (PR #292 acceptance gate #11).
      #
      # The plan calls out that we must verify the preset-to-raw
      # threshold mapping mechanically — documentation rots; CI doesn't.
      # Each step below invokes the scorecard action with a different
      # preset shape and asserts the resolved threshold matches the
      # locked calibration table (strict=8, default=15, lenient=25),
      # plus one mixed step covering the actual-conflict warning case.
      #
      # All four steps reuse the workspace's own lcov.info + the
      # PR-staged crap4rs binary; they do NOT post sticky comments
      # (the main dogfood above owns that surface) and they do NOT
      # exercise inline annotations (covered above) — they exist
      # solely to lock the preset surface.
      # ----------------------------------------------------------------
      - name: Preset spot-check — strict
        id: preset-strict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: strict
          comment-mode: 'none'
      - name: Assert strict resolved to 8
        env:
          RESOLVED: ${{ steps.preset-strict.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "8" ]; then
            echo "::error::strict preset resolved to '$RESOLVED'; expected 8"
            exit 1
          fi
          echo "strict → threshold=8 ✓"

      # ----------------------------------------------------------------
      # html-report spot-check (PR #294 acceptance gate).
      #
      # Exercises the full HTML render + artifact upload + (when this
      # job posts a sticky comment) link injection path against the
      # PR-staged crap4rs binary. comment-mode mirrors the main
      # dogfood (sticky on pull_request, none otherwise) so the link
      # injection only fires on PR runs; the artifact upload + URL
      # output land on every event.
      #
      # `html-artifact-name-suffix: '-html-spotcheck'` keeps the
      # artifact name distinct from any other PR γ-related uploads
      # this job might add (today there are none, but the suffix is
      # a future-proofing convenience so this assertion never
      # collides with the per-OS default suffix of the main dogfood
      # step if `html-report: true` migrates there later).
      #
      # SECURITY NOTE: every shell variable interpolation in the
      # assertion step's `run:` body reads from the `env:` block;
      # the `github.run_id` / `github.repository` context fields are
      # GitHub-controlled (NOT user-controlled), and they still flow
      # through the env-indirection pattern for consistency with the
      # rest of this workflow.
      - name: HTML report spot-check
        id: html-spot
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          html-report: 'true'
          html-artifact-name-suffix: '-html-spotcheck'
          # PR delta #295: suppress sticky for the same reason as the
          # main dogfood step above — quickstart-smoke owns the single
          # reviewer-facing scorecard sticky.
          comment-mode: 'none'
      - name: Assert HTML report wiring
        env:
          HTML_URL_RUST: ${{ steps.html-spot.outputs.html-artifact-url-rust }}
          HTML_URL_TS: ${{ steps.html-spot.outputs.html-artifact-url-typescript }}
        run: |
          set -euo pipefail
          # 1. html-artifact-url-rust output populated. Per the
          #    actions/upload-artifact@v7 contract (verified via
          #    Context7 lookup during PR pre-flight), `artifact-url`
          #    is populated only when the upload SUCCEEDED — it is
          #    explicitly documented as "empty if the artifact upload
          #    failed." So a non-empty URL here is a STRONGER signal
          #    than "artifact appears in the runs/artifacts REST list"
          #    AND requires no extra permissions surface (the alternative
          #    `gh api repos/$repo/actions/runs/$id/artifacts` form
          #    needs `actions: read` on the job, which this job does
          #    not currently grant — keeping the permissions block
          #    minimal is the better tradeoff).
          if [ -z "$HTML_URL_RUST" ]; then
            echo "::error::html-spot: outputs.html-artifact-url-rust is empty after html-report:true single-language rust dispatch (upload-artifact contract: empty URL iff upload failed)"
            exit 1
          fi
          # 2. html-artifact-url-typescript output empty (TS didn't run
          #    — single-language rust dispatch).
          if [ -n "$HTML_URL_TS" ]; then
            echo "::error::html-spot: outputs.html-artifact-url-typescript should be empty in single-language rust dispatch (got: $HTML_URL_TS)"
            exit 1
          fi
          # 3. HTML file written to RUNNER_TEMP parses (closing
          #    </html> tag present) AND contains a known scorecard
          #    marker — pick a verbatim template literal the #260
          #    Askama template emits on every render regardless of
          #    which functions cross threshold. This is a robust
          #    marker: it fires even when the analyzed code has zero
          #    violations. The file the render step wrote is still on
          #    the runner FS (the upload step also reads it from
          #    there); reading it directly avoids any need to fetch
          #    the artifact back through the API.
          html_file="$RUNNER_TEMP/crap4rs-report.html"
          if [ ! -f "$html_file" ]; then
            echo "::error::html-spot: $html_file missing — the render step did not produce the expected file"
            exit 1
          fi
          if ! grep -q '</html>' "$html_file"; then
            echo "::error::html-spot: rendered HTML missing closing </html> tag — output may be truncated or malformed"
            exit 1
          fi
          if ! grep -q '<h1>crap4rs report</h1>' "$html_file"; then
            echo "::error::html-spot: rendered HTML missing the '<h1>crap4rs report</h1>' marker — reporter template may have drifted"
            exit 1
          fi
          echo "html-spot: html-report wiring ✓ (URL surfaced per upload-artifact success contract, HTML rendered with expected marker)"

      - name: Preset spot-check — default
        id: preset-default
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: default
          comment-mode: 'none'
      - name: Assert default resolved to env var
        env:
          RESOLVED: ${{ steps.preset-default.outputs.threshold-resolved }}
          EXPECTED: ${{ env.CRAP_SMOKE_THRESHOLD }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::default preset resolved to '$RESOLVED'; expected $EXPECTED"
            exit 1
          fi
          echo "default → threshold=$EXPECTED ✓"

      - name: Preset spot-check — lenient
        id: preset-lenient
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: lenient
          comment-mode: 'none'
      - name: Assert lenient resolved to 25
        env:
          RESOLVED: ${{ steps.preset-lenient.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED" != "25" ]; then
            echo "::error::lenient preset resolved to '$RESOLVED'; expected 25"
            exit 1
          fi
          echo "lenient → threshold=25 ✓"

      - name: Preset spot-check — actual-conflict warning (strict + threshold:20)
        id: preset-conflict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: strict
          threshold: '20'
          comment-mode: 'none'
      - name: Assert explicit threshold wins on conflict
        env:
          RESOLVED: ${{ steps.preset-conflict.outputs.threshold-resolved }}
        run: |
          set -euo pipefail
          # Explicit `threshold: '20'` differs from strict-derived 8,
          # so the action emits a `::warning::` and the explicit value
          # wins (additive shim discipline per ADR public-api-shim).
          # The warning itself surfaces in the workflow log; this step
          # locks the wins-on-conflict half of the contract.
          if [ "$RESOLVED" != "20" ]; then
            echo "::error::explicit threshold:20 + strict preset resolved to '$RESOLVED'; expected 20 (explicit wins)"
            exit 1
          fi
          echo "strict + threshold:20 → threshold=20 (explicit wins, warning emitted) ✓"

      - name: Preset spot-check — no-conflict (default + threshold:15)
        id: preset-no-conflict
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold-preset: default
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert no-conflict resolves cleanly
        env:
          RESOLVED: ${{ steps.preset-no-conflict.outputs.threshold-resolved }}
          EXPECTED: ${{ env.CRAP_SMOKE_THRESHOLD }}
        run: |
          set -euo pipefail
          # default preset derives the same value the explicit
          # threshold passes, so no actual conflict, no warning, no
          # surprise. This is the "you set both" case that the plan
          # explicitly does NOT warn on (the false-default-
          # indistinguishable-from-explicit gotcha — see the
          # `Resolve presets` step's inline rationale).
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::default preset + matching threshold resolved to '$RESOLVED'; expected $EXPECTED"
            exit 1
          fi
          echo "default + threshold:$EXPECTED → threshold=$EXPECTED (no conflict, no warning) ✓"

      # ----------------------------------------------------------------
      # comment-preamble spot-check (crap-rs#336 acceptance gate).
      #
      # Invoke the action twice with identical inputs except
      # `comment-preamble` (a sentinel vs empty), `comment-mode: none`,
      # and assert on the new `sticky-message` output: the with-preamble
      # body STARTS WITH the sentinel; the empty-preamble body does NOT
      # contain it. Relational assertions (startswith + absence) through
      # the real action.yml compose logic — robust against trailing-
      # newline normalization across the $GITHUB_OUTPUT heredoc boundary
      # that an exact-byte equality would trip on. All interpolations
      # flow through env: (the sentinel is an action-author constant,
      # not user input, but the indirection keeps the workflow uniform).
      # ----------------------------------------------------------------
      - name: Preamble spot-check — with sentinel
        id: preamble-with
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-preamble: 'CRAP_PREAMBLE_SENTINEL — spot-check marker'
          comment-mode: 'none'
      - name: Preamble spot-check — empty
        id: preamble-empty
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert preamble prepends and empty is preamble-free
        env:
          WITH_MSG: ${{ steps.preamble-with.outputs.sticky-message }}
          EMPTY_MSG: ${{ steps.preamble-empty.outputs.sticky-message }}
        run: |
          set -euo pipefail
          sentinel='CRAP_PREAMBLE_SENTINEL'
          # 1. With-preamble body starts with the sentinel (preamble
          #    prepended ABOVE the scorecard body).
          case "$WITH_MSG" in
            "$sentinel"*) ;;
            *)
              echo "::error::preamble-spot: sticky-message did not start with the preamble sentinel"
              printf '%s\n' "$WITH_MSG" | head -3
              exit 1
              ;;
          esac
          # 2. Empty-preamble body does NOT contain the sentinel
          #    (byte-identity preserved — preamble truly empty).
          if printf '%s' "$EMPTY_MSG" | grep -q "$sentinel"; then
            echo "::error::preamble-spot: empty-preamble sticky-message unexpectedly contains the sentinel"
            exit 1
          fi
          echo "comment-preamble: prepend ✓, empty byte-identity ✓"

  scorecard-production:
    # ----------------------------------------------------------------
    # Production CRAP scorecard — the repo's FIRST CRAP-threshold gate
    # on production source (crap-rs#336). PURELY ADDITIVE: it removes
    # no existing gate. #295 created the production scorecard analyzing
    # crap-core/src; #314 repointed that slot to crap-examples/src, so
    # production lost its gate. This restores it across the full prod
    # crate set — crap-core + crap4rs + crap4ts src — via multi-root
    # `--src` (the examples scorecard stays in quick-start-smoke.yml).
    #
    # Binary provenance is load-bearing: the published crap4rs predates
    # the repeatable-`--src` capability this PR ships, so the gate MUST
    # run THIS PR's binary (built + staged below). `version` is left
    # unset (default `latest`) so the action's pre-installed-detection
    # short-circuits its binstall and uses the staged binary. Gating
    # this PR's source with this PR's analyzer is the whole point.
    # ----------------------------------------------------------------
    name: Scorecard — production crates (gated)
    runs-on: ubuntu-latest
    needs: [coverage]
    # Shared gh-pages publish lock (epic #377, Wave 1). The per-PR
    # publish here and the push-to-main publish in
    # `publish-production-report` sit in DIFFERENT top-level concurrency
    # groups (the workflow group is `ci-${{ github.ref }}`, so a PR run
    # and a main run never share it). Without this job-level group, a
    # merge-to-main publish and an in-flight PR publish could push to
    # gh-pages concurrently and collide on the branch tip. A shared
    # named group with cancel-in-progress: false serializes the two.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      # contents: write to push the per-PR HTML report to the gh-pages
      # branch (epic #377, Wave 1 — the action's pages-publish step uses
      # the job's GITHUB_TOKEN); pull-requests: write for the distinct
      # `crap-scorecard-production` sticky comment on PRs. The top-level
      # workflow default stays contents: read.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      - name: Build PR binary
        run: cargo build --release --package crap4rs

      - name: Stage PR binary as pre-installed adapter
        run: |
          set -euo pipefail
          # The public scorecard action short-circuits its binstall when
          # `crap4rs --version` resolves on PATH AND `version: latest`.
          # $HOME/.cargo/bin is pre-pended to PATH on ubuntu-latest, so
          # staging the PR-built binary there makes the action dogfood
          # THIS PR's repeatable-`--src` capability instead of the
          # published binary (which lacks it). Same shape as the
          # multi-language smoke job's staging step.
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 ./target/release/crap4rs "$HOME/.cargo/bin/crap4rs"
          crap4rs --version

      - name: Fetch main baseline (degrade-not-fail)
        id: baseline
        # The per-PR Delta tab diffs this PR against the production
        # baseline Wave 0 publishes to gh-pages:/baselines/main.json on
        # every push to main. Fetch it via `git show` off a shallow
        # `gh-pages` fetch — the branch tip avoids the Pages CDN's
        # propagation lag, and a public-repo fetch needs no token.
        #
        # DEGRADE, NEVER FAIL (epic #377 AC): if the fetch fails OR the
        # file is empty (first run before any main publish, a transient
        # ref glitch, etc.), emit a `::warning::` and leave the baseline
        # path empty. An empty `baseline:` makes the action render
        # analysis-only (no Delta tab) — the PR must NEVER red over a
        # missing baseline. The whole fetch+show+size-check chain is
        # inside the `if` so `set -e` cannot propagate a failure: a
        # non-zero anywhere takes the else branch and the step exits 0.
        run: |
          set -euo pipefail
          if git fetch origin gh-pages --depth 1 \
            && git show FETCH_HEAD:baselines/main.json > baseline.json 2>/dev/null \
            && [ -s baseline.json ]; then
            echo "path=baseline.json" >> "$GITHUB_OUTPUT"
            echo "Fetched main baseline ($(wc -c < baseline.json) bytes) — Delta tab will render."
          else
            echo "::warning::Could not fetch a non-empty gh-pages:baselines/main.json; rendering the per-PR report WITHOUT a Delta tab (degrade-not-fail). This is expected before the first push-to-main publish."
            echo "path=" >> "$GITHUB_OUTPUT"
            rm -f baseline.json
          fi

      - name: Note fork-PR Pages handoff
        # On a fork PR the GITHUB_TOKEN is read-only regardless of the
        # job's permissions: block, so neither the inline gh-pages push
        # (pages-publish, computed false on forks below) nor the action's
        # sticky-comment post can run here. Instead `fork-handoff: true`
        # makes the action stage a handoff artifact, and the separate
        # privileged `Pages publish (fork PRs)` workflow (workflow_run, in
        # the trusted BASE context) publishes the report and posts the
        # sticky AFTER this run completes. Surface that in the log so a
        # reviewer on a fork PR knows the hosted link arrives shortly via
        # the companion workflow, not inline. See docs/pages-fork-reports.md.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::notice::Fork PR detected — the hosted report link is not posted inline (a fork's GITHUB_TOKEN is read-only). The 'Pages publish (fork PRs)' workflow publishes the report and posts the production sticky from the trusted base context once this CI run completes."

      - name: Production scorecard (gate-on-analysis)
        uses: ./.github/actions/scorecard
        with:
          languages: rust
          # Analysis knobs (`src`, `threshold`/`preset`, `metric`,
          # `exclude`, the `[views.ci]` preset) are NOT set here — they
          # live in the repo-root `crap.toml`, which the action's bare
          # `crap4rs` invocation auto-discovers in the checkout working
          # directory (crap-rs#346, the config dogfood). `src` and
          # `threshold-preset` are omitted so config owns them: the action
          # forwards `--src` / `--threshold` only when the caller sets
          # them, so config's `src = [3 prod crate roots]` and
          # `preset = "default"` win. Behavior is identical to the prior
          # inline knobs (preset `default` -> threshold 15, cognitive
          # metric, the same three crate roots) — the values MOVED from
          # YAML into `crap.toml`, they did not change.
          #
          # CI-presentation + per-run inputs STAY here: they are not
          # analyzer config. `coverage` is per-run (the downloaded LCOV
          # artifact); `gate-mode` / `comment-*` shape how the wrapper
          # gates and renders the PR comment.
          coverage: lcov.info
          # Baseline path (or empty) from the degrade-not-fail fetch
          # above. When set, the action forwards `--baseline` and the
          # rendered HTML gains a Delta tab (PR vs main); when empty, the
          # report is analysis-only. `run-mode` is deliberately LEFT
          # UNSET: setting `run-mode: delta`/`both` would make the
          # action HARD-ERROR when the baseline degrades to empty, which
          # would fail the PR and violate degrade-not-fail. With run-mode
          # empty the action forwards `--baseline` iff non-empty and
          # silently runs analysis-only otherwise — exactly the degrade
          # contract. gate-mode: gate-on-analysis below keeps the GATE
          # whole-project (the baseline only feeds the Delta VIEW, never
          # the gate), and an empty run-mode means no spurious
          # baseline/run-mode warning is emitted.
          baseline: ${{ steps.baseline.outputs.path }}
          # Render HTML so there is a report to host (required by
          # pages-publish). The Delta tab activates automatically when
          # baseline is non-empty — no extra toggle.
          html-report: true
          # Publish the hosted per-PR report for SAME-REPO PRs only. A
          # fork PR's token is read-only (the push would 403), so this
          # resolves false on forks and the action degrades to
          # summary-only (no link). On push:main this is also false (the
          # expression is pull_request-only), so this job never
          # double-publishes — Wave 0's `publish-production-report` owns
          # the push:main root publish.
          pages-publish: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          pages-deploy-path: pr-${{ github.event.number }}
          pages-url: https://breezy-bays-labs.github.io/crap-rs/pr-${{ github.event.number }}/
          # Fork-PR counterpart to pages-publish (crap-rs#386). On a fork
          # PR the action stages a handoff artifact instead of publishing
          # inline (a fork token can't push or comment); the privileged
          # `pages-publish-fork.yml` workflow_run consumer publishes the
          # report + posts the sticky from the trusted base context. A
          # no-op on same-repo PRs and push events.
          fork-handoff: true
          gate-mode: gate-on-analysis
          comment-mode: sticky
          comment-header: crap-scorecard-production
          # Surface the complexity-contributor breakdown of any
          # above-threshold function as a collapsed `<details>` below the
          # sticky scorecard table (crap-rs#397). This gate is normally
          # green (0 above threshold), so the collapsible is a no-op
          # then; it pays off when the gate FAILS, explaining WHY the
          # offending function tripped the threshold right in the sticky.
          breakdown: true
          comment-preamble: |
            **Production CRAP scorecard** — gates `crap-core`, `crap4rs`,
            and `crap4ts` source. This is real production code held to the
            threshold; the separate _quickstart-smoke_ scorecard analyzes
            `crap-examples` (an intentionally bad teaching sample), not
            production.

  publish-production-report:
    # ----------------------------------------------------------------
    # Hosted-reports walking skeleton (crap-rs#378, epic #377). On
    # push to main ONLY, render the production CRAP HTML report and
    # publish it to the GitHub Pages root, plus write the production
    # analysis envelope to gh-pages:/baselines/main.json — the baseline
    # every future per-PR report will diff against. Main report only;
    # per-PR / delta wiring is a later wave.
    #
    # This is REPORT-ONLY, never a gate: the threshold gate is owned by
    # `scorecard-production` (gate-on-analysis) on the PR. This job only
    # `needs: [coverage]` and so runs even if a strict-8 regression
    # reached main — exactly when the hosted report matters most — so
    # the render uses `--no-fail` (the same flag the composite action
    # uses to capture truth into its envelope) to keep the analyzer's
    # threshold exit code from skipping the publish.
    #
    # The analysis half mirrors `scorecard-production` byte-for-byte:
    # same pinned actions, same `lcov` artifact, and the published
    # crap4rs predates the repeatable-`--src` this repo's `crap.toml`
    # needs, so the report MUST run THIS commit's freshly built binary.
    # Analysis knobs (`src` / `threshold` / `metric`) are NOT passed —
    # the repo-root `crap.toml` owns them via auto-discovery, identical
    # to `scorecard-production`.
    # ----------------------------------------------------------------
    name: Publish production report → gh-pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [coverage]
    # Shared gh-pages publish lock (epic #377, Wave 1). This push-to-main
    # publish and the per-PR publish in `scorecard-production` are in
    # different top-level concurrency groups (the workflow group is
    # `ci-${{ github.ref }}`), so without a shared job-level group their
    # gh-pages pushes could race and collide on the branch tip. The
    # named group + cancel-in-progress: false serializes them.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      # Elevate ONLY here: contents: write to push the rendered report
      # and baseline envelope to the gh-pages branch. The top-level
      # workflow default stays contents: read.
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The publish step uses a separate tokened clone of gh-pages,
          # never this checkout's persisted credentials — keep them off
          # the runner's .git/config (artipacked audit).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      - name: Build crap4rs from source
        # The published crap4rs lacks the repeatable `--src` this repo's
        # crap.toml needs (3 prod crate roots) — same rationale as
        # scorecard-production's "Build PR binary" step.
        run: cargo build --release --package crap4rs

      - name: Render production HTML report + baseline envelope
        # No analysis flags — crap.toml owns src/threshold/metric via
        # auto-discovery from the repo root. Multi-format fan-out writes
        # both shapes in one pass: HTML is the hosted report, JSON is
        # the baseline envelope. No `--baseline`: main IS the baseline,
        # so the root report has no delta tab (correct for Wave 0).
        # `--no-fail` makes this report-only — a threshold violation on
        # main must not skip publication (gating is scorecard-production).
        run: |
          set -euo pipefail
          ./target/release/crap4rs \
            --coverage lcov.info \
            --no-fail \
            --format html:report.html,json:envelope.json
          # Empty-file guard (AGENTS.md release-envelope rule): a silent
          # render failure surfaces here, not as an opaque downstream
          # parse error on the published asset.
          [ -s report.html ] || { echo "::error::render produced an empty report.html"; exit 1; }
          [ -s envelope.json ] || { echo "::error::render produced an empty envelope.json"; exit 1; }

      - name: Publish to gh-pages
        # Plain git push (no third-party action — supply-chain
        # conventions). A separate shallow tokened clone of gh-pages
        # avoids relying on the main checkout's (deliberately absent)
        # persisted credentials. Existing gh-pages content — notably
        # `.nojekyll` — is preserved because we copy files in rather
        # than wiping the tree. The no-op guard skips an empty commit;
        # in practice the envelope's embedded timestamp changes every
        # run, so it is a safety net, not a deduplicator.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages-pub
          # Root report → Pages index.html; envelope → baselines/main.json.
          cp report.html gh-pages-pub/index.html
          mkdir -p gh-pages-pub/baselines
          cp envelope.json gh-pages-pub/baselines/main.json
          cd gh-pages-pub
          if [ -z "$(git status --porcelain)" ]; then
            echo "gh-pages already up to date — nothing to publish"
            exit 0
          fi
          git add index.html baselines/main.json
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ci(pages): publish production report + baseline envelope (${GITHUB_SHA})"
          git push origin HEAD:gh-pages

  scorecard-smoke-ts:
    # Sibling of `scorecard-smoke-rust` for the TypeScript dispatch
    # path. Build crap4ts from the PR, stage it on PATH (the only
    # install strategy the action's typescript branch supports today —
    # see AGENTS.md "crap4ts install constraint"), prepare a tiny
    # Istanbul JSON fixture from the workspace's ts-fixtures corpus,
    # then dogfood the composite action with `.json` coverage and
    # assert the same outputs land as the rust dispatch.
    #
    # Layer 1 direct-binary probe was dropped in PR #292 (canary
    # takeover — see scorecard-smoke-rust rationale + the three wire
    # envelope canaries in `crates/crap-core/tests/wire_envelope_*.rs`).
    name: Scorecard action smoke — TypeScript (analysis-only)
    runs-on: ubuntu-latest
    # comment-mode: 'none' below — this job never posts a PR comment,
    # so `contents: read` is sufficient. The rust-side
    # `scorecard-smoke-rust` job owns the per-PR sticky-comment slot
    # and elevates accordingly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Build crap4ts from the PR's source so the smoke dogfoods this
      # PR's binary, not a downstream release. Mirrors the
      # `scorecard-smoke-rust` pattern for crap4rs.
      - name: Build PR crap4ts binary
        run: cargo build --release --bin crap4ts

      # Prepare a tiny Istanbul fixture under a stable workspace path
      # (RUNNER_TEMP/ts-smoke) so the action's `--src` input resolves
      # the coverage `path` entries cleanly. The jest fixture template
      # uses `{SRC_ROOT}` substitution (matches
      # `crates/crap-core/tests/wire_envelope_crap4ts.rs::build_fixture`).
      - name: Prepare Istanbul JSON fixture
        id: fixture
        env:
          SRC_ROOT: ${{ runner.temp }}/ts-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/simple.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/arrow.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/Button.tsx "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/map.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/mixed.ts "$SRC_ROOT/"
          # `{SRC_ROOT}` is the literal placeholder used by every
          # fixture under `crates/crap4ts/tests/fixtures/istanbul-jest/`;
          # the wire_envelope_crap4ts test substitutes the same way.
          sed "s|{SRC_ROOT}|$SRC_ROOT|g" \
            crates/crap4ts/tests/fixtures/istanbul-jest/coverage-final.json \
            > "$SRC_ROOT/coverage-final.json"
          echo "coverage=$SRC_ROOT/coverage-final.json" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_ROOT" >> "$GITHUB_OUTPUT"

      - name: Dogfood the scorecard action (typescript dispatch)
        id: crap
        uses: ./.github/actions/scorecard-smoke
        with:
          bin-path: ./target/release/crap4ts
          language: typescript
          coverage: ${{ steps.fixture.outputs.coverage }}
          src: ${{ steps.fixture.outputs.src }}
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          # No sticky comment on the ts smoke — the crap4rs sticky
          # comment owns the per-PR scorecard slot; a second sticky
          # under a different header is review noise.
          comment-mode: 'none'

  scorecard-smoke-multi-lang:
    # Multi-language single-CI smoke for PR #293 — exercises the
    # `languages: rust,typescript` / `languages: all` dispatch path
    # added by the multi-language extension. Stages BOTH PR-built
    # binaries onto PATH (so the action's pre-installed-detection
    # picks them up), prepares both Rust LCOV + TS Istanbul fixtures,
    # then runs the 8 parsing-edge-case spot checks the PR β
    # acceptance gates call out. Single CI job (not a matrix) since
    # each spot check is one composite-action invocation, and the
    # invocations share the same staged binaries + fixture prep.
    #
    # SECURITY NOTE: every `run:` block reads only step outputs and
    # workflow env vars via the `env:` indirection pattern (per the
    # GH-workflow-injection guidance). No `github.event.*` /
    # `github.head_ref` interpolation appears in any shell body.
    name: Scorecard action smoke — multi-language
    runs-on: ubuntu-latest
    needs: [coverage]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lcov

      # Build BOTH binaries from the PR's source so the multi-language
      # smoke dogfoods this PR's adapters end-to-end. Mirrors the
      # `scorecard-smoke-rust` (`cargo build --release --package crap4rs`)
      # and `scorecard-smoke-ts` (`cargo build --release --bin crap4ts`)
      # patterns combined. `--bin crap4ts` lives in the crap4ts package
      # (not crap4rs), so the build invokes both packages explicitly.
      - name: Build PR binaries (crap4rs + crap4ts)
        run: cargo build --release --package crap4rs --package crap4ts

      - name: Stage PR binaries as pre-installed adapters
        run: |
          set -euo pipefail
          # Multi-language mode requires BOTH adapters discoverable on
          # PATH. The public scorecard action's pre-installed-detection
          # short-circuits its binstall steps when `crap4rs --version`
          # and `crap4ts --version` resolve to executables under PATH,
          # so staging both into `$HOME/.cargo/bin` (which the GitHub-
          # hosted runner pre-pends to PATH) is the standard pattern.
          # The `scorecard-smoke` internal composite uses the same shape.
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 ./target/release/crap4rs "$HOME/.cargo/bin/crap4rs"
          install -m 0755 ./target/release/crap4ts "$HOME/.cargo/bin/crap4ts"
          crap4rs --version
          crap4ts --version

      # Prepare a tiny Istanbul fixture under a stable workspace path
      # so the action's `--src-ts` input resolves the coverage `path`
      # entries cleanly. Same template substitution as `scorecard-smoke-ts`.
      - name: Prepare Istanbul JSON fixture (TS side)
        id: ts-fixture
        env:
          SRC_ROOT: ${{ runner.temp }}/ts-multi-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/simple.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/arrow.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/Button.tsx "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/map.ts "$SRC_ROOT/"
          cp crates/crap4ts/tests/fixtures/ts-fixtures/mixed.ts "$SRC_ROOT/"
          sed "s|{SRC_ROOT}|$SRC_ROOT|g" \
            crates/crap4ts/tests/fixtures/istanbul-jest/coverage-final.json \
            > "$SRC_ROOT/coverage-final.json"
          echo "coverage=$SRC_ROOT/coverage-final.json" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_ROOT" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Spot-check matrix (PR #293 acceptance gate #7).
      #
      # 8 single-step invocations covering the parsing edge cases the
      # shape doc Open Q 2 enumerated. Each step pairs a `with:` block
      # exercising one input shape with a matching assertion step
      # reading the action's resolved outputs. The full list:
      #   1. languages: rust              — single-language back-compat
      #   2. languages: typescript        — single-language back-compat
      #   3. languages: rust,typescript   — multi-language explicit
      #   4. languages: all               — multi-language convenience
      #   5. "languages: rust, typescript" (whitespace) — multi-language
      #   6. languages: rust,rust         — dedup warning + single-lang
      #   7. languages: rust,typescript w/o coverage-ts — actionable error
      #   8. languages: garbage           — actionable error
      #
      # Cases 1-6 succeed and assert output shape; cases 7-8 are
      # expected-failure invocations exercised via `continue-on-error:
      # true` + a follow-up step that asserts the prior step's outcome
      # was `failure` — that proves the error surfaced rather than
      # silently passing.
      # ----------------------------------------------------------------

      - name: Spot-check 1 — languages=rust (single-language back-compat)
        id: spot-rust
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: rust
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 1 single-language outputs
        env:
          ROW_JSON: ${{ steps.spot-rust.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-rust.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-rust.outputs.row-json-typescript }}
          MARKDOWN: ${{ steps.spot-rust.outputs.markdown }}
        run: |
          set -euo pipefail
          # Single-language back-compat invariants:
          #   * legacy `row-json` populated (every existing consumer)
          #   * split `row-json-rust` ALSO populated (forward-compat)
          #   * split `row-json-typescript` empty (TS didn't run)
          #   * markdown carries NO `## CRAP scorecard` outer wrapper
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 1: legacy row-json empty in single-language rust mode"
            exit 1
          fi
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 1: row-json-rust empty in languages=rust"
            exit 1
          fi
          if [ -n "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 1: row-json-typescript non-empty in languages=rust (got: $ROW_JSON_TS)"
            exit 1
          fi
          if printf '%s' "$MARKDOWN" | grep -qE '^## CRAP scorecard$'; then
            echo "::error::spot-check 1: single-language markdown should NOT carry the multi-language outer wrapper"
            exit 1
          fi
          echo "spot-check 1 (languages=rust) ✓"

      - name: Spot-check 2 — languages=typescript (single-language back-compat)
        id: spot-ts
        uses: ./.github/actions/scorecard
        with:
          coverage: ${{ steps.ts-fixture.outputs.coverage }}
          src: ${{ steps.ts-fixture.outputs.src }}
          languages: typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 2 single-language outputs
        env:
          ROW_JSON: ${{ steps.spot-ts.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-ts.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-ts.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 2: legacy row-json empty in single-language typescript mode"
            exit 1
          fi
          if [ -n "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 2: row-json-rust non-empty in languages=typescript"
            exit 1
          fi
          if [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 2: row-json-typescript empty in languages=typescript"
            exit 1
          fi
          echo "spot-check 2 (languages=typescript) ✓"

      - name: Spot-check 3 — languages=rust,typescript (multi-language explicit)
        id: spot-multi
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: rust,typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 3 multi-language outputs
        env:
          ROW_JSON: ${{ steps.spot-multi.outputs.row-json }}
          ROW_JSON_RUST: ${{ steps.spot-multi.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-multi.outputs.row-json-typescript }}
          MARKDOWN: ${{ steps.spot-multi.outputs.markdown }}
        run: |
          set -euo pipefail
          # Multi-language invariants:
          #   * legacy `row-json` EMPTY (with `::warning::` in job log
          #     directing consumers to the split outputs)
          #   * both split outputs populated
          #   * markdown carries `## CRAP scorecard` wrapper + per-
          #     language `### Rust (crap4rs)` AND `### TypeScript
          #     (crap4ts)` section headers
          if [ -n "$ROW_JSON" ]; then
            echo "::error::spot-check 3: legacy row-json should be EMPTY in multi-language mode (got: $ROW_JSON)"
            exit 1
          fi
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 3: row-json-rust empty in multi-language mode"
            exit 1
          fi
          if [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 3: row-json-typescript empty in multi-language mode"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^## CRAP scorecard$'; then
            echo "::error::spot-check 3: multi-language markdown missing '## CRAP scorecard' outer wrapper"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^### Rust \(crap4rs\)$'; then
            echo "::error::spot-check 3: multi-language markdown missing '### Rust (crap4rs)' section header"
            exit 1
          fi
          if ! printf '%s' "$MARKDOWN" | grep -qE '^### TypeScript \(crap4ts\)$'; then
            echo "::error::spot-check 3: multi-language markdown missing '### TypeScript (crap4ts)' section header"
            exit 1
          fi
          echo "spot-check 3 (languages=rust,typescript) ✓"

      - name: Spot-check 4 — languages=all (multi-language convenience expansion)
        id: spot-all
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: all
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 4 expansion matches explicit form
        env:
          ROW_JSON_RUST: ${{ steps.spot-all.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-all.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          # `all` is the convenience expansion for the full multi-language
          # set. Today that's rust,typescript; the dispatch should
          # behave IDENTICALLY to the explicit form (spot-check 3).
          if [ -z "$ROW_JSON_RUST" ] || [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 4: languages=all did not produce both split outputs"
            exit 1
          fi
          echo "spot-check 4 (languages=all) ✓"

      - name: Spot-check 5 — languages with whitespace (multi-language)
        id: spot-ws
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          coverage-ts: ${{ steps.ts-fixture.outputs.coverage }}
          src-ts: ${{ steps.ts-fixture.outputs.src }}
          languages: 'rust, typescript'
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 5 whitespace tolerated
        env:
          ROW_JSON_RUST: ${{ steps.spot-ws.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-ws.outputs.row-json-typescript }}
        run: |
          set -euo pipefail
          if [ -z "$ROW_JSON_RUST" ] || [ -z "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 5: 'rust, typescript' (whitespace) did not produce both split outputs"
            exit 1
          fi
          echo "spot-check 5 (languages='rust, typescript') ✓"

      - name: Spot-check 6 — languages=rust,rust (dedup → single-language + warning)
        id: spot-dedup
        uses: ./.github/actions/scorecard
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: 'rust,rust'
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 6 dedup collapses to single-language
        env:
          ROW_JSON_RUST: ${{ steps.spot-dedup.outputs.row-json-rust }}
          ROW_JSON_TS: ${{ steps.spot-dedup.outputs.row-json-typescript }}
          ROW_JSON: ${{ steps.spot-dedup.outputs.row-json }}
        run: |
          set -euo pipefail
          # The dedupe warning itself goes to the workflow log (the
          # action emits `::warning::scorecard action: 'languages:
          # rust,rust' contains duplicate token 'rust' ...`); this
          # assertion locks the dedupe BEHAVIOR (single-language dispatch
          # after collapse), not the warning text. After collapse,
          # `rust,rust` should behave identically to `languages: rust`
          # (spot-check 1).
          if [ -z "$ROW_JSON_RUST" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' did not produce row-json-rust"
            exit 1
          fi
          if [ -n "$ROW_JSON_TS" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' produced TS output (should collapse to single-language rust)"
            exit 1
          fi
          if [ -z "$ROW_JSON" ]; then
            echo "::error::spot-check 6: dedup'd 'rust,rust' should populate legacy row-json (single-language back-compat)"
            exit 1
          fi
          echo "spot-check 6 (languages=rust,rust → dedup ✓)"

      - name: Spot-check 7 — multi-language without coverage-ts (actionable error)
        id: spot-missing-pair
        uses: ./.github/actions/scorecard
        continue-on-error: true
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          # Intentionally OMIT coverage-ts + src-ts; the pre-execution
          # validator in `Resolve presets` should error actionably.
          languages: rust,typescript
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 7 surfaced the paired-input error
        env:
          OUTCOME: ${{ steps.spot-missing-pair.outcome }}
        run: |
          set -euo pipefail
          # `continue-on-error: true` makes the action's failure
          # non-fatal to the job; we then assert the OUTCOME was
          # actually `failure` so the pre-execution validator didn't
          # silently let multi-language mode run without the paired
          # input set.
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::spot-check 7: action should have failed on missing coverage-ts but outcome=$OUTCOME"
            exit 1
          fi
          echo "spot-check 7 (missing coverage-ts → actionable error ✓)"

      - name: Spot-check 8 — languages=garbage (actionable error)
        id: spot-garbage
        uses: ./.github/actions/scorecard
        continue-on-error: true
        with:
          coverage: lcov.info
          src: crates/crap4rs/src
          languages: garbage
          threshold: ${{ env.CRAP_SMOKE_THRESHOLD }}
          comment-mode: 'none'
      - name: Assert spot-check 8 surfaced the unsupported-token error
        env:
          OUTCOME: ${{ steps.spot-garbage.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::spot-check 8: action should have failed on languages=garbage but outcome=$OUTCOME"
            exit 1
          fi
          echo "spot-check 8 (languages=garbage → actionable error ✓)"

  msrv:
    # Pre-flight gate at the workspace's declared `rust-version`. The
    # original CEng audit (B3) ran lib-only `cargo +1.85 check` and
    # missed dev-dep MSRV blockers (cucumber 0.22 needs 1.88, jsonschema
    # → idna → icu chain needs 1.86). `--all-targets` exercises the
    # full target set (lib, bin, tests) and surfaces those.
    # Bumped 1.88 → 1.93 to unlock current oxc (the TS walker dep) and
    # avoid the running carry-cost of holding oxc back across releases.
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @1.93 branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: crap4rs-msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # cargo-deny is the supply-chain gate itself; the SHA pin guards
      # against tag poisoning silently disabling every other
      # supply-chain check. The repo-wide SHA-pinning sweep (#233)
      # brought every other action up to the same standard — see
      # AGENTS.md "Supply-chain hygiene".
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

  ast-purity:
    # Source-level grep enforcing that crap-core stays AST-library-pure.
    # The hexagonal layout (CLAUDE.md) bans `syn`, `quote`, `proc-macro2`,
    # `tree-sitter`, `swc`, `oxc` from crap-core so the same library can
    # be linked by every adapter (crap4rs via syn, future crap4ts via
    # swc/oxc). cargo-deny's transitive ban (`bans.deny.wrappers`) would
    # false-positive on serde_derive's proc-macro chain or require a
    # fragile, ever-growing wrapper list — see deny.toml's "AST-library
    # policy" comment for the full rationale.
    #
    # Hardened in #145 with two additional checks:
    #   - Grouped-import multi-line regex (catches `use { syn::Foo };`
    #     and the multi-line `use {\n    syn::Item,\n};` form that the
    #     original leading-token regex misses).
    #   - Direct-dependency `cargo metadata --no-deps` check (catches
    #     `syn = "2.0"` being added to crates/crap-core/Cargo.toml).
    #
    # No untrusted input is interpolated into any `run:` block; every
    # regex / jq expression is a literal static string.
    name: crap-core AST-library purity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install ripgrep
        # `ubuntu-latest` runner images do not ship ripgrep on every
        # generation (empirically observed via #261's `command -v rg`
        # guard tripping on PR #286's run). Three steps in this job
        # shell `rg` — the L2 grouped-import check, the L3.5 adapter-
        # name literal check (#161), and the L4 adapter-vocabulary
        # check (#261). Explicit install guarantees presence so all
        # three layers actually execute. ~10-15s wall-clock overhead
        # per CI run.
        #
        # Defence in depth (#287): the explicit install is the
        # empirical fix, but all three rg-shelling steps below ALSO
        # carry an up-front `command -v rg` guard so that if this
        # install ever regresses (or a future runner image drops
        # ripgrep again), the gates fail loudly with `::error::`
        # rather than silently treating a missing `rg` as "no matches
        # found" and exiting 0. Prior to #287 only L4 carried the
        # guard; L2 and L3.5 used the `if rg ...; then` / `|| true`
        # silent-pass shapes, so they had been no-ops in CI on any
        # ripgrep-less image since they shipped.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Reject AST-library imports in crap-core (leading-token form)
        # Scope: crap-core ONLY. oxc/swc imports are legitimate in
        # crates/crap4ts/ once that lands; crap4rs uses syn. Do NOT
        # widen the path below to `crates/*/src/` — that would reject
        # every adapter. Static pattern, no untrusted-input
        # interpolation. Regex notes:
        #   - Matches both `use` and `extern crate` forms.
        #   - Optional `(::)?` handles absolute-path imports
        #     (`use ::syn::Foo`).
        #   - Trailing `([_:; ]|$)` is a portable word-boundary
        #     substitute that works on GNU and BSD grep (avoids `\b`/
        #     `\w` non-portable shortcuts). Catches `syn::`, `syn;`,
        #     `syn_codegen::`, `swc_ecma_parser::`,
        #     `tree_sitter_typescript::`, etc.; rejects false
        #     positives like `use syntactic_analysis::X`.
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*(use|extern[[:space:]]+crate)[[:space:]]+(::)?(syn|quote|proc_macro2?|tree_sitter|swc|oxc)([_:; ]|$)' crates/crap-core/src/; then
            echo "::error::crap-core must not import AST libraries (leading-token form, e.g. \`use syn::Foo;\`) — see CLAUDE.md and shaping.md"
            exit 1
          fi
          echo "crap-core leading-token imports: clean"
      - name: Reject AST-library imports in crap-core (grouped-import form)
        # Catches `use { syn::Foo };` and the multi-line variant
        # `use {\n    syn::Item,\n};` which the leading-token regex
        # above misses (since the first token after `use` is `{`, not
        # the banned crate). Uses ripgrep's multiline mode (-U) +
        # PCRE2 for `\b` word boundaries.
        #
        # The pattern bounds the match to a single `use { … }` block
        # via `[^}]*`, so nested braces inside a different scope
        # cannot drag a false-positive across statements.
        #
        # Tool-presence guard (same rationale as the layer-4 step
        # below, #287): this step shells `rg`, and the
        # `if rg ...; then` form treats a missing `rg` identically to
        # "no matches found" — the lint would silently pass and exit
        # 0. `ubuntu-latest` runner images do NOT ship ripgrep on
        # every generation (empirically observed via #261's
        # `command -v rg` guard tripping on PR #286's run), so the
        # `Install ripgrep` step above guarantees presence; this
        # up-front guard fails loudly if that install ever regresses
        # or rg drops off the image, rather than letting the gate go
        # silently dead.
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "::error::ripgrep (rg) is required by the ast-purity grouped-import lint but is not on PATH"
            exit 1
          fi
          if rg -nU --pcre2 'use\s*\{[^}]*\b(syn|quote|proc_macro2?|tree_sitter|swc|oxc)\b' crates/crap-core/src/; then
            echo "::error::crap-core must not import AST libraries (grouped-import form, e.g. \`use { syn::Foo };\`) — see CLAUDE.md and shaping.md"
            exit 1
          fi
          echo "crap-core grouped imports: clean"
      - name: Reject AST-library direct dependencies in crap-core/Cargo.toml
        # `cargo metadata --no-deps` lists workspace packages with
        # their declared dependencies but does NOT resolve the
        # transitive graph — so serde_derive's transitive `syn` does
        # not false-positive (the documented reason cargo-deny
        # transitive bans were rejected; see shaping.md "Patterns
        # NOT copied" #3). Caught case: someone adds
        # `syn = "2.0"` directly to crates/crap-core/Cargo.toml.
        run: |
          set -euo pipefail
          banned=$(cargo metadata --format-version 1 --no-deps |
            jq -r '
              .packages[] |
              select(.name == "crap-core") |
              .dependencies[] |
              select(.name | test("^(syn|quote|proc-macro2|tree-sitter|swc|oxc)$")) |
              .name')
          if [ -n "$banned" ]; then
            echo "::error::crap-core declares banned direct dependency: $banned (see CLAUDE.md and shaping.md)"
            exit 1
          fi
          echo "crap-core direct dependencies: clean"
      - name: Reject adapter-name string literals in crap-core
        # Structural protection against silent re-coupling: if a future
        # change re-introduces `"crap4rs"` or `"crap4ts"` as a string
        # literal in crap-core source, that's a regression — adapter
        # names belong in `AdapterMeta` supplied by the binary, never
        # baked into the language-agnostic library (#161).
        #
        # Two architectural exemptions (added in PR ζ #315):
        #
        # 1. `src/bin/**` — orchestrator binaries inside crap-core
        #    (e.g. `crap-render`, the multi-language renderer) are
        #    the legitimate seat of adapter-name knowledge. They
        #    play the same role for the renderer that `crap4rs/main`
        #    and `crap4ts/main` play for the per-adapter binaries.
        #    The gate's original rule was authored before crap-core
        #    shipped a binary.
        #
        # 2. `#[cfg(test)]` blocks — test fixtures construct
        #    `LanguageBlock` instances with literal `"crap4rs"` /
        #    `"crap4ts"` tool names; obscuring the adapter identity
        #    behind helper constants would make fixtures less
        #    readable. The gate trims each scanned file at its first
        #    `#[cfg(test)]` line (file-tail convention: every test
        #    module in crap-core lives at the bottom of its file —
        #    if that ever stops being true the gate needs a brace
        #    tracker).
        #
        # Doc comments and code comments (`///`, `//!`, `//`, `/*`
        # block openers, leading `*` continuation lines) are allowed
        # to mention the adapter names — those are legitimate
        # references in the API surface docstrings. The awk filter
        # strips rg's `path:lineno:` prefix and only fires on lines
        # whose content (after optional whitespace) does NOT start
        # with a comment marker.
        #
        # Comment-skip filter shape (#287): the filter skips lines
        # whose content starts with `//`, `/*`, `* ` (space after the
        # asterisk), or a bare `*` at end of line — covering `///`,
        # `//!`, `/* … */` openers, and ` * ` / ` *` block-comment
        # continuation lines. The bare `*` form (no trailing space, not
        # at EOL) is intentionally NOT skipped: Rust deref-assignment
        # idioms like `*p = "crap4rs";` start with `*` followed by a
        # variable, so an over-broad `^\*` skip would let a real
        # re-coupling leak slip through silently. This is the same
        # `^(\/\/|\/\*|\* |\*$)` filter the layer-4 step below uses —
        # the two adapter-string gates now share one comment-skip
        # convention (the original `^(\/\/|\/\*|\*)` here was too
        # aggressive on the bare `*` line-start; #286's layer-4 step
        # hardened it first, #287 propagates the tightening here).
        #
        # Tool-presence guard (#287): this step shells `rg`, and the
        # `rg ... 2>/dev/null || true` form treats a missing `rg`
        # identically to "no matches found" — the lint would silently
        # pass and exit 0. The `Install ripgrep` step above guarantees
        # presence on `ubuntu-latest`; this up-front guard fails loudly
        # if that install ever regresses or rg drops off the image.
        #
        # No untrusted-input interpolation: literals and patterns are
        # static; rg/awk invocations contain no event-context
        # references and process only checked-in source files.
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "::error::ripgrep (rg) is required by the ast-purity adapter-name lint but is not on PATH"
            exit 1
          fi
          # Pre-pass: enumerate files that hit the patterns (excluding
          # src/bin/**), then for each file emit `path:lineno:content`
          # only for lines BEFORE its first `#[cfg(test)]` marker.
          files=$(rg -lF -e '"crap4rs"' -e '"crap4ts"' \
            --glob '!**/src/bin/**' \
            crates/crap-core/src 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "crap-core adapter-name literals: clean (bin/test exemptions in force)"
            exit 0
          fi
          hits=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            file_hits=$(awk '/#\[cfg\(test\)\]/{exit} {print FILENAME":"NR":"$0}' "$f" \
              | grep -F -e '"crap4rs"' -e '"crap4ts"' || true)
            if [ -n "$file_hits" ]; then
              hits="${hits}${file_hits}"$'\n'
            fi
          done <<< "$files"
          if [ -z "$hits" ]; then
            echo "crap-core adapter-name literals: clean (bin/test exemptions in force)"
            exit 0
          fi
          non_comment_hits=$(echo "$hits" | awk -F: '
            {
              if (NF < 3) next
              content = ""
              for (i = 3; i <= NF; i++) content = content (i > 3 ? ":" : "") $i
              gsub(/^[ \t]+/, "", content)
              if (content !~ /^(\/\/|\/\*|\* |\*$)/) print
            }
          ')
          if [ -n "$non_comment_hits" ]; then
            echo "::error::crap-core must not contain \"crap4rs\" / \"crap4ts\" string literals outside src/bin/** or #[cfg(test)] blocks — adapter names belong in AdapterMeta from the binary (see #161)"
            echo "$non_comment_hits"
            exit 1
          fi
          echo "crap-core adapter-name literals: clean (bin/test exemptions in force, comment-only references allowed)"
      - name: Reject adapter-vocabulary string literals in crap-core
        # Layer 4 of crap-core's purity gate. Layers 1-3 (above) ban
        # `syn`/`oxc`/`tree_sitter`/etc. at the import + direct-dep
        # level. This layer bans the vocabulary of adapter-specific
        # coverage source formats from appearing inside user-facing
        # string literals (`format!`, `#[error("…")]`, bare `"…"`).
        #
        # Banlist (case-sensitive, proper-noun forms): `LCOV`,
        # `Istanbul`, `TypeScript`, `LCOV-flavou?red`. These are
        # source-format tokens, not AST-library tokens — a leak via
        # `format!("Failed to parse LCOV: {err}")` is not caught by
        # L1/L2/L3 because no import or dep change is required. The
        # case-sensitive proper-noun match is the noise filter that
        # distinguishes user-prose ("LCOV parse issue") from
        # filename literals like `"lcov.info"` and fixture paths
        # like `"src/adapters/lcov.rs"` — those use lowercase by
        # convention and aren't English-prose leaks.
        #
        # Three architectural exemptions (PR ζ #315 extended L4 with
        # the same shape applied to the adapter-name gate above):
        #
        # 1. `src/bin/**` — crap-render is an orchestrator binary
        #    that knows every adapter; producing "Rust"/"TypeScript"
        #    display labels for the per-adapter footer is its job.
        #
        # 2. `**/snapshots/**` — insta snapshot files under
        #    `src/adapters/reporters/snapshots/` are test artifacts,
        #    not library code; they contain rendered HTML literals
        #    that include the adapter display names by design.
        #
        # 3. `#[cfg(test)]` blocks — test fixtures construct
        #    LanguageBlock entries with literal display names; the
        #    gate trims each scanned file at its first `#[cfg(test)]`
        #    marker (file-tail convention).
        #
        # `rg` flag note: ripgrep treats patterns as regex by
        # default; the `-E` flag in ripgrep means `--encoding`,
        # NOT `--extended-regex` (which is grep's `-E`). Bare
        # invocation `rg PATTERN PATH` is the right shape.
        #
        # Tool-presence check: `rg` must be on PATH or the gate
        # would silently pass via `|| true` (the false-sense-of-
        # security trap). On `ubuntu-latest` ripgrep is preinstalled.
        #
        # Doc/inline/block comments are allowed to mention these
        # tokens (the awk filter skips lines whose content starts
        # with `//`, `/*`, `* ` followed by space, or bare `*` at
        # end of line — covering `///`, `//!`, `/* … */` openers,
        # and ` * ` / ` *` continuation lines without swallowing
        # Rust deref-assignment like `*ptr = "LCOV"`).
        #
        # The bare `*` form (no space) is intentionally NOT
        # comment-skipped — Rust comment continuation uses ` * `
        # (space-asterisk-space) or a bare ` *` (space-asterisk-EOL).
        # Deref-assign idioms (`*ptr = "Istanbul";`) must still
        # trip the lint.
        #
        # No untrusted input interpolated; rg/awk patterns are
        # literal static strings; the gate processes only checked-in
        # source files.
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "::error::ripgrep (rg) is required by the ast-purity-strings lint but is not on PATH"
            exit 1
          fi
          files=$(rg -l '"[^"]*(LCOV|Istanbul|TypeScript|LCOV-flavou?red)[^"]*"' \
            --glob '!**/src/bin/**' \
            --glob '!**/snapshots/**' \
            crates/crap-core/src 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "crap-core adapter-vocabulary literals: clean (bin/snapshot/test exemptions in force)"
            exit 0
          fi
          hits=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            file_hits=$(awk '/#\[cfg\(test\)\]/{exit} {print FILENAME":"NR":"$0}' "$f" \
              | grep -E '"[^"]*(LCOV|Istanbul|TypeScript|LCOV-flavou?red)[^"]*"' || true)
            if [ -n "$file_hits" ]; then
              hits="${hits}${file_hits}"$'\n'
            fi
          done <<< "$files"
          if [ -z "$hits" ]; then
            echo "crap-core adapter-vocabulary literals: clean (bin/snapshot/test exemptions in force)"
            exit 0
          fi
          non_comment_hits=$(echo "$hits" | awk -F: '
            {
              if (NF < 3) next
              content = ""
              for (i = 3; i <= NF; i++) content = content (i > 3 ? ":" : "") $i
              gsub(/^[ \t]+/, "", content)
              if (content !~ /^(\/\/|\/\*|\* |\*$)/) print
            }
          ')
          if [ -n "$non_comment_hits" ]; then
            echo "::error::crap-core must not contain LCOV/Istanbul/TypeScript string literals outside src/bin/**, snapshots/**, or #[cfg(test)] blocks — coverage source format names belong to adapters, not the domain library (see #261)"
            echo "$non_comment_hits"
            exit 1
          fi
          echo "crap-core adapter-vocabulary literals: clean (bin/snapshot/test exemptions in force, comment-only references allowed)"

  mutants-skip-lint:
    # Mechanical enforcement of the carry-forward rule documented at the top
    # of `.cargo/mutants.toml`: every test that shells `cargo_bin("crap4rs"|
    # "crap4ts")` under a scoped `cargo mutants` gate that doesn't build
    # that bin must carry a `--skip` substring token in
    # `additional_cargo_test_args`. #224's root cause was that rule being
    # silently violated when `crap4rs_no_flag_default_cognitive_still_works`
    # landed without the matching token, which aborted the entire `crap4ts`
    # walker mutants run (`cargo mutants` exited 4, zero mutants tested,
    # gate went silently dead). The rule was documented but not enforced;
    # this job is the enforcement.
    #
    # See `scripts/mutants-skip-lint.py` for the limitation notes (literal
    # `cargo_bin("X")` in `#[test]` fn body only; helper-mediated and
    # parameterized-bin-name calls are out of scope).
    #
    # Mirrors the `lefthook.yml` pre-push step — single source of truth in
    # `scripts/mutants-skip-lint.py`.
    #
    # `actions/checkout` is SHA-pinned with a trailing `# v4` comment, in
    # line with the repo-wide convention; `persist-credentials: false`
    # keeps the checkout token out of the runner's `.git/config` (this
    # job never pushes), and `permissions: contents: read` enforces
    # least privilege. See AGENTS.md "Supply-chain hygiene" for the
    # SHA-pin + Dependabot policy.
    name: mutants-skip lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint .cargo/mutants.toml `--skip` coverage of adapter-bin-shelling tests
        run: python3 scripts/mutants-skip-lint.py

  version-edit-lint:
    # Mechanical enforcement of crap-rs#448's release-process contract:
    # release-plz owns every `[package] version` bump. A NON-release PR
    # that hand-edits a crate's published version is rejected here — the
    # drift that stranded crap-core 0.6.0/0.7.0 as phantom versions
    # (changelogged on `main`, never tagged/published) and produced the
    # confusing 0.5 -> 0.8 -> 0.9 jump cutting release #373.
    #
    # Gated to non-release PRs: release-plz's own release PR (head ref
    # `release-plz-*`) is where version bumps legitimately land, so this
    # job is skipped there. The lint compares the PARSED [package].version
    # (and [workspace.package].version) value before/after — NOT diff
    # lines — so a [dependencies] / inline dep-table version change can
    # never false-positive. `fetch-depth: 0` + the PR base SHA give the
    # before/after `git show` the history it needs.
    #
    # `actions/checkout` SHA-pinned per the repo-wide convention;
    # `persist-credentials: false` (never pushes) and `permissions:
    # contents: read` enforce least privilege. Mirrors the `lefthook.yml`
    # pre-push step — single source of truth in
    # `scripts/version-edit-lint.py`. See AGENTS.md "Version ownership".
    name: version-edit lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test the version-ownership lint logic
        run: python3 scripts/version-edit-lint.py --self-test
      - name: Reject non-release `[package] version` bumps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/version-edit-lint.py

  encoded-defect-lint:
    # Mechanical enforcement of AGENTS.md "Encoded-defect discipline": a
    # deliberately-wrong / deferred VALUE frozen into a test, snapshot, or
    # fixture must carry a tracking anchor — `tracked: crap-rs#<n>` (active)
    # or `resolved: crap-rs#<n>` (historical/post-mortem). The rc.4 release
    # shipped a wire envelope whose `language` was frozen to the wrong value
    # under a "wrong-by-design pending a later fix" comment, and because the
    # snapshot WAS the oracle the deferred defect sailed green to publish.
    # This gate makes that deferral class accountable — same discipline as
    # `~/.claude/rules/exclusions.md` (documentation rots; CI doesn't).
    #
    # Matches only unambiguous "deliberately wrong" markers (wrong-by-design
    # / known-wrong / wrong-on-purpose / deliberately|intentionally wrong),
    # NOT bare "by design" (a legitimate design statement). Scoped to
    # source/test/snapshot/fixture files under `crates/` (excludes
    # `scripts/` + `*.md`, which name the markers in their own definition).
    #
    # `actions/checkout` SHA-pinned per the repo-wide convention;
    # `persist-credentials: false` (never pushes) + `permissions:
    # contents: read` enforce least privilege. Mirrors the `lefthook.yml`
    # pre-push step — single source of truth in
    # `scripts/encoded-defect-lint.py`. See AGENTS.md "Encoded-defect
    # discipline".
    name: encoded-defect lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Self-test the encoded-defect lint logic
        run: python3 scripts/encoded-defect-lint.py --self-test
      - name: Reject unanchored deliberately-wrong markers
        run: python3 scripts/encoded-defect-lint.py

  bdd-tracked-lint:
    # Mechanical enforcement of AGENTS.md "BDD hygiene" Rules 1 and 2
    # across `crates/*/tests/features/` (single script, two rules):
    #   Rule 1 — every `Scenario:` / `Scenario Outline:` carries EXACTLY
    #     ONE status tag (`@wired` / `@unwired` / `@wip`). Zero status
    #     tags (the scenario escapes the lexicon) and more than one
    #     (mutually-exclusive tags can't coexist) both fail. Added in
    #     crap-rs#280 after CodeRabbit flagged 45 untagged scenarios in
    #     delta.feature that silently passed the Rule-2-only lint.
    #   Rule 2 — every `@unwired` / `@wip` scenario carries a
    #     `# tracked: crap-rs#<n>` comment inside its scenario block,
    #     naming the issue that owns the wiring deferral.
    # Without this gate, the rules were documented but unenforced —
    # documentation rots; CI doesn't.
    #
    # See `scripts/bdd-tracked-lint.py` for the parser shape and
    # limitations. Mirrors the `lefthook.yml` pre-push step — single
    # source of truth in the script. The job id + display name are kept
    # as `bdd-tracked-lint` (unchanged from the Rule-2-only era) so a
    # branch-protection required-check reference does not break.
    #
    # Conventions follow the post-#264 supply-chain hardening: scoped
    # `permissions: contents: read`, `persist-credentials: false` on
    # checkout, no cache (the lint is pure-Python and finishes in
    # under a second; caching is overhead, not savings).
    name: bdd-tracked-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Self-test the BDD-hygiene lint logic (Rule 1 + Rule 2 fixtures)
        run: python3 scripts/bdd-tracked-lint.py --self-test
      - name: 'Lint status-tag (Rule 1) + `# tracked:` (Rule 2) coverage of every scenario'
        run: python3 scripts/bdd-tracked-lint.py

  bdd-mislevel-lint:
    # Mechanical enforcement of the Testing Strategy Boundary Rule's
    # mechanizable SHADOW across the cucumber suite — the sibling of
    # bdd-tracked-lint that joins `crates/*/tests/*_cucumber.rs`
    # harnesses to their `crates/*/tests/features/*.feature` specs:
    #   RULE A (FAIL) — a `@wired`/`@wip` scenario narrating a backtick
    #     CLI run (`crap4rs`/`crap4ts`/`crap-render`) bound to a harness
    #     with ZERO spawn markers (`cargo_bin(`/`CARGO_BIN_EXE_`) —
    #     advertises a CLI contract but executes a library call. Plus the
    #     A-OPTOUT (lib-direct-by-design marker shape) + A-COHERENCE
    #     (opted-out harness must stop narrating a CLI run) sub-rules.
    #   RULE B (FAIL) — every harness binds exactly one resolvable,
    #     existing feature path (makes RULE A's join sound).
    #   RULE D (WARN) — `bdd-asserts-only` marker shape, presence-only.
    # The keystone Boundary-Rule judgment ("is this a product contract?")
    # is NOT mechanizable and stays a CQO/council audit; this gate
    # enforces only the provable shadow. Documentation rots; CI doesn't.
    #
    # See `scripts/bdd-mislevel-lint.py` for the rules + limitations.
    # Mirrors the `lefthook.yml` pre-push step — single source of truth
    # in the script. Separate job (not folded into bdd-tracked-lint) so
    # each gate's required-check identity + blast radius stay distinct.
    # Conventions: scoped `permissions: contents: read`,
    # `persist-credentials: false`, no cache (pure-Python, sub-second).
    name: bdd-mislevel-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Self-test the mis-leveling lint logic (RULE A/B/optout/coherence/D fixtures)
        run: python3 scripts/bdd-mislevel-lint.py --self-test
      - name: 'Lint narration/execution (RULE A) + feature-link (RULE B) across the cucumber suite'
        run: python3 scripts/bdd-mislevel-lint.py

  config-discovery-lint:
    # Mechanical enforcement of the crap-rs#339 C-2 isolation rule: any
    # analyzer-shelling test that passes an IN-REPO `--src` (a string
    # literal / format!) without a covering `--config` and without a
    # tempdir `.current_dir(...)` would, under walk-upward discovery,
    # climb into the repo-root `crap.toml` (crap-rs#346) and let its
    # wire-envelope / parity / schema snapshot drift on an unrelated
    # sibling merge. The fix is an explicit empty `--config` fixture;
    # this job is its enforcement — documentation rots, CI doesn't.
    #
    # See `scripts/config-discovery-lint.py` for the per-invocation
    # detection shape and limitation notes. Mirrors the `lefthook.yml`
    # pre-push step — single source of truth in the script.
    #
    # Conventions follow the supply-chain hardening: scoped
    # `permissions: contents: read`, `persist-credentials: false` on
    # checkout, no cache (pure-Python, sub-second).
    name: config-discovery lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint in-repo `--src` adapter invocations carry an explicit `--config`
        run: python3 scripts/config-discovery-lint.py

  config-ast-purity-lint:
    # Mechanical enforcement of the crap-rs#342 rule: crap-core's config
    # adapter (`crates/crap-core/src/adapters/config.rs`) must stay
    # name-agnostic — no per-adapter literals (`"crap4rs.toml"`,
    # `"crap4ts.toml"`, `"crap4rs"`, `"crap4ts"`) in source OR inline
    # tests. The per-adapter names belong only in each binary's
    # `AdapterMeta::config_file_names`; discovery flows through that, so a
    # literal in config.rs is a layering smell. The unified `"crap.toml"`
    # and adapter names in `//`/`///` comments are allowed (the gate
    # matches string literals only).
    #
    # See `scripts/config-ast-purity-lint.py` for the matcher + limitation
    # notes. Mirrors the `lefthook.yml` pre-push step — single source of
    # truth in the script.
    #
    # Conventions follow the supply-chain hardening: scoped
    # `permissions: contents: read`, `persist-credentials: false` on
    # checkout, no cache (pure-Python, sub-second).
    name: config-ast-purity lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint crap-core config.rs carries no per-adapter literals
        run: python3 scripts/config-ast-purity-lint.py

  templated-example-lint:
    # Mechanical structural lint for the consumer-facing templated
    # example at `.github/workflows/examples/crap-scorecard.yml`.
    # Asserts via `yq` that the action invocation uses `run-mode:
    # full` AND does NOT include a `baseline:` input — the only
    # combination the action accepts without "both/delta requires
    # baseline" errors on first-touch copy-paste. Replaces a
    # "verified manually by reading the file" gate with a CI-level
    # assertion that can't drift.
    name: templated-example-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install yq
        # `mikefarah/yq` (Go binary) — the python `yq` does not handle
        # the `(.jobs.*.steps[] | select ...)` syntax below. Installed
        # via snap rather than `taiki-e/install-action` because the
        # latter resolves `yq@4` through cargo-binstall, which can't
        # find a Cargo package matching that requirement (the Go
        # binary lives on a non-Rust release channel).
        run: sudo snap install yq

      - name: Assert templated example uses run-mode:full + no baseline
        run: |
          set -euo pipefail
          FILE=.github/workflows/examples/crap-scorecard.yml
          RUN_MODE=$(yq -r '.jobs.*.steps[] | select(.uses // "" | test("scorecard@<sha>$")) | .with["run-mode"]' "$FILE")
          if [ "$RUN_MODE" != "full" ]; then
            echo "::error::templated example must use run-mode: full (got '$RUN_MODE') so consumers can copy-paste without baseline-required errors"
            exit 1
          fi
          HAS_BASELINE=$(yq -r '.jobs.*.steps[] | select(.uses // "" | test("scorecard@<sha>$")) | .with | has("baseline")' "$FILE")
          if [ "$HAS_BASELINE" = "true" ]; then
            echo "::error::templated example must NOT include 'baseline:' input — it's the upgrade-only path per Pattern 2b"
            exit 1
          fi
          echo "OK: templated example carries run-mode: full with no baseline (consumer-safe)"

  docs:
    name: cargo doc (warnings as errors)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # tracks @stable branch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: crap4rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  release-plz-app-scope-audit:
    # Leaf-scope drift check: assert this repo's name appears in the
    # canonical release-plz App allowlist
    # (breezy-bays-labs/.github/release-plz-allowlist.toml). Catches
    # the case where a PR on the .github repo silently drops this
    # repo from the allowlist — without this gate that drift would
    # only surface at the next release-plz token-mint attempt,
    # mid-release.
    #
    # NOT an org-global audit. A leaf-scope check runs on the default
    # GITHUB_TOKEN (repo-scoped, sufficient to read public contents
    # via the contents API). The complementary org-global audit
    # — compare the canonical TOML against the App's actual
    # per-repo installations — needs an Org Admin PAT, so it lives in
    # a centralized cron in the breezy-bays-labs/.github repo rather
    # than every consumer's CI.
    name: release-plz App scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # `dasel` (TOML-aware parser used by the audit script) is not
      # currently available via taiki-e/install-action OR
      # cargo-binstall's prebuilt-binary index, so we curl the
      # upstream binary directly and verify a SHA256 baked into this
      # step. Bumping the version is a two-step manual edit (new
      # DASEL_VERSION + recompute DASEL_SHA256), kept inline so the
      # supply-chain provenance stays in one place — Dependabot
      # doesn't have an ecosystem for curl-fetched binaries.
      - name: Install dasel
        env:
          DASEL_VERSION: v2.8.1
          DASEL_SHA256: 21fda0a4dc3c779c42737eca4b37e4f187d7ab91ba6301eed97b801af84a9ea2
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/TomWright/dasel/releases/download/${DASEL_VERSION}/dasel_linux_amd64" \
            -o /tmp/dasel
          echo "${DASEL_SHA256}  /tmp/dasel" | sha256sum -c -
          chmod +x /tmp/dasel
          mkdir -p "$HOME/.local/bin"
          mv /tmp/dasel "$HOME/.local/bin/dasel"
          dasel --version
      - name: Audit allowlist for this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-plz-app-scope-audit.sh

  zizmor:
    # Mechanical enforcement of the SHA-pin + workflow-security policy.
    # Runs `zizmor` (https://woodruffw.github.io/zizmor/) over every
    # workflow + composite action. The `unpinned-uses` audit is the
    # primary gate — any new floating-tag `uses:` reference (in a
    # workflow OR a composite action) fails CI here. Other zizmor
    # audits (template-injection, excessive-permissions, etc.) ride
    # along as additional supply-chain hygiene checks at no marginal
    # cost. Dedicated job (parallelizable, fail-fast) rather than
    # chained into ast-purity / cargo-deny so a supply-chain regression
    # surfaces without waiting on the Rust toolchain. zizmor itself is
    # installed via `pipx run` from the public Python registry — no
    # third-party action wrapper to pin (the wrapper itself would just
    # be another `uses:` reference to keep fresh).
    #
    # See AGENTS.md "Supply-chain hygiene" for the convention this job
    # enforces.
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run zizmor on .github/
        # `pipx run` fetches a pinned-by-PyPI build into a transient
        # venv; the `>=1.5,<2` constraint locks the audit ruleset to
        # the 1.x major so a zizmor release tightening rules doesn't
        # flip CI red between PRs. Bumping the constraint is a manual
        # edit (no Dependabot ecosystem covers this invocation form);
        # the major-version cap means 2.x lands via human-reviewed PR.
        run: pipx run 'zizmor>=1.5,<2' .github/
