# Pages cleanup — Wave 2a of the hosted per-PR HTML scorecard reports
# epic. When a PR against main closes (merged OR not), this removes that
# PR's report directory (`pr-<N>/`) from the gh-pages branch so per-PR
# reports don't accumulate forever on the Pages branch as PRs come and
# go. `pr-<N>/` is created either inline by the per-PR publish step in
# `.github/actions/scorecard/action.yml` (same-repo PRs) or by the
# privileged `pages-publish-fork.yml` workflow (fork PRs, crap-rs#386);
# this is the matching teardown for both.
#
# DEDICATED workflow, deliberately NOT folded into ci.yml: adding
# `closed` to ci.yml's `pull_request:` types would run the entire CI
# suite (fmt/clippy/test matrix/coverage/mutants/scorecards) on every
# PR close — wasteful. This workflow runs ONE tiny git operation.
name: Pages cleanup

on:
  # pull_request_target runs privileged in the BASE context, which is what
  # lets this cleanup push a deletion to gh-pages even when a FORK PR
  # closes — a fork's plain `pull_request` token is read-only and could
  # not push (crap-rs#386, once fork PRs publish `pr-<N>/` dirs that need
  # tearing down). It is safe here because this job checks out NO code
  # (neither base nor fork) and uses exactly ONE input — the PR number —
  # which it validates as a positive integer before using it as a
  # filesystem path. With no checkout-and-run of head code, the
  # pull_request_target "pwn request" footgun does not apply; the trigger
  # only supplies the privileged token the metadata-only deletion needs.
  # See docs/pages-fork-reports.md.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
    branches: [main]

# Least-privilege default: read-only at the workflow level. The single
# job below elevates to `contents: write` only for itself (it needs to
# push the deletion commit to gh-pages).
permissions:
  contents: read

jobs:
  cleanup-pr-report:
    name: Remove closed PR's report from gh-pages
    runs-on: ubuntu-latest
    permissions:
      # Elevate ONLY here: contents: write authorizes the push of the
      # deletion commit to the gh-pages branch. The top-level workflow
      # default stays contents: read.
      contents: write
    # Shared gh-pages publish lock (epic #377). This cleanup push and the
    # publish pushes in ci.yml (`scorecard-production` per-PR publish and
    # `publish-production-report` push-to-main publish) all use the SAME
    # named group. Concurrency group names are repo-global, so a same-named
    # group serializes the gh-pages tip across separate workflow files —
    # a cleanup push can't collide with a publish push. cancel-in-progress
    # is false so an in-flight publish is never aborted mid-push by a
    # cleanup (and vice versa); the second one queues and runs after.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      # Single bash step. No `actions/checkout` of the PR branch is
      # needed — the cleanup clones gh-pages separately via a tokened
      # clone (the same self-contained plain-git mechanism Wave 0/1 use),
      # so this workflow has ZERO `uses:` references and therefore no
      # action-pinning / persist-credentials surface to maintain.
      #
      # Template-injection hygiene: the PR number flows through the `env:`
      # block (PR_NUMBER), never via `${{ }}` interpolation inside the
      # `run:` script. The token is `secrets.GITHUB_TOKEN` — correct here
      # because this is a workflow job (composite ACTIONS must use
      # `github.token` instead, which is why the action.yml publish step
      # differs). $GITHUB_REPOSITORY is shell-quoted.
      - name: Remove pr-${{ github.event.number }} from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # Defense-in-depth: PR_NUMBER is GitHub's own integer, but it
          # becomes a filesystem path (pr-<N>/) below, so validate it as a
          # run of digits before use — the same path-traversal guard the
          # fork-publish workflow applies to its artifact-sourced number.
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::Pages cleanup: PR number ('${PR_NUMBER}') is not a positive integer; refusing to operate on a derived path."
              exit 1
              ;;
          esac
          # Shallow tokened clone of gh-pages. $GITHUB_REPOSITORY is the
          # BASE repo on every close (fork or not), so this always targets
          # the canonical gh-pages branch — and under pull_request_target
          # the token is read-write on fork closes too, so the deletion
          # push below succeeds regardless of where the PR originated.
          #
          # Missing-branch tolerance (consumer robustness): a fresh
          # consumer repo that has never published a per-PR report has no
          # gh-pages branch, so the --branch clone would fail fatally and
          # red-X this cleanup for a PR that never created anything to
          # clean. Treat a clone failure as "nothing to clean" and exit 0
          # — there is no per-PR directory to remove when the branch
          # itself does not exist. (For crap-rs gh-pages always exists, so
          # this path is never taken here; it benefits fresh consumers.)
          if ! git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages-cleanup 2>/dev/null; then
            echo "No gh-pages branch yet — nothing to clean (no-op)."
            exit 0
          fi
          cd gh-pages-cleanup
          # Dir-existence check is the whole story: remove `pr-<N>/` if it
          # exists, no-op otherwise. Under pull_request_target the job has
          # a write token on BOTH same-repo and fork closes, so a fork PR's
          # `pr-<N>/` (published by the privileged fork workflow,
          # crap-rs#386) is torn down here exactly like a same-repo one.
          # The absent-dir no-op still covers a re-run, an already-clean
          # state, a PR that never published, and any close whose report
          # was never created — no same-repo `if:` gate needed.
          if [ -d "pr-${PR_NUMBER}" ]; then
            git rm -r "pr-${PR_NUMBER}"
            # No-op guard: if nothing is actually staged (e.g. the dir was
            # already empty / untracked), skip an empty commit and exit
            # clean rather than failing on `git commit`.
            if [ -z "$(git status --porcelain)" ]; then
              echo "pr-${PR_NUMBER}/ matched no tracked files — nothing to commit (no-op)"
              exit 0
            fi
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci(pages): remove per-PR report for closed PR #${PR_NUMBER}"
            git push origin HEAD:gh-pages
            echo "Removed pr-${PR_NUMBER}/ from gh-pages."
          else
            echo "No pr-${PR_NUMBER}/ on gh-pages — nothing to clean (no-op)."
            exit 0
          fi
