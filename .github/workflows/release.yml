name: Release

# Triggered by `v*` tags. Today this workflow builds platform binaries for
# `crap4rs` and creates a GitHub release with those binaries attached. The
# crates.io publishing path has been retired pending release-plz adoption
# (crap-rs#270 — that issue restores `cargo publish` via OIDC trusted
# publishing alongside per-crate tag prefixes and CHANGELOG management).
on:
  push:
    tags: ['v*']

# Default workflow permissions: least privilege. Per-job overrides below.
permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86
    steps:
      # `persist-credentials: false` — this job never pushes; not persisting
      # the checkout token keeps it out of the runner env (closes the
      # `artipacked` zizmor audit). See AGENTS.md "Supply-chain hygiene".
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # `enable-cache: false` — release workflows must neither restore nor
      # save caches under tag triggers; a poisoned cache from a malicious
      # tag push would otherwise become part of the released artifact.
      # Closes the `cache-poisoning` zizmor audit. See
      # https://docs.zizmor.sh/audits/#cache-poisoning.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          enable-cache: "false"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: tar czf crap4rs-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release crap4rs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap4rs-${{ matrix.target }}
          path: crap4rs-${{ matrix.target }}.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # `gh release create` replaces the `softprops/action-gh-release` step
      # that lived here previously: same feature set (notes generation +
      # multi-file uploads), one less third-party action to SHA-pin. Closes
      # the `superfluous-actions` zizmor audit.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*.tar.gz
