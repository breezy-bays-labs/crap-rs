name: 'CRAP Scorecard'
description: 'Run CRAP analysis with optional baseline delta and emit a markdown scorecard composable into PR-comment bots.'
author: 'Breezy Bays Labs'
branding:
  icon: 'activity'
  color: 'orange'

inputs:
  language:
    description: |
      Language to analyze. `rust` runs crap4rs over an LCOV file.
      `typescript` runs crap4ts over an Istanbul JSON file (the crap4ts
      binary must be pre-installed on `PATH` — see the action README's
      "crap4ts install" note for the reason). `auto` (default) infers
      from the `coverage` file extension: `.info`/`.lcov` -> rust,
      `.json` (Istanbul) -> typescript.
    required: false
    default: 'auto'
  coverage:
    description: 'Path to the coverage file. LCOV (.info) for Rust, Istanbul JSON for TypeScript.'
    required: true
  src:
    description: 'Source root directory passed to the analyzer.'
    required: false
    default: '.'
  baseline:
    description: |
      Path to a previously-captured CRAP JSON envelope to compare against.
      Leave empty to skip delta and emit an analysis-only scorecard. Producing
      the baseline (typically a coverage run on the PR base) is the caller's
      responsibility — this action does not auto-checkout, by design.
    required: false
    default: ''
  threshold:
    description: 'CRAP threshold — functions above this are violations.'
    required: false
    default: '15'
  config:
    description: 'Optional path to a crap4rs.toml config file.'
    required: false
    default: ''
  delta-gate:
    description: |
      When `true` and a baseline is provided, the action exits non-zero if any
      new threshold violations land. The markdown scorecard is still emitted as
      an output. Independent of `analysis-gate`.
    required: false
    default: 'false'
  analysis-gate:
    description: |
      When `true`, the action exits non-zero if the analysis itself fails the
      threshold. Default `false` keeps the action measurement-only — callers
      who want hard gates run a separate `crap4rs` step or set this true.
    required: false
    default: 'false'
  comment-mode:
    description: |
      `none` (default): outputs only — composable into PR-metrics
      aggregator workflows.
      `sticky`: post/update a sticky PR comment using
      marocchino/sticky-pull-request-comment. Requires `pull-requests: write`
      on the calling job.
    required: false
    default: 'none'
  comment-header:
    description: |
      Sticky-comment identifier when `comment-mode: sticky`. Multiple actions
      can post distinct sticky comments by varying this header.
    required: false
    default: 'crap-scorecard'
  version:
    description: |
      `crap4rs` version to install. `latest` (default) resolves to the most
      recent release. Pin to a tag (e.g. `0.2.1`) for reproducible CI.
    required: false
    default: 'latest'

outputs:
  markdown:
    description: 'The rendered markdown scorecard. Consume directly in aggregator bots.'
    value: ${{ steps.run.outputs.markdown }}
  row-json:
    description: |
      The `Row::CrapDelta` JSON object emitted by the dispatched
      adapter's `--format scorecard-row`. Conforms to the locked
      scorecard schema fragment at
      `crates/crap4rs/tests/fixtures/scorecard/schema.json` in this
      repo (the `CrapDelta` member of `definitions/Row` `oneOf`).
      Consume in aggregator workflows that re-render the scorecard
      with full layout control instead of parsing `outputs.markdown`.
      Producer-side status policy lives in crap-core's shared
      `format_as_scorecard_row` routing — see
      `docs/scorecard-row-contract.md`.
    value: ${{ steps.run.outputs.row_json }}
  json-envelope-path:
    description: 'Path to the full JSON envelope on the runner — pass to downstream tooling.'
    value: ${{ steps.run.outputs.envelope_path }}
  analysis-passed:
    description: '`true` if the analysis itself passed the threshold.'
    value: ${{ steps.run.outputs.analysis_passed }}
  delta-passed:
    description: '`true` if a baseline was supplied and no new violations landed. Empty string when no baseline was supplied.'
    value: ${{ steps.run.outputs.delta_passed }}
  new-violations:
    description: 'Count of functions that exceed the threshold but did not in the baseline. `0` when no baseline.'
    value: ${{ steps.run.outputs.new_violations }}
  regressions:
    description: 'Count of modified functions whose CRAP score increased above the rendering precision threshold. `0` when no baseline.'
    value: ${{ steps.run.outputs.regressions }}

runs:
  using: 'composite'
  steps:
    - name: Resolve language
      id: lang
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        set -euo pipefail
        resolved="$LANGUAGE"
        if [ "$resolved" = "auto" ]; then
          case "$COVERAGE" in
            *.info|*.lcov) resolved="rust" ;;
            *.json)        resolved="typescript" ;;
            *) echo "::error::cannot infer language from coverage path '$COVERAGE'; set inputs.language explicitly"; exit 1 ;;
          esac
        fi
        # Whitelist the resolved value so an explicit unsupported
        # `inputs.language` fails fast instead of silently skipping
        # every conditional step and returning empty outputs.
        case "$resolved" in
          rust|typescript) ;;
          *)
            echo "::error::unsupported language '$resolved'; expected one of: rust, typescript, auto"
            exit 1
            ;;
        esac
        echo "language=$resolved" >> "$GITHUB_OUTPUT"
        echo "Resolved language: $resolved"

    - name: Install cargo-binstall
      if: steps.lang.outputs.language == 'rust'
      uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37 # v1.18.1

    - name: Install crap4rs
      if: steps.lang.outputs.language == 'rust'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # When `version: latest` and a `crap4rs` binary is already on PATH
        # (e.g., from `moonrepo/setup-rust` bins or a workspace-local build
        # prepended by a pre-step for end-to-end dogfooding), skip binstall
        # and use the pre-installed binary as-is. Pinned versions always
        # reinstall — callers asking for a specific version expect that
        # version to be honored even if a different one is on PATH.
        if [ "$VERSION" = "latest" ] && command -v crap4rs >/dev/null 2>&1; then
          echo "Pre-installed crap4rs detected ($(crap4rs --version)); skipping binstall."
        elif [ "$VERSION" = "latest" ]; then
          cargo binstall --no-confirm crap4rs
        else
          cargo binstall --no-confirm --force "crap4rs@$VERSION"
        fi
        crap4rs --version

    - name: Verify crap4ts (pre-installed-only)
      if: steps.lang.outputs.language == 'typescript'
      shell: bash
      run: |
        set -euo pipefail
        # crap4ts ships on npm via napi-rs and is not yet published to
        # crates.io at a working version (the `2.0.0-alpha.1` on crates.io
        # is a pre-walker stub; the working `2.0.0-rc.x` lives only on
        # npm until release-plz adoption lands the crates.io publish
        # path). The action therefore does NOT attempt `cargo binstall
        # crap4ts` — callers must pre-install the binary on PATH (e.g.
        # by cargo-building from a fork OR by shipping a binary artifact
        # to the runner). When binstall becomes safe, this step folds
        # back into the same shape as the crap4rs install above.
        if ! command -v crap4ts >/dev/null 2>&1; then
          echo "::error::crap4ts binary not found on PATH."
          echo "::error::The composite action requires crap4ts to be pre-installed on PATH."
          echo "::error::Until crap4ts publishes a working binary to crates.io, install it"
          echo "::error::yourself (e.g. cargo-install from a fork or download a release"
          echo "::error::artifact) and prepend its directory to PATH in a step that runs"
          echo "::error::before this action."
          exit 1
        fi
        echo "Pre-installed crap4ts detected ($(crap4ts --version))."

    - name: Run analysis + render scorecard
      id: run
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript'
      shell: bash
      env:
        LANGUAGE: ${{ steps.lang.outputs.language }}
        COVERAGE: ${{ inputs.coverage }}
        SRC: ${{ inputs.src }}
        BASELINE: ${{ inputs.baseline }}
        THRESHOLD: ${{ inputs.threshold }}
        CONFIG: ${{ inputs.config }}
        DELTA_GATE: ${{ inputs.delta-gate }}
        ANALYSIS_GATE: ${{ inputs.analysis-gate }}
      run: |
        set -euo pipefail
        # `BIN` is the adapter binary the language resolution step picked.
        # Both bins share the CLI surface (via crap-core's shared `cli::run`
        # orchestration), so a single shell body drives either dispatch.
        if [ "$LANGUAGE" = "rust" ]; then
          BIN=crap4rs
        else
          BIN=crap4ts
        fi
        envelope="$RUNNER_TEMP/${BIN}-envelope.json"
        markdown_file="$RUNNER_TEMP/${BIN}-scorecard.md"
        row_json_file="$RUNNER_TEMP/${BIN}-row.json"
        common=(--coverage "$COVERAGE" --src "$SRC" --threshold "$THRESHOLD")
        [ -n "$CONFIG" ] && common+=(--config "$CONFIG")
        if [ -n "$BASELINE" ]; then
          common+=(--baseline "$BASELINE")
        fi

        # Always capture truth into the envelope; --no-fail keeps the step
        # green so we can surface counts/passed status via outputs even when
        # gates would have tripped. The hard gating happens in the dedicated
        # gate step below, gated by the analysis-gate / delta-gate inputs.
        #
        # Three-pass note: we run the adapter three times — once each for
        # JSON, markdown, and scorecard-row — because the analyzer doesn't
        # yet support multi-format output in a single invocation. The cost
        # is two extra coverage parses + CRAP recomputes (cheap relative to
        # runner setup); the user-visible latency is dominated by adapter
        # install upstream. Tracked in
        # https://github.com/breezy-bays-labs/crap-rs/issues/100.
        "$BIN" "${common[@]}" --format json --no-fail > "$envelope"
        "$BIN" "${common[@]}" --format markdown --no-fail > "$markdown_file"

        if [ "$LANGUAGE" = "rust" ]; then
          # Graceful probe for crap4rs: --format scorecard-row landed in
          # crap4rs 0.4.0 (https://github.com/breezy-bays-labs/crap4rs/pull/119).
          # Older releases don't recognize the value and clap exits non-zero,
          # so we probe before invoking and degrade to an empty row-json with
          # a workflow warning when unsupported.
          #
          # Probe by version, not `--help` text. crap4rs 0.4.0 replaced
          # clap's `--format` ValueEnum with a custom FormatSpec parser so
          # `--format` could accept `<format>:<file>` syntax (#100), and
          # clap can't introspect a custom parser — `--help` no longer
          # enumerates format names. Grepping `--help` for `scorecard-row`
          # therefore false-negatives against the very versions that
          # support it. `sort -V` works on both GitHub-hosted Ubuntu and
          # macOS runners.
          installed_version_raw="$(crap4rs --version 2>/dev/null | awk '{print $2}')"
          installed_version="${installed_version_raw#v}"
          required_version="0.4.0"
          # Validate against a strict semver shape before `sort -V`. `sort -V`
          # treats non-numeric tokens (e.g. "unknown", "garbage") and `v`-prefixed
          # tags as sorting after pure semver strings, so without this gate they
          # would false-positive into the supported branch and skip the warning.
          supports_scorecard_row=false
          if [[ "$installed_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            && [ "$(printf '%s\n%s\n' "$required_version" "$installed_version" | sort -V | head -n1)" = "$required_version" ]; then
            supports_scorecard_row=true
          fi

          if [ "$supports_scorecard_row" = true ]; then
            crap4rs "${common[@]}" --format scorecard-row --no-fail > "$row_json_file"
          else
            echo "::warning::Installed crap4rs (${installed_version:-unknown}) is older than $required_version or reports a non-semver version; outputs.row-json will be empty. Pin the action's 'version' input to '$required_version' or later for structured Row::CrapDelta output."
            : > "$row_json_file"
          fi
        else
          # crap4ts: monorepo-shipped, structurally guarantees
          # `--format scorecard-row` support (both adapters route through
          # crap-core's shared `cli::format_as_scorecard_row` pipeline,
          # locked by `crates/crap-core/tests/scorecard_row_parity.rs`).
          # No probe needed — pre-installed-only means the caller is on a
          # current build.
          crap4ts "${common[@]}" --format scorecard-row --no-fail > "$row_json_file"
        fi

        # Parse the envelope. jq is preinstalled on GitHub-hosted runners.
        analysis_passed=$(jq -r '.result.passed' "$envelope")
        delta_passed=$(jq -r '.delta.summary.passed // ""' "$envelope")
        new_violations=$(jq -r '.delta.summary.new_violations // 0' "$envelope")
        regressions=$(jq -r '.delta.summary.regressions // 0' "$envelope")

        echo "analysis_passed=$analysis_passed" >> "$GITHUB_OUTPUT"
        echo "delta_passed=$delta_passed"       >> "$GITHUB_OUTPUT"
        echo "new_violations=$new_violations"   >> "$GITHUB_OUTPUT"
        echo "regressions=$regressions"         >> "$GITHUB_OUTPUT"
        echo "envelope_path=$envelope"          >> "$GITHUB_OUTPUT"

        # Multi-line output: file the markdown via the heredoc-delimited form.
        {
          echo "markdown<<__CRAP_SCORECARD_EOF__"
          cat "$markdown_file"
          echo "__CRAP_SCORECARD_EOF__"
        } >> "$GITHUB_OUTPUT"

        # Multi-line output: file the row-json via a distinct heredoc sentinel.
        # The file is the raw stdout of `<bin> --format scorecard-row` —
        # one Row::CrapDelta JSON object, no envelope wrapping. The
        # sentinel must not appear in the JSON; pretty-printed CrapDelta
        # never contains it. Both adapters emit the same Row JSON shape
        # (locked by crates/crap-core/tests/scorecard_row_parity.rs).
        {
          echo "row_json<<__CRAP_SCORECARD_ROW_EOF__"
          cat "$row_json_file"
          echo "__CRAP_SCORECARD_ROW_EOF__"
        } >> "$GITHUB_OUTPUT"

        # Surface a compact summary in the job log so failures are obvious
        # without scrolling.
        echo "::group::CRAP scorecard"
        cat "$markdown_file"
        echo "::endgroup::"

    - name: Post sticky PR comment
      if: (steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript') && inputs.comment-mode == 'sticky' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        header: ${{ inputs.comment-header }}
        message: ${{ steps.run.outputs.markdown }}

    - name: Enforce gates
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript'
      shell: bash
      env:
        ANALYSIS_GATE: ${{ inputs.analysis-gate }}
        DELTA_GATE: ${{ inputs.delta-gate }}
        ANALYSIS_PASSED: ${{ steps.run.outputs.analysis_passed }}
        DELTA_PASSED: ${{ steps.run.outputs.delta_passed }}
      run: |
        set -euo pipefail
        if [ "$ANALYSIS_GATE" = "true" ] && [ "$ANALYSIS_PASSED" != "true" ]; then
          echo "::error::analysis-gate failed: result.passed=$ANALYSIS_PASSED"
          exit 1
        fi
        # delta_passed is "" when no baseline supplied; only enforce when a
        # boolean came back.
        if [ "$DELTA_GATE" = "true" ] && [ "$DELTA_PASSED" = "false" ]; then
          echo "::error::delta-gate failed: new threshold violations landed"
          exit 1
        fi
        echo "Gates passed (analysis-gate=$ANALYSIS_GATE delta-gate=$DELTA_GATE)"
