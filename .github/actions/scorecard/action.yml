name: 'CRAP Scorecard'
description: 'Run CRAP analysis with optional baseline delta and emit a markdown scorecard composable into PR-comment bots.'
author: 'Breezy Bays Labs'
branding:
  icon: 'activity'
  color: 'orange'

inputs:
  threshold-preset:
    description: |
      One of `strict` | `default` | `lenient` — derives `threshold`
      internally per the locked metric-keyed calibration. `strict` = 8,
      `default` = 15, `lenient` = 25 (cognitive scale). When set
      alongside an explicit `threshold:`, the explicit input wins and
      the action emits a `::warning::` so the caller notices the
      double-config. Empty (default) leaves `threshold` untouched.
    required: false
    default: ''
  run-mode:
    description: |
      One of `full` | `delta` | `both` — drives baseline expectations.
      `full`: analysis-only (warns if `baseline:` is set).
      `delta`: requires `baseline:` set (errors if missing); skips the
      analysis-only render.
      `both`: requires `baseline:` set (errors if missing); runs both
      analyses. Empty (default) leaves baseline expectations untouched
      — the action behaves exactly as today (analysis-only when no
      baseline, both when baseline is supplied).
    required: false
    default: ''
  gate-mode:
    description: |
      One of `report-only` | `gate-on-analysis` | `gate-on-delta`
      | `gate-on-both`. Atomically sets `analysis-gate` + `delta-gate`
      together so the two cannot drift. Explicit `analysis-gate:` /
      `delta-gate:` inputs override; the action emits a `::warning::`
      on actual conflict (derived value differs from explicit value).
      Empty (default) leaves the raw inputs in charge.
    required: false
    default: ''
  languages:
    description: |
      Comma-separated language set. `rust`, `typescript`,
      `rust,typescript`, or `all` (convenience expansion equivalent
      to the current full set). Single-language preserves the
      existing dispatch (`auto` / `rust` / `typescript`) behavior and
      takes precedence over the `language:` input when both are set.

      Multi-value (`rust,typescript` or `all`) triggers
      **multi-language mode** (PR β #293): both adapters run in one
      action invocation, paired against `coverage`/`coverage-ts` +
      `src`/`src-ts` + `baseline`/`baseline-ts`. The action emits
      split per-language outputs (`row-json-rust` +
      `row-json-typescript`); `analysis-passed` / `delta-passed` are
      AND across languages; `new-violations` / `regressions` are SUM
      across languages; `markdown` is a single combined string with
      `### Rust (crap4rs)` + `### TypeScript (crap4ts)` section
      headers under one `## CRAP scorecard` wrapper. The legacy
      `row-json` output is empty in multi-language mode + the action
      emits a `::warning::` directing consumers to the split outputs.
      Whitespace is tolerated (`rust, typescript` works); duplicate
      tokens collapse with a `::warning::` (`rust,rust` → `rust`);
      unsupported tokens error with an actionable message.
    required: false
    default: ''
  language:
    description: |
      Language to analyze. `rust` runs crap4rs over an LCOV file.
      `typescript` runs crap4ts over an Istanbul JSON file (the crap4ts
      binary must be pre-installed on `PATH` — see the action README's
      "crap4ts install" note for the reason). `auto` (default) infers
      from the `coverage` file extension: `.info`/`.lcov` -> rust,
      `.json` (Istanbul) -> typescript.

      When `languages:` is set to a single value, it takes precedence
      over `language:` (the preset surface supersedes the raw surface
      for the language dimension; the additive shim discipline keeps
      `language:` working for callers who never adopted presets).
    required: false
    default: 'auto'
  coverage:
    description: |
      Path to the coverage file. LCOV (.info) for Rust, Istanbul JSON
      for TypeScript. In multi-language mode (`languages:
      rust,typescript` or `all`), this is the **Rust** LCOV path; the
      TypeScript Istanbul JSON path lives on `coverage-ts:` so both
      languages can be paired in one action invocation.
    required: true
  coverage-ts:
    description: |
      Path to the TypeScript Istanbul JSON coverage file. Used ONLY
      in multi-language mode (`languages: rust,typescript` or `all`)
      alongside `coverage:` (which then carries the Rust LCOV). The
      action.yml default is empty (not `'coverage-final.json'`) so
      the multi-language pairing validator can tell "caller omitted
      the TS coverage" apart from "caller explicitly passed a path",
      and error actionably when multi-language mode is requested
      without the paired input. Ignored in single-language mode.
    required: false
    default: ''
  src:
    description: |
      Source root directory passed to the analyzer. In multi-language
      mode, this is the **Rust** source root; the TypeScript source
      root lives on `src-ts:`. Accepts a newline-separated list for
      multi-root analysis.

      Empty default (crap-rs#346): when omitted, `--src` is NOT
      forwarded to the analyzer, so the analyzer's own precedence takes
      over — a `crap.toml` `src = [...]` array (auto-discovered in the
      working directory), else the analyzer's built-in `["src"]`
      default. This matches the conditional-forward contract of every
      other optional input (`coverage`/`baseline`/`src-ts`/`config` all
      default empty and forward only when set); previously `src` alone
      defaulted to `.` and the wrapper unconditionally forwarded
      `--src .`, redefining the analyzer's default and shadowing any
      config-declared source roots. A wrapper should not redefine the
      tool's default. Callers who relied on the old repo-root scan must
      now pass `src: .` explicitly (or, preferably, declare `src` in a
      `crap.toml`).
    required: false
    default: ''
  src-ts:
    description: |
      TypeScript source root, paired with `coverage-ts:`. Used ONLY
      in multi-language mode. Empty default mirrors `coverage-ts:`:
      multi-language mode requires this paired input alongside
      `src:` (Rust). Ignored in single-language mode.
    required: false
    default: ''
  baseline:
    description: |
      Path to a previously-captured CRAP JSON envelope to compare against.
      Leave empty to skip delta and emit an analysis-only scorecard. Producing
      the baseline (typically a coverage run on the PR base) is the caller's
      responsibility — this action does not auto-checkout, by design.

      In multi-language mode, this is the **Rust** baseline; the
      TypeScript baseline lives on `baseline-ts:` so each language
      can have its own previously-captured envelope.
    required: false
    default: ''
  baseline-ts:
    description: |
      Path to the TypeScript baseline JSON envelope. Used ONLY in
      multi-language mode, paired with `baseline:` (Rust). Either
      side may be empty independently — a multi-language run can
      have a Rust baseline + analysis-only TypeScript run, or
      vice-versa, or no baseline on either side. The action emits
      `delta-passed`/`new-violations`/`regressions` for the
      language(s) that supplied a baseline; languages without one
      contribute neutrally to the AND/SUM aggregation (passed=true,
      counts=0).
    required: false
    default: ''
  threshold:
    description: |
      CRAP threshold — functions above this are violations. The
      historical default is `15` (applied internally when both this
      input AND `threshold-preset` are empty). The action.yml default
      is intentionally empty (not `'15'`) so the preset-resolution
      step can tell "caller passed it explicitly" apart from "caller
      omitted it and the default filled in" — that distinction is
      what makes `threshold-preset: strict` alone able to apply the
      preset cleanly without false-conflict warnings. User-visible
      default remains `15`.
    required: false
    default: ''
  config:
    description: 'Optional path to a crap4rs.toml config file.'
    required: false
    default: ''
  delta-gate:
    description: |
      When `true` and a baseline is provided, the action exits non-zero if any
      new threshold violations land. The markdown scorecard is still emitted as
      an output. Independent of `analysis-gate`. The action.yml default is
      empty (not `'false'`) so the preset-resolution step can tell
      "caller passed it explicitly" apart from "caller omitted it" —
      that distinction is what makes `gate-mode: gate-on-delta` alone
      able to flip the gate cleanly. User-visible default remains `false`.
    required: false
    default: ''
  analysis-gate:
    description: |
      When `true`, the action exits non-zero if the analysis itself fails the
      threshold. The action.yml default is empty (not `'false'`) so the
      preset-resolution step can tell "caller passed it explicitly"
      apart from "caller omitted it" — that distinction is what makes
      `gate-mode: gate-on-analysis` alone able to flip the gate cleanly.
      User-visible default remains `false` — measurement-only by
      default; callers who want hard gates set this true (or use
      `gate-mode:`).
    required: false
    default: ''
  comment-mode:
    description: |
      `none` (default): outputs only — composable into PR-metrics
      aggregator workflows.
      `sticky`: post/update a sticky PR comment using
      marocchino/sticky-pull-request-comment. Requires `pull-requests: write`
      on the calling job.
    required: false
    default: 'none'
  comment-header:
    description: |
      Sticky-comment identifier when `comment-mode: sticky`. Multiple actions
      can post distinct sticky comments by varying this header.
    required: false
    default: 'crap-scorecard'
  comment-preamble:
    description: |
      Markdown prepended to the composed sticky-comment body, above the
      rendered scorecard. Use it to label a scorecard's scope so two
      scorecards on the same PR are unambiguous — e.g. a production
      scorecard naming the gated crates vs. an examples scorecard
      marked "teaching sample; not production code" (crap-rs#336).
      Honored in both single- and multi-language modes (it prepends to
      the `Compose sticky message` step's body, which runs for both).
      Empty default (`''`) produces a byte-identical comment to before
      this input existed.
    required: false
    default: ''
  version:
    description: |
      `crap4rs` version to install. `latest` (default) resolves to the most
      recent release. Pin to a tag (e.g. `0.2.1`) for reproducible CI.
    required: false
    default: 'latest'
  annotations:
    description: |
      When `true`, emit GitHub Actions `::warning` workflow commands for
      every function above the threshold so findings render inline on
      the PR "Files Changed" tab. Universal, free, no GHAS / Code
      Scanning dependency — the GH Actions runner intercepts the
      workflow commands directly from the analyzer's stdout. Default
      `false` keeps the action's stdout clean for callers who consume
      `outputs.markdown` only. Honors `annotation-limit` (or the
      project's `[output] annotation_limit` from `inputs.config`).
    required: false
    default: 'false'
  annotation-limit:
    description: |
      Cap on the number of `::warning` annotations emitted when
      `annotations: true`. Default (empty) defers to the adapter's
      built-in default (10) or the project's `[output] annotation_limit`
      in the config file passed via `inputs.config`. Range 1..=100;
      values outside the range are rejected by the adapter's CLI parser.
    required: false
    default: ''
  html-report:
    description: |
      When `true`, the action additionally renders the scorecard as
      HTML (uses `<bin> --format html`, available since the Askama
      reporter landed in `crap-core`), uploads as a workflow artifact
      via `actions/upload-artifact`, and — when `comment-mode: sticky`
      — appends a download link to the sticky comment body. Per-language
      in multi-language mode: two artifacts and two links.

      When a baseline is supplied, the HTML output includes a Delta tab
      (Current vs baseline view) — no extra input needed; the renderer
      activates the tab automatically.

      Default `false` (additive only — no behavior change for existing
      consumers; no new artifact and no sticky-link change when omitted).
      Empty string is treated as `false`.
    required: false
    default: 'false'
  html-artifact-name-suffix:
    description: |
      Optional suffix appended to the HTML artifact name(s) to
      disambiguate uploads in matrix-strategy workflows. The action
      defaults to `-<runner.os>` (Linux/macOS/Windows) so a matrix
      over OS gets `crap4rs-report-Linux` / `crap4rs-report-macOS`
      cleanly. Override to a custom suffix (e.g. a `matrix.platform`
      + `matrix.arch` combination) when the matrix exceeds the OS
      dimension. Without a unique suffix, `actions/upload-artifact@v4+`
      fails fatally on the second matrix leg attempting to upload to
      the same artifact name.

      Only consulted when `html-report: true`.
    required: false
    default: ''
  pages-publish:
    description: |
      When `true`, publish the rendered HTML report to a GitHub Pages
      branch and use the resulting hosted URL as the sticky-comment
      report link (replacing the workflow-artifact download link). The
      publish happens BEFORE the sticky comment is composed, so a push
      failure fails the job (red X) rather than posting a dead link.

      Requires `html-report: true` (there must be a rendered report to
      publish) — the action errors if `pages-publish: true` is set
      without it. Requires `pages-deploy-path` and `pages-url` to be
      set. The CALLER's job must grant `contents: write` (the publish
      is a plain `git push` to the Pages branch from within the caller's
      job, using the job's `GITHUB_TOKEN`).

      Set this `false` on fork PRs: a fork PR's `GITHUB_TOKEN` is
      read-only regardless of the job's `permissions:` block, so the
      push would 403. The caller is responsible for gating this input
      to same-repo events (e.g. `github.event.pull_request.head.repo.
      full_name == github.repository`); on a fork PR the action then
      falls back to the existing artifact-link / no-link behavior.

      Default `false` (additive only — no behavior change for existing
      consumers). Empty string is treated as `false`.
    required: false
    default: 'false'
  pages-deploy-path:
    description: |
      Path WITHIN the Pages branch to deploy the report to, e.g.
      `pr-123`. The rendered HTML is written to
      `<pages-deploy-path>/index.html`. Required (non-empty) when
      `pages-publish: true`. Existing Pages content outside this path
      (the root `index.html`, `.nojekyll`, `baselines/`, other PRs'
      directories) is preserved — the publish copies files in, it does
      not wipe the branch tree. Ignored when `pages-publish: false`.
    required: false
    default: ''
  pages-url:
    description: |
      The public URL the deployed report is reachable at, e.g.
      `https://acme.github.io/my-repo/pr-123/`. Used verbatim as the
      sticky-comment report link (`📊 [Open report](<pages-url>)`).
      Required (non-empty) when `pages-publish: true`. The action does
      NOT derive this from `pages-deploy-path` — the caller passes the
      full URL so the action stays agnostic to the consumer's Pages
      base URL (custom domains, project vs user Pages, subpaths all
      differ). Ignored when `pages-publish: false`.
    required: false
    default: ''
  pages-branch:
    description: |
      The Pages branch to publish to. Default `gh-pages` (the
      deploy-from-branch convention). Consulted only when
      `pages-publish: true`.
    required: false
    default: 'gh-pages'

outputs:
  markdown:
    description: 'The rendered markdown scorecard. Consume directly in aggregator bots.'
    value: ${{ steps.run.outputs.markdown }}
  sticky-message:
    description: |
      The composed sticky-comment body: the optional `comment-preamble`
      prepended above the rendered scorecard, plus the optional HTML
      download link (when `html-report: true`). This is the exact text
      the `Post sticky PR comment` step would publish. Distinct from
      `markdown` (which is the bare scorecard, preamble-free). Surfaced
      so callers can spot-check the preamble wiring and so aggregator
      bots that compose their own comment can reuse the assembled body
      (crap-rs#336).
    value: ${{ steps.compose.outputs.message }}
  row-json:
    description: |
      The `Row::CrapDelta` JSON object emitted by the dispatched
      adapter's `--format scorecard-row`. Conforms to the locked
      scorecard schema fragment at
      `crates/crap4rs/tests/fixtures/scorecard/schema.json` in this
      repo (the `CrapDelta` member of `definitions/Row` `oneOf`).
      Consume in aggregator workflows that re-render the scorecard
      with full layout control instead of parsing `outputs.markdown`.
      Producer-side status policy lives in crap-core's shared
      `format_as_scorecard_row` routing — see
      `docs/scorecard-row-contract.md`.

      Populated in **single-language mode** (back-compat for every
      consumer already reading this output). In **multi-language
      mode** (`languages: rust,typescript` or `all`), this output is
      the empty string and the action emits a `::warning::` directing
      consumers to the split outputs `row-json-rust` and
      `row-json-typescript`. The warning surfaces the migration path
      in the action's own log so a downstream `jq` parse doesn't
      silently fail on empty input.
    value: ${{ steps.run.outputs.row_json }}
  row-json-rust:
    description: |
      The `Row::CrapDelta` JSON object emitted by `crap4rs --format
      scorecard-row` when Rust is in the resolved language set.
      Populated in BOTH single-language mode (`languages: rust`) and
      multi-language mode (`languages: rust,typescript` or `all`);
      empty when Rust is not in the resolved set. Pair with
      `row-json-typescript` in multi-language aggregator workflows.
      Same schema as `row-json` (the legacy single-output above).
    value: ${{ steps.run.outputs.row_json_rust }}
  row-json-typescript:
    description: |
      The `Row::CrapDelta` JSON object emitted by `crap4ts --format
      scorecard-row` when TypeScript is in the resolved language set.
      Populated in BOTH single-language mode (`languages: typescript`)
      and multi-language mode (`languages: rust,typescript` or
      `all`); empty when TypeScript is not in the resolved set. Pair
      with `row-json-rust` in multi-language aggregator workflows.
      Same schema as `row-json` (the legacy single-output above).
    value: ${{ steps.run.outputs.row_json_typescript }}
  json-envelope-path:
    description: 'Path to the full JSON envelope on the runner — pass to downstream tooling.'
    value: ${{ steps.run.outputs.envelope_path }}
  analysis-passed:
    description: '`true` if the analysis itself passed the threshold.'
    value: ${{ steps.run.outputs.analysis_passed }}
  delta-passed:
    description: '`true` if a baseline was supplied and no new violations landed. Empty string when no baseline was supplied.'
    value: ${{ steps.run.outputs.delta_passed }}
  new-violations:
    description: 'Count of functions that exceed the threshold but did not in the baseline. `0` when no baseline.'
    value: ${{ steps.run.outputs.new_violations }}
  regressions:
    description: 'Count of modified functions whose CRAP score increased above the rendering precision threshold. `0` when no baseline.'
    value: ${{ steps.run.outputs.regressions }}
  threshold-resolved:
    description: |
      The threshold value the action's `Resolve presets` step resolved
      from its INPUTS (preset-derived or raw passthrough). Surfaces the
      single source-of-truth threshold so consumers can verify the
      preset-to-raw mapping (e.g. `threshold-preset: strict` resolved
      to 8 on the cognitive scale).

      NOTE (crap-rs#346): this reflects the action's resolved *input*, not
      necessarily the threshold the analyzer actually gated at. When the
      caller omits both `threshold` and `threshold-preset`, the action
      does NOT forward `--threshold` (so the analyzer's own `crap.toml`
      threshold/preset, else its built-in default, owns the gate), yet
      this output still reports the action's historical `15` fallback.
      Consumers that let config own the threshold should read the
      effective value from the analyzer envelope, not this output.
    value: ${{ steps.presets.outputs.threshold }}
  html-artifact-url:
    description: |
      Workflow artifact URL for the rendered HTML report when
      `html-report: true`. In single-language mode this is the
      per-language artifact URL (Rust or TypeScript depending on
      resolved language). In multi-language mode (PR ζ #315) this is
      the unified artifact URL — one HTML document carrying both
      adapters' analyses with a Language / Combined toggle.
      Empty string when `html-report: false`.
      The URL only resolves for requests authenticated with GitHub
      (per the GH API contract on artifact download URLs) — it is
      meant for sticky-comment links and aggregator surfacing, not
      for in-job `curl` retrieval.
    value: ${{ steps.upload-unified.outputs.artifact-url || steps.upload-rust.outputs.artifact-url || steps.upload-typescript.outputs.artifact-url }}
  html-artifact-url-rust:
    description: |
      Workflow artifact URL for the rendered Rust HTML report when
      `html-report: true`.

      **DEPRECATED in multi-language mode** (PR ζ #315): in
      multi-language mode this output now resolves to
      `<unified-url>#rust` — a deep-link anchor into the Rust panel
      of the unified HTML document — and the action emits a
      `::warning::` directing consumers to read
      `outputs.html-artifact-url` instead. The per-language output
      will be removed in a future major version.

      In single-language `language: rust` mode the behavior is
      unchanged from γ (#294): the URL points at the standalone
      Rust-only artifact, and no deprecation warning is emitted.

      See `html-artifact-url` for URL-authentication semantics.
    value: ${{ steps.upload-unified.outputs.artifact-url != '' && format('{0}#rust', steps.upload-unified.outputs.artifact-url) || steps.upload-rust.outputs.artifact-url }}
  html-artifact-url-typescript:
    description: |
      Workflow artifact URL for the rendered TypeScript HTML report
      when `html-report: true`.

      **DEPRECATED in multi-language mode** (PR ζ #315): in
      multi-language mode this output now resolves to
      `<unified-url>#typescript` — a deep-link anchor into the
      TypeScript panel of the unified HTML document. See
      `html-artifact-url-rust` for the deprecation contract.

      In single-language `language: typescript` mode the behavior is
      unchanged from γ (#294): the URL points at the standalone
      TypeScript-only artifact, and no deprecation warning is
      emitted.
    value: ${{ steps.upload-unified.outputs.artifact-url != '' && format('{0}#typescript', steps.upload-unified.outputs.artifact-url) || steps.upload-typescript.outputs.artifact-url }}
  unified-html-path:
    description: |
      Filesystem path on the runner to the rendered unified HTML
      report when `html-report: true` AND `languages` resolves to
      multi-language mode. Empty string otherwise.

      Surfaced so callers can grep-assert the rendered consumer-
      facing artifact in CI (Combined / per-language View nav, tab
      counts, etc.) without re-downloading the uploaded artifact via
      an authenticated `gh api artifacts` call. The path lives under
      the runner's `$RUNNER_TEMP` and is preserved for the rest of
      the job's steps.
    value: ${{ steps.render-unified.outputs.unified_path }}

runs:
  using: 'composite'
  steps:
    - name: Resolve presets
      id: presets
      shell: bash
      env:
        THRESHOLD_PRESET: ${{ inputs.threshold-preset }}
        THRESHOLD: ${{ inputs.threshold }}
        RUN_MODE: ${{ inputs.run-mode }}
        BASELINE: ${{ inputs.baseline }}
        GATE_MODE: ${{ inputs.gate-mode }}
        ANALYSIS_GATE: ${{ inputs.analysis-gate }}
        DELTA_GATE: ${{ inputs.delta-gate }}
        LANGUAGES: ${{ inputs.languages }}
        # Multi-language paired inputs — consumed only by the
        # paired-input validation block below (single-language flows
        # ignore these). Empty defaults preserve back-compat: the
        # validation skips when `is_multi=false`.
        COVERAGE_TS: ${{ inputs.coverage-ts }}
        SRC_TS: ${{ inputs.src-ts }}
        # Pages-publish inputs — validated below (the publish step
        # itself runs later, after the HTML render). Empty defaults
        # keep the validation inert for callers who never opt in.
        PAGES_PUBLISH: ${{ inputs.pages-publish }}
        PAGES_DEPLOY_PATH: ${{ inputs.pages-deploy-path }}
        PAGES_URL: ${{ inputs.pages-url }}
        HTML_REPORT: ${{ inputs.html-report }}
      run: |
        set -euo pipefail
        # ----------------------------------------------------------------
        # 1. threshold-preset → threshold (single source of truth)
        # ----------------------------------------------------------------
        # Single source of truth for the threshold value consumed by
        # `Run analysis`, `Emit inline annotations`, and the gate-mode
        # derivation downstream. Closes the 6-hardcoded-places drift
        # surface PR #282 (`d3438c7`) plugged in the workflow callers
        # by collapsing the action's own internal drift too.
        #
        # Empty-string semantics: the action.yml defaults for
        # `threshold`, `analysis-gate`, `delta-gate` are intentionally
        # empty (not their historical `15` / `false` / `false`). That
        # empty-vs-historical-default distinction is what lets the
        # resolver tell "caller explicitly passed it" apart from
        # "caller omitted it and the default filled in" — without
        # that, `threshold-preset: strict` alone would always trip
        # the "explicit raw conflicts with preset" warning against
        # the input-default `15` and revert to 15 (the verbatim plan
        # bash had this bug). User-visible defaults remain the
        # historical values: when both preset AND raw are empty, the
        # resolver substitutes the historical default below.
        derived_threshold=""
        case "$THRESHOLD_PRESET" in
          "")
            ;;
          strict)
            derived_threshold=8
            ;;
          default)
            derived_threshold=15
            ;;
          lenient)
            derived_threshold=25
            ;;
          *)
            echo "::error::unsupported threshold-preset '$THRESHOLD_PRESET'; expected one of: strict, default, lenient (or empty)"
            exit 1
            ;;
        esac

        if [ -n "$THRESHOLD_PRESET" ]; then
          if [ -n "$THRESHOLD" ] && [ "$THRESHOLD" != "$derived_threshold" ]; then
            # Explicit raw conflicts with preset-derived → raw wins,
            # warn. Additive shim discipline per ADR public-api-shim.
            echo "::warning::scorecard action: input 'threshold' ($THRESHOLD) conflicts with 'threshold-preset: $THRESHOLD_PRESET' (derives $derived_threshold). The explicit 'threshold' input wins; remove 'threshold-preset' or align the two values to silence this warning."
            resolved_threshold="$THRESHOLD"
          else
            # Either no explicit raw (apply preset) or explicit raw
            # equals derived (no conflict, no warning).
            resolved_threshold="$derived_threshold"
          fi
        elif [ -n "$THRESHOLD" ]; then
          resolved_threshold="$THRESHOLD"
        else
          # Historical default — preserved verbatim from the pre-PR
          # action.yml default. User-visible behavior unchanged for
          # callers who never set either input.
          resolved_threshold="15"
        fi
        echo "threshold=$resolved_threshold" >> "$GITHUB_OUTPUT"

        # Did the caller explicitly choose a threshold (raw or preset)?
        # `resolved_threshold` always carries a number (the historical
        # `15` fallback when both are empty), so it cannot distinguish
        # "caller chose 15" from "caller omitted it." This flag captures
        # that distinction from the RAW inputs. The analysis step forwards
        # `--threshold` to the analyzer ONLY when this is "true"; when the
        # caller omits both, `--threshold` is withheld so the analyzer's
        # own precedence (config `crap.toml` threshold/preset, else its
        # built-in default) owns the value — the same conditional-forward
        # contract `src`/`config`/`baseline` already follow, so a project
        # can dogfood its config's threshold instead of having the wrapper
        # silently redefine it to 15 (crap-rs#346). `resolved_threshold`
        # remains the single-source display/annotation value either way.
        if [ -n "$THRESHOLD_PRESET" ] || [ -n "$THRESHOLD" ]; then
          echo "threshold_explicit=true" >> "$GITHUB_OUTPUT"
        else
          echo "threshold_explicit=false" >> "$GITHUB_OUTPUT"
        fi

        # ----------------------------------------------------------------
        # 2. run-mode → baseline expectations
        # ----------------------------------------------------------------
        # run-mode is a descriptor for the caller's intent; the action
        # validates that `baseline:` is shaped consistently with that
        # intent. No outputs other than the validation result.
        case "$RUN_MODE" in
          "")
            ;;
          full)
            if [ -n "$BASELINE" ]; then
              echo "::warning::scorecard action: 'run-mode: full' implies analysis-only, but 'baseline:' is set ($BASELINE). The baseline will be honored (additive shim discipline); remove 'baseline:' to silence this warning or set 'run-mode: both'."
            fi
            ;;
          delta|both)
            if [ -z "$BASELINE" ]; then
              echo "::error::'run-mode: $RUN_MODE' requires 'baseline:' to be set"
              exit 1
            fi
            ;;
          *)
            echo "::error::unsupported run-mode '$RUN_MODE'; expected one of: full, delta, both (or empty)"
            exit 1
            ;;
        esac
        echo "run_mode=$RUN_MODE" >> "$GITHUB_OUTPUT"

        # ----------------------------------------------------------------
        # 3. gate-mode → atomic (analysis-gate, delta-gate)
        # ----------------------------------------------------------------
        # Same empty-vs-historical-default pattern as threshold above:
        # `analysis-gate` / `delta-gate` action.yml defaults are empty
        # so the resolver can tell explicit-`false` apart from
        # default-`false`. Without that distinction every non-
        # `report-only` gate-mode would warn against the input-default
        # `false` and revert to no-gate.
        derived_analysis_gate=""
        derived_delta_gate=""
        case "$GATE_MODE" in
          "")
            ;;
          report-only)
            derived_analysis_gate=false
            derived_delta_gate=false
            ;;
          gate-on-analysis)
            derived_analysis_gate=true
            derived_delta_gate=false
            ;;
          gate-on-delta)
            derived_analysis_gate=false
            derived_delta_gate=true
            ;;
          gate-on-both)
            derived_analysis_gate=true
            derived_delta_gate=true
            ;;
          *)
            echo "::error::unsupported gate-mode '$GATE_MODE'; expected one of: report-only, gate-on-analysis, gate-on-delta, gate-on-both (or empty)"
            exit 1
            ;;
        esac

        # Validate raw gate booleans up-front. GH Actions composite inputs
        # pass through as free-form strings, so values like `TRUE`, `yes`,
        # or typos would otherwise silently disable hard-gating downstream
        # (the `Enforce gates` step at the bottom compares against the
        # literal string `"true"`). Accept only `""|true|false`; error on
        # anything else with an actionable message. CodeRabbit #296 catch.
        case "$ANALYSIS_GATE" in
          ""|true|false) ;;
          *) echo "::error::unsupported analysis-gate '$ANALYSIS_GATE'; expected 'true' or 'false' (or empty to inherit gate-mode / historical default)"; exit 1 ;;
        esac
        case "$DELTA_GATE" in
          ""|true|false) ;;
          *) echo "::error::unsupported delta-gate '$DELTA_GATE'; expected 'true' or 'false' (or empty to inherit gate-mode / historical default)"; exit 1 ;;
        esac

        if [ -n "$GATE_MODE" ]; then
          if [ -n "$ANALYSIS_GATE" ] && [ "$ANALYSIS_GATE" != "$derived_analysis_gate" ]; then
            echo "::warning::scorecard action: input 'analysis-gate' ($ANALYSIS_GATE) conflicts with 'gate-mode: $GATE_MODE' (derives analysis-gate=$derived_analysis_gate). The explicit 'analysis-gate' input wins."
            resolved_analysis_gate="$ANALYSIS_GATE"
          else
            resolved_analysis_gate="$derived_analysis_gate"
          fi
          if [ -n "$DELTA_GATE" ] && [ "$DELTA_GATE" != "$derived_delta_gate" ]; then
            echo "::warning::scorecard action: input 'delta-gate' ($DELTA_GATE) conflicts with 'gate-mode: $GATE_MODE' (derives delta-gate=$derived_delta_gate). The explicit 'delta-gate' input wins."
            resolved_delta_gate="$DELTA_GATE"
          else
            resolved_delta_gate="$derived_delta_gate"
          fi
        else
          # No gate-mode set — historical default `false` for any
          # input that wasn't explicitly passed.
          resolved_analysis_gate="${ANALYSIS_GATE:-false}"
          resolved_delta_gate="${DELTA_GATE:-false}"
        fi
        echo "analysis_gate=$resolved_analysis_gate" >> "$GITHUB_OUTPUT"
        echo "delta_gate=$resolved_delta_gate" >> "$GITHUB_OUTPUT"

        # ----------------------------------------------------------------
        # 4. languages parsing
        # ----------------------------------------------------------------
        # `languages:` resolves to one of three shapes:
        #   * empty            → no preset language; raw `language:` rules
        #   * single value     → `single_language` set, supersedes
        #                        `inputs.language` (additive shim:
        #                        presets surface wins for the language
        #                        dimension)
        #   * multi-value set  → `language_set` (canonical-ordered CSV)
        #                        + `is_multi=true`; downstream `Run
        #                        analysis` loop dispatches BOTH adapters
        # `all` is the convenience expansion for the full multi-language
        # set (`rust,typescript` today; alphabetical-ordered as the set
        # grows beyond two languages).
        #
        # printf — not echo — when re-emitting `LANGUAGES` to avoid the
        # echo-builtin flag-injection trap (a value starting with `-e` /
        # `-n` / `-E` would otherwise be interpreted as a flag rather
        # than data). gemini-code-assist #296 catch.
        single_language=""
        language_set=""
        is_multi="false"
        if [ -n "$LANGUAGES" ]; then
          # Strip ALL whitespace then split on comma; `rust, typescript`
          # and `rust,typescript` resolve identically. The strip-then-
          # split is one pass per token via parameter expansion so the
          # loop body stays POSIX-portable across runner shells.
          normalized="$(printf '%s' "$LANGUAGES" | tr -d '[:space:]')"
          if [ "$normalized" = "all" ]; then
            # Convenience expansion. Canonical-ordered (rust,typescript)
            # so output ordering and downstream loop ordering are
            # deterministic regardless of how the caller spelled it.
            normalized="rust,typescript"
          fi
          # Split on comma into a Bash array. `IFS=','` is scoped to
          # the `read` invocation so the surrounding script's IFS is
          # not mutated.
          IFS=',' read -ra raw_langs <<<"$normalized"
          # Validate each token AND dedupe (preserving first-seen
          # order, so canonical `rust,typescript` stays in that order
          # if both come through `all` or an `all`-equivalent set).
          # Dedupe emits a `::warning::` so the caller sees the
          # collapse — silent dedupe would mask `rust,rust` typos.
          declare -a seen=()
          for tok in "${raw_langs[@]}"; do
            case "$tok" in
              rust|typescript) ;;
              "")
                echo "::error::languages: empty token in '$LANGUAGES' — check for leading/trailing/duplicate commas"
                exit 1
                ;;
              *)
                echo "::error::languages: unsupported token '$tok' in '$LANGUAGES'; expected one of: rust, typescript, all"
                exit 1
                ;;
            esac
            # Dedupe.
            already_seen="false"
            for s in "${seen[@]:-}"; do
              [ "$s" = "$tok" ] && already_seen="true" && break
            done
            if [ "$already_seen" = "true" ]; then
              echo "::warning::scorecard action: 'languages: $LANGUAGES' contains duplicate token '$tok'; deduplicating to a single entry."
            else
              seen+=("$tok")
            fi
          done

          # Reorder seen[] to the canonical (rust,typescript) order so
          # the downstream loop, the markdown section headers, and the
          # split-output ordering are deterministic across input
          # spellings (`typescript,rust` and `rust,typescript` produce
          # identical artifacts).
          canonical_set=""
          for canonical_lang in rust typescript; do
            for s in "${seen[@]:-}"; do
              if [ "$s" = "$canonical_lang" ]; then
                if [ -z "$canonical_set" ]; then
                  canonical_set="$canonical_lang"
                else
                  canonical_set="$canonical_set,$canonical_lang"
                fi
                break
              fi
            done
          done

          # Decide single vs multi based on the deduped set size, not
          # on the raw input shape — `rust,rust` collapses to single
          # `rust`, which is the only sane interpretation given the
          # warning above.
          case "$canonical_set" in
            rust|typescript)
              single_language="$canonical_set"
              language_set="$canonical_set"
              ;;
            rust,typescript)
              language_set="$canonical_set"
              is_multi="true"
              ;;
            *)
              # Defensive — the validation + dedupe + canonicalization
              # above should make this branch unreachable. Surface it
              # loudly if hit so any future parser regression fails
              # the action rather than silently falling through.
              echo "::error::languages: internal canonicalization produced unexpected set '$canonical_set' from input '$LANGUAGES'"
              exit 1
              ;;
          esac
        fi
        echo "single_language=$single_language" >> "$GITHUB_OUTPUT"
        echo "language_set=$language_set"       >> "$GITHUB_OUTPUT"
        echo "is_multi=$is_multi"               >> "$GITHUB_OUTPUT"

        # ----------------------------------------------------------------
        # 5. Multi-language paired-input validation
        # ----------------------------------------------------------------
        # When multi-language mode is active, the action runs BOTH
        # adapters in one invocation. Each adapter needs its own
        # coverage + src input; the paired-input convention puts the
        # Rust inputs on `coverage:` / `src:` / `baseline:` (the
        # historical single-language input set) and the TS inputs on
        # `coverage-ts:` / `src-ts:` / `baseline-ts:` (the new paired
        # inputs added in this PR). Missing-pair = actionable error
        # surfaced in the job log; baseline is optional on either
        # side (the per-language analysis runs without it). The
        # validation fires here (during Resolve presets, before any
        # adapter dispatch) so the error appears in the same step
        # that resolved the language set — easier for callers to
        # connect cause and effect than a downstream `Run analysis`
        # failure.
        if [ "$is_multi" = "true" ]; then
          missing=""
          if [ -z "${COVERAGE_TS:-}" ]; then
            missing="${missing}coverage-ts "
          fi
          if [ -z "${SRC_TS:-}" ]; then
            missing="${missing}src-ts "
          fi
          if [ -n "$missing" ]; then
            echo "::error::languages: '$LANGUAGES' resolves to a multi-language set; missing paired input(s): $missing. Multi-language mode requires 'coverage:' (Rust LCOV) AND 'coverage-ts:' (TS Istanbul JSON), plus 'src:' (Rust source root) AND 'src-ts:' (TS source root). 'baseline:' / 'baseline-ts:' are optional on either side. Set the missing input(s) or drop a language from 'languages:' for single-language dispatch."
            exit 1
          fi
        fi

        # ----------------------------------------------------------------
        # 6. Pages-publish validation
        # ----------------------------------------------------------------
        # Fail fast (here, before any adapter dispatch) on a Pages-publish
        # misconfiguration so the error names the cause in the same step
        # that resolved it, rather than surfacing later as a dead link or
        # an opaque `git push` failure.
        #
        # Accept only `""|true|false` for the boolean (free-form GHA
        # input strings — a typo like `TRUE`/`yes` would otherwise read
        # as "not true" and silently disable publishing, dropping the
        # hosted link without warning). Then, when publishing is ON:
        #   * require `html-report: true` — there must be a rendered
        #     report to publish; otherwise the compose step would emit a
        #     `pages-url` link pointing at a page that was never written
        #     (the exact dead-link hazard the publish-before-post
        #     ordering exists to prevent).
        #   * require `pages-deploy-path` AND `pages-url` — the publish
        #     step has no sane default for either; an empty deploy path
        #     would write to the Pages root (clobbering the production
        #     report), and an empty URL would compose a broken link.
        case "$PAGES_PUBLISH" in
          ""|true|false) ;;
          *) echo "::error::unsupported pages-publish '$PAGES_PUBLISH'; expected 'true' or 'false' (or empty for the default 'false')"; exit 1 ;;
        esac
        if [ "$PAGES_PUBLISH" = "true" ]; then
          if [ "$HTML_REPORT" != "true" ]; then
            echo "::error::pages-publish: true requires html-report: true (there must be a rendered HTML report to publish). Set html-report: true or pages-publish: false."
            exit 1
          fi
          pages_missing=""
          [ -z "$PAGES_DEPLOY_PATH" ] && pages_missing="${pages_missing}pages-deploy-path "
          [ -z "$PAGES_URL" ] && pages_missing="${pages_missing}pages-url "
          if [ -n "$pages_missing" ]; then
            echo "::error::pages-publish: true requires the following input(s): ${pages_missing}. pages-deploy-path is the path within the Pages branch (e.g. 'pr-123'); pages-url is the public URL the report is reachable at (used as the sticky link)."
            exit 1
          fi
        fi
        echo "pages_publish=$PAGES_PUBLISH" >> "$GITHUB_OUTPUT"

        # Surface a compact summary in the job log so the resolved
        # values are obvious to reviewers without scrolling.
        echo "Resolved presets: threshold=$resolved_threshold analysis-gate=$resolved_analysis_gate delta-gate=$resolved_delta_gate single-language=${single_language:-<unset>} language-set=${language_set:-<unset>} is-multi=$is_multi run-mode=${RUN_MODE:-<unset>} pages-publish=$PAGES_PUBLISH"

    - name: Resolve language
      id: lang
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        COVERAGE: ${{ inputs.coverage }}
        PRESET_LANGUAGE: ${{ steps.presets.outputs.single_language }}
        IS_MULTI: ${{ steps.presets.outputs.is_multi }}
      run: |
        set -euo pipefail
        # Multi-language short-circuit: when `languages:` resolved
        # to a multi-value set, the per-language Run analysis loop
        # downstream handles dispatch. This step emits a sentinel
        # `language=multi` so the downstream `if:` conditionals on
        # Run analysis / Emit inline annotations / Post sticky PR
        # comment / Enforce gates can match `rust || typescript ||
        # multi` and proceed. The single-language conditional
        # branches below are skipped — no auto-detect, no
        # `inputs.language` fallback, since the language set is
        # already canonical.
        if [ "$IS_MULTI" = "true" ]; then
          echo "language=multi" >> "$GITHUB_OUTPUT"
          echo "Resolved language: multi (per-language loop dispatches both adapters)"
          exit 0
        fi
        # `languages:` (preset surface) supersedes `language:` (raw
        # surface) when both resolve to a single value — the preset
        # input is the canonical language-dimension surface going
        # forward; `language:` stays additive-shim for callers who
        # never adopted presets.
        if [ -n "$PRESET_LANGUAGE" ]; then
          resolved="$PRESET_LANGUAGE"
        else
          resolved="$LANGUAGE"
        fi
        if [ "$resolved" = "auto" ]; then
          case "$COVERAGE" in
            *.info|*.lcov) resolved="rust" ;;
            *.json)        resolved="typescript" ;;
            *) echo "::error::cannot infer language from coverage path '$COVERAGE'; set inputs.language (or inputs.languages) explicitly"; exit 1 ;;
          esac
        fi
        # Whitelist the resolved value so an explicit unsupported
        # `inputs.language` fails fast instead of silently skipping
        # every conditional step and returning empty outputs.
        case "$resolved" in
          rust|typescript) ;;
          *)
            echo "::error::unsupported language '$resolved'; expected one of: rust, typescript, auto"
            exit 1
            ;;
        esac
        echo "language=$resolved" >> "$GITHUB_OUTPUT"
        echo "Resolved language: $resolved"

    - name: Install cargo-binstall
      # Needed for the crap4rs install (binstall path). Fires in both
      # single-language `rust` mode AND multi-language `multi` mode
      # since the latter dispatches BOTH adapters.
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'multi'
      uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37 # v1.18.1

    - name: Install crap4rs
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'multi'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # When `version: latest` and a `crap4rs` binary is already on PATH
        # (e.g., from `moonrepo/setup-rust` bins or a workspace-local build
        # prepended by a pre-step for end-to-end dogfooding), skip binstall
        # and use the pre-installed binary as-is. Pinned versions always
        # reinstall — callers asking for a specific version expect that
        # version to be honored even if a different one is on PATH.
        if [ "$VERSION" = "latest" ] && command -v crap4rs >/dev/null 2>&1; then
          echo "Pre-installed crap4rs detected ($(crap4rs --version)); skipping binstall."
        elif [ "$VERSION" = "latest" ]; then
          cargo binstall --no-confirm crap4rs
        else
          cargo binstall --no-confirm --force "crap4rs@$VERSION"
        fi
        crap4rs --version

    - name: Verify crap4ts (pre-installed-only)
      if: steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi'
      shell: bash
      run: |
        set -euo pipefail
        # crap4ts ships on npm via napi-rs and is not yet published to
        # crates.io at a working version (the `2.0.0-alpha.1` on crates.io
        # is a pre-walker stub; the working `2.0.0-rc.x` lives only on
        # npm until release-plz adoption lands the crates.io publish
        # path). The action therefore does NOT attempt `cargo binstall
        # crap4ts` — callers must pre-install the binary on PATH (e.g.
        # by cargo-building from a fork OR by shipping a binary artifact
        # to the runner). When binstall becomes safe, this step folds
        # back into the same shape as the crap4rs install above.
        if ! command -v crap4ts >/dev/null 2>&1; then
          echo "::error::crap4ts binary not found on PATH."
          echo "::error::The composite action requires crap4ts to be pre-installed on PATH."
          echo "::error::Until crap4ts publishes a working binary to crates.io, install it"
          echo "::error::yourself (e.g. cargo-install from a fork or download a release"
          echo "::error::artifact) and prepend its directory to PATH in a step that runs"
          echo "::error::before this action."
          exit 1
        fi
        echo "Pre-installed crap4ts detected ($(crap4ts --version))."

    - name: Run analysis + render scorecard
      id: run
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi'
      shell: bash
      env:
        LANGUAGE: ${{ steps.lang.outputs.language }}
        LANGUAGE_SET: ${{ steps.presets.outputs.language_set }}
        IS_MULTI: ${{ steps.presets.outputs.is_multi }}
        # Single-language inputs (back-compat — the historical input
        # set drove the pre-PR action). In multi-language mode, these
        # carry the Rust side of each pair; the TS side lives on the
        # `*_TS` env vars below.
        COVERAGE: ${{ inputs.coverage }}
        SRC: ${{ inputs.src }}
        BASELINE: ${{ inputs.baseline }}
        # Multi-language paired inputs. Empty in single-language mode
        # (the loop below ignores them); validated as non-empty in
        # `Resolve presets` when `is_multi=true`.
        COVERAGE_TS: ${{ inputs.coverage-ts }}
        SRC_TS: ${{ inputs.src-ts }}
        BASELINE_TS: ${{ inputs.baseline-ts }}
        # threshold/gate values come from `steps.presets.outputs.*`
        # (single source of truth for both raw and preset paths) so
        # the threshold-sync invariant holds across every step that
        # reads them: Run analysis, Emit inline annotations, Enforce
        # gates.
        THRESHOLD: ${{ steps.presets.outputs.threshold }}
        # "true" only when the caller explicitly set `threshold` or
        # `threshold-preset`. Gates the `--threshold` forward below so an
        # omitted threshold defers to the analyzer's config/default
        # precedence (crap-rs#346).
        THRESHOLD_EXPLICIT: ${{ steps.presets.outputs.threshold_explicit }}
        CONFIG: ${{ inputs.config }}
        DELTA_GATE: ${{ steps.presets.outputs.delta_gate }}
        ANALYSIS_GATE: ${{ steps.presets.outputs.analysis_gate }}
        # PR γ (#294): consulted by the per-language HTML render arm
        # inside the loop. Empty string is treated as `false` so the
        # action.yml default of `'false'` and a caller explicitly
        # passing `''` behave identically — same convention as the
        # other empty-default inputs (threshold / gate-mode / etc.).
        HTML_REPORT: ${{ inputs.html-report }}
      run: |
        set -euo pipefail
        # Per-language loop. Single-language mode iterates once over
        # the resolved single language; multi-language mode iterates
        # in canonical order (rust,typescript). Each iteration runs
        # the adapter's three formats (json + markdown + scorecard-row)
        # against the language-appropriate coverage/src/baseline triple
        # and accumulates per-language passed/delta/violations counts
        # for the post-loop aggregation. The aggregation policy
        # (AND for passed, SUM for counts) is documented in the
        # README's "Multi-language" section.

        # Resolve the iteration set from LANGUAGE_SET (multi-mode) or
        # the resolved single language (single-mode). In single-mode
        # LANGUAGE_SET is also populated by `Resolve presets` when
        # `languages:` was set; we fall back to the legacy
        # `Resolve language` output for callers using `language:`
        # without `languages:`.
        if [ -n "$LANGUAGE_SET" ]; then
          IFS=',' read -ra LANGS <<<"$LANGUAGE_SET"
        else
          LANGS=("$LANGUAGE")
        fi

        # Per-language accumulator arrays. `passed_all` / `delta_all`
        # walk to "false"/"" on the first failing leg (AND); count
        # totals walk by `+=` (SUM). `markdown_combined` collects each
        # iteration's adapter markdown; the post-loop assembly wraps
        # multi-language under a single `## CRAP scorecard` H2 with
        # per-language `### Rust (crap4rs)` / `### TypeScript
        # (crap4ts)` H3s. Single-language assembly emits the raw
        # adapter markdown unchanged (back-compat — same bytes as
        # pre-PR).
        analysis_passed_combined="true"
        delta_passed_combined=""        # empty when no language ran with a baseline
        delta_any_seen="false"
        new_violations_total=0
        regressions_total=0
        row_json_rust=""
        row_json_typescript=""
        envelope_path_first=""

        # Per-language markdown bodies live in temp files keyed by
        # adapter name so the post-loop assembly stays simple.
        for lang in "${LANGS[@]}"; do
          case "$lang" in
            rust)
              BIN="crap4rs"
              LANG_COVERAGE="$COVERAGE"
              LANG_SRC="$SRC"
              LANG_BASELINE="$BASELINE"
              ;;
            typescript)
              BIN="crap4ts"
              # In multi-language mode, TS triple comes from the
              # paired `*_TS` inputs. In single-language `typescript`
              # mode, the historical single-input set carries TS — so
              # fall back to those when `*_TS` are empty.
              if [ "$IS_MULTI" = "true" ]; then
                LANG_COVERAGE="$COVERAGE_TS"
                LANG_SRC="$SRC_TS"
                LANG_BASELINE="$BASELINE_TS"
              else
                LANG_COVERAGE="$COVERAGE"
                LANG_SRC="$SRC"
                LANG_BASELINE="$BASELINE"
              fi
              ;;
            *)
              echo "::error::Run analysis: internal iteration over unexpected language '$lang' (LANGS='${LANGS[*]}'); expected rust or typescript"
              exit 1
              ;;
          esac
          envelope="$RUNNER_TEMP/${BIN}-envelope.json"
          markdown_file="$RUNNER_TEMP/${BIN}-scorecard.md"
          row_json_file="$RUNNER_TEMP/${BIN}-row.json"
          # `--threshold` is conditionally forwarded (crap-rs#346): only
          # when the caller explicitly set `threshold`/`threshold-preset`.
          # When omitted, the flag is withheld so the analyzer's own
          # precedence (config `crap.toml` threshold/preset, else its
          # built-in default) owns the value — the same conditional-
          # forward contract `--src`/`--config`/`--baseline` follow.
          # `$THRESHOLD` (the resolved single-source value) is still used
          # for the annotation/display path; it just no longer overrides a
          # project's config threshold on every run.
          common=(--coverage "$LANG_COVERAGE")
          if [ "$THRESHOLD_EXPLICIT" = "true" ]; then
            common+=(--threshold "$THRESHOLD")
          fi
          # Multi-root (crap-rs#336): `src`/`src-ts` accept a
          # newline-separated list of roots (the GHA multiline-input
          # convention); split into one `--src <root>` per non-blank
          # line. A single-line value yields exactly one `--src` (byte-
          # identical to before this PR); blank lines are skipped so a
          # trailing newline never produces an empty `--src ""` (which
          # would silently re-scope the walker to CWD).
          while IFS= read -r src_root; do
            # Strip a trailing CR so a CRLF-checkout / Windows-runner
            # consumer doesn't emit `--src "crates/foo/src\r"`, which
            # fails the directory check (gemini PR #344).
            src_root="${src_root%$'\r'}"
            [ -n "$src_root" ] && common+=(--src "$src_root")
          done <<<"$LANG_SRC"
          [ -n "$CONFIG" ] && common+=(--config "$CONFIG")
          if [ -n "$LANG_BASELINE" ]; then
            common+=(--baseline "$LANG_BASELINE")
          fi

          # Always capture truth into the envelope; --no-fail keeps the step
          # green so we can surface counts/passed status via outputs even when
          # gates would have tripped. The hard gating happens in the dedicated
          # gate step below, gated by the analysis-gate / delta-gate inputs.
          #
          # Three-pass note: we run the adapter three times — once each for
          # JSON, markdown, and scorecard-row — because the analyzer doesn't
          # yet support multi-format output in a single invocation. The cost
          # is two extra coverage parses + CRAP recomputes per language
          # (cheap relative to runner setup); the user-visible latency is
          # dominated by adapter install upstream. Tracked in
          # https://github.com/breezy-bays-labs/crap-rs/issues/100.
          "$BIN" "${common[@]}" --format json --no-fail > "$envelope"
          "$BIN" "${common[@]}" --format markdown --no-fail > "$markdown_file"

          # PR γ (#294): optional HTML render. Same `${common[@]}`
          # invocation shape as the json + markdown calls above
          # (--coverage / --src / --threshold / optional --config /
          # optional --baseline), so the Askama HTML reporter's Delta
          # tab activates automatically when --baseline was supplied
          # by the caller — no explicit toggle here. `--no-fail` keeps
          # the step green; hard gating lives in the `Enforce gates`
          # step downstream and operates on the JSON envelope's
          # `result.passed` field. The path is captured in
          # $GITHUB_OUTPUT under `html_path_${lang}` so the per-language
          # `actions/upload-artifact` step after the loop can address
          # it without re-deriving the filename.
          if [ "$HTML_REPORT" = "true" ]; then
            html_file="$RUNNER_TEMP/${BIN}-report.html"
            "$BIN" "${common[@]}" --format html --no-fail > "$html_file"
            echo "html_path_${lang}=$html_file" >> "$GITHUB_OUTPUT"
          fi

          if [ "$lang" = "rust" ]; then
            # Graceful probe for crap4rs: --format scorecard-row landed in
            # crap4rs 0.4.0 (https://github.com/breezy-bays-labs/crap4rs/pull/119).
            # Older releases don't recognize the value and clap exits non-zero,
            # so we probe before invoking and degrade to an empty row-json with
            # a workflow warning when unsupported.
            #
            # Probe by version, not `--help` text. crap4rs 0.4.0 replaced
            # clap's `--format` ValueEnum with a custom FormatSpec parser so
            # `--format` could accept `<format>:<file>` syntax (#100), and
            # clap can't introspect a custom parser — `--help` no longer
            # enumerates format names. Grepping `--help` for `scorecard-row`
            # therefore false-negatives against the very versions that
            # support it. `sort -V` works on both GitHub-hosted Ubuntu and
            # macOS runners.
            installed_version_raw="$(crap4rs --version 2>/dev/null | awk '{print $2}')"
            installed_version="${installed_version_raw#v}"
            required_version="0.4.0"
            # Validate against a strict semver shape before `sort -V`. `sort -V`
            # treats non-numeric tokens (e.g. "unknown", "garbage") and `v`-prefixed
            # tags as sorting after pure semver strings, so without this gate they
            # would false-positive into the supported branch and skip the warning.
            supports_scorecard_row=false
            if [[ "$installed_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
              && [ "$(printf '%s\n%s\n' "$required_version" "$installed_version" | sort -V | head -n1)" = "$required_version" ]; then
              supports_scorecard_row=true
            fi

            if [ "$supports_scorecard_row" = true ]; then
              crap4rs "${common[@]}" --format scorecard-row --no-fail > "$row_json_file"
            else
              echo "::warning::Installed crap4rs (${installed_version:-unknown}) is older than $required_version or reports a non-semver version; outputs.row-json (and outputs.row-json-rust) will be empty. Pin the action's 'version' input to '$required_version' or later for structured Row::CrapDelta output."
              : > "$row_json_file"
            fi
          else
            # crap4ts: monorepo-shipped, structurally guarantees
            # `--format scorecard-row` support (both adapters route through
            # crap-core's shared `cli::format_as_scorecard_row` pipeline,
            # locked by `crates/crap-core/tests/scorecard_row_parity.rs`).
            # No probe needed — pre-installed-only means the caller is on a
            # current build.
            crap4ts "${common[@]}" --format scorecard-row --no-fail > "$row_json_file"
          fi

          # Parse the envelope. jq is preinstalled on GitHub-hosted runners.
          lang_analysis_passed=$(jq -r '.result.passed' "$envelope")
          lang_delta_passed=$(jq -r '.delta.summary.passed // ""' "$envelope")
          lang_new_violations=$(jq -r '.delta.summary.new_violations // 0' "$envelope")
          lang_regressions=$(jq -r '.delta.summary.regressions // 0' "$envelope")

          # AND-reduce passed flags. The `--no-fail` invariant means
          # exit code cannot be used (the bin always returns 0); jq
          # extraction of `.result.passed` IS the contract.
          if [ "$lang_analysis_passed" != "true" ]; then
            analysis_passed_combined="false"
          fi
          # `delta_passed_combined` stays empty when NO language ran
          # with a baseline (back-compat: single-language with no
          # baseline emits ""). When at least one language has a
          # baseline, the combined value is AND across the ones that
          # did. A baseline-less language contributes neutrally
          # (its `lang_delta_passed` is "" → skipped in the AND).
          if [ -n "$lang_delta_passed" ]; then
            delta_any_seen="true"
            if [ "$lang_delta_passed" != "true" ]; then
              delta_passed_combined="false"
            elif [ -z "$delta_passed_combined" ] || [ "$delta_passed_combined" = "true" ]; then
              delta_passed_combined="true"
            fi
          fi
          new_violations_total=$((new_violations_total + lang_new_violations))
          regressions_total=$((regressions_total + lang_regressions))

          # Track envelope path for the legacy `json-envelope-path`
          # output. Single-language: this is the only language's
          # envelope. Multi-language: this is the FIRST language's
          # envelope (rust, by canonical ordering) — downstream
          # tooling that wants the TS envelope reads
          # `$RUNNER_TEMP/crap4ts-envelope.json` directly (documented
          # in the README "Multi-language" section).
          if [ -z "$envelope_path_first" ]; then
            envelope_path_first="$envelope"
          fi

          # Capture per-language row JSON for the split outputs.
          # `row_json_file` is the raw stdout of `--format
          # scorecard-row`, the JSON object that conforms to the
          # locked Row::CrapDelta schema.
          if [ "$lang" = "rust" ]; then
            row_json_rust="$(cat "$row_json_file")"
          else
            row_json_typescript="$(cat "$row_json_file")"
          fi
        done

        # If the loop never executed a baseline-bearing language but
        # the historical contract emits "" for `delta-passed`, keep
        # it empty. The defensive elif above already covers the case
        # where every language had a baseline AND all passed.
        if [ "$delta_any_seen" = "false" ]; then
          delta_passed_combined=""
        fi

        echo "analysis_passed=$analysis_passed_combined" >> "$GITHUB_OUTPUT"
        echo "delta_passed=$delta_passed_combined"       >> "$GITHUB_OUTPUT"
        echo "new_violations=$new_violations_total"      >> "$GITHUB_OUTPUT"
        echo "regressions=$regressions_total"            >> "$GITHUB_OUTPUT"
        echo "envelope_path=$envelope_path_first"        >> "$GITHUB_OUTPUT"

        # Markdown assembly — single-language vs multi-language.
        if [ "$IS_MULTI" = "true" ]; then
          combined_md="$RUNNER_TEMP/scorecard-combined.md"
          : > "$combined_md"
          {
            echo "## CRAP scorecard"
            echo ""
            for lang in "${LANGS[@]}"; do
              case "$lang" in
                rust)       header="### Rust (crap4rs)"       ; BIN="crap4rs" ;;
                typescript) header="### TypeScript (crap4ts)" ; BIN="crap4ts" ;;
              esac
              echo "$header"
              echo ""
              # Demote the adapter's own header hierarchy by 3 levels
              # so the markdown stays consistent under the outer
              # `## CRAP scorecard` (H2) + `### Rust (crap4rs)` /
              # `### TypeScript (crap4ts)` (H3) wrappers:
              #   `# <bin> v<v> — CRAP Score Analysis`  (H1) → `####` (H4)
              #   `## Summary` / `## All functions` / `## CRAP Scorecard` (H2) → `#####` (H5)
              #   `### Regressions` / `### New violations` (H3) → `######` (H6)
              # The adapter's markdown body is otherwise concatenated
              # verbatim. `sed` runs on a copy; the original
              # `$RUNNER_TEMP/${BIN}-scorecard.md` stays unchanged
              # for any consumer reading it directly.
              sed -E 's/^### /###### /; s/^## /##### /; s/^# /#### /' "$RUNNER_TEMP/${BIN}-scorecard.md"
              echo ""
            done
          } > "$combined_md"

          # Defensive blank line before the EOF delimiter: `cat` doesn't
          # add a trailing newline to file content that lacks one, and
          # GH Actions requires the heredoc terminator to be on its own
          # line. Pre-PR-#260 the markdown reporter always emitted a
          # trailing `\n`; template-engine migrations can silently strip
          # it (askama's `{%-` whitespace operator did exactly this in
          # crap-rs#260), so the action defends against the regression
          # at the emission point instead of trusting every future
          # reporter to honor the contract. The blank line is invisible
          # to downstream markdown renderers.
          {
            echo "markdown<<__CRAP_SCORECARD_EOF__"
            cat "$combined_md"
            echo ""
            echo "__CRAP_SCORECARD_EOF__"
          } >> "$GITHUB_OUTPUT"
        else
          # Single-language: emit the raw adapter markdown unchanged
          # (back-compat — every byte matches the pre-PR shape). `BIN`
          # carries the loop's only iteration's bin name (`crap4rs` or
          # `crap4ts`), so the markdown file path is well-defined. See
          # the multi-language branch above for the `echo ""` rationale.
          {
            echo "markdown<<__CRAP_SCORECARD_EOF__"
            cat "$RUNNER_TEMP/${BIN}-scorecard.md"
            echo ""
            echo "__CRAP_SCORECARD_EOF__"
          } >> "$GITHUB_OUTPUT"
        fi

        # Legacy `row-json` output:
        # * single-language: populated with the active language's row
        #   (back-compat — every consumer reading `row-json` keeps
        #   working unchanged)
        # * multi-language: empty + `::warning::` directing consumers
        #   to the split outputs. Without the warning, a consumer
        #   flipping `languages:` to multi-value would see their
        #   downstream `jq` parse silently fail on empty input — the
        #   warning surfaces the migration path in the action's own
        #   log.
        if [ "$IS_MULTI" = "true" ]; then
          echo "::warning::scorecard action: outputs.row-json is EMPTY in multi-language mode (languages='${LANGUAGE_SET}'). Use outputs.row-json-rust and outputs.row-json-typescript instead. See the action README's 'Multi-language' section for the split-output contract."
          legacy_row_json=""
        else
          # Single-language: the active language's row populates the
          # legacy output. The split per-language output is ALSO
          # populated, so consumers can migrate at their own cadence.
          if [ "${LANGS[0]}" = "rust" ]; then
            legacy_row_json="$row_json_rust"
          else
            legacy_row_json="$row_json_typescript"
          fi
        fi

        # Emit each row output as a heredoc only when it carries
        # content. An empty heredoc-style block emits `KEY="\n"`
        # (the single trailing newline before the EOF marker), NOT
        # the empty string that the README + action docs promise —
        # downstream `[ -z "$row_json" ]` consumers would
        # incorrectly treat the absent row as present. The plain
        # `KEY=` form below guarantees a truly empty output value.
        # Per-language split outputs follow the same pattern: each
        # is the raw scorecard-row stdout for the corresponding
        # adapter (or genuinely empty when the language did not run
        # in this invocation). Both adapters emit the same Row JSON
        # shape (locked by
        # crates/crap-core/tests/scorecard_row_parity.rs ::
        # envelope_multi_language_parity).
        emit_row_output() {
          local key="$1" value="$2"
          if [ -z "$value" ]; then
            printf '%s=\n' "$key" >> "$GITHUB_OUTPUT"
          else
            {
              printf '%s<<__CRAP_SCORECARD_ROW_EOF__\n' "$key"
              printf '%s\n' "$value"
              printf '%s\n' "__CRAP_SCORECARD_ROW_EOF__"
            } >> "$GITHUB_OUTPUT"
          fi
        }
        emit_row_output "row_json" "$legacy_row_json"
        emit_row_output "row_json_rust" "$row_json_rust"
        emit_row_output "row_json_typescript" "$row_json_typescript"

        # Surface a compact summary in the job log so failures are
        # obvious without scrolling. Multi-language streams each
        # adapter's markdown in turn.
        echo "::group::CRAP scorecard"
        if [ "$IS_MULTI" = "true" ]; then
          cat "$combined_md"
        else
          cat "$RUNNER_TEMP/${BIN}-scorecard.md"
        fi
        echo "::endgroup::"

    - name: Emit inline annotations
      if: (steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi') && inputs.annotations == 'true'
      shell: bash
      env:
        LANGUAGE: ${{ steps.lang.outputs.language }}
        LANGUAGE_SET: ${{ steps.presets.outputs.language_set }}
        IS_MULTI: ${{ steps.presets.outputs.is_multi }}
        COVERAGE: ${{ inputs.coverage }}
        SRC: ${{ inputs.src }}
        COVERAGE_TS: ${{ inputs.coverage-ts }}
        SRC_TS: ${{ inputs.src-ts }}
        # Threshold-sync invariant: consume the derived single
        # source-of-truth so `threshold-preset: strict` produces
        # annotations at the same cutoff as the main analysis (a
        # partial wiring here would silently surface `default`-level
        # annotations under a `strict` preset).
        THRESHOLD: ${{ steps.presets.outputs.threshold }}
        # Mirror the Run-analysis conditional `--threshold` forward
        # (crap-rs#346) so annotations honor a config-driven threshold
        # too — keeps the cutoff coherent across analysis + annotations.
        THRESHOLD_EXPLICIT: ${{ steps.presets.outputs.threshold_explicit }}
        CONFIG: ${{ inputs.config }}
        ANNOTATION_LIMIT: ${{ inputs.annotation-limit }}
      run: |
        set -euo pipefail
        # Stdout MUST flow through to the runner — GitHub Actions reads
        # the `::warning ...` workflow commands directly from the step's
        # stdout. Any pipe / redirect would hide them from the runner
        # and the annotations would never render on the diff view.
        # `--no-fail` keeps the step green so a failing analysis still
        # surfaces findings inline; the dedicated "Enforce gates" step
        # below owns hard gating.
        #
        # Per-language loop: single-language iterates once over the
        # active language; multi-language iterates over both. The
        # entire loop runs inside ONE composite-action `run:` block,
        # which GitHub Actions treats as a single step — and the
        # `::warning` workflow command cap is enforced per step, not
        # per `run:` iteration. Without explicit per-language division,
        # the first adapter to emit could exhaust the 10-warning cap
        # and silently starve the second language's annotations.
        if [ -n "$LANGUAGE_SET" ]; then
          IFS=',' read -ra LANGS <<<"$LANGUAGE_SET"
        else
          LANGS=("$LANGUAGE")
        fi
        # Compute a per-language annotation budget only in
        # multi-language mode. Single-language preserves existing
        # precedence (explicit input → config file → adapter default of
        # 10) so a `crap4rs.toml`-declared `[output] annotation_limit`
        # is not silently overridden. Multi-language divides the
        # explicit cap (or GitHub's default 10) by the number of
        # languages, floored at 1 so each language still emits at
        # least one annotation when there are violations.
        per_lang_budget=""
        if [ "$IS_MULTI" = "true" ]; then
          n_langs="${#LANGS[@]}"
          total_budget="${ANNOTATION_LIMIT:-10}"
          per_lang_budget=$(( total_budget / n_langs ))
          if [ "$per_lang_budget" -lt 1 ]; then
            per_lang_budget=1
          fi
        fi
        for lang in "${LANGS[@]}"; do
          case "$lang" in
            rust)
              BIN="crap4rs"
              LANG_COVERAGE="$COVERAGE"
              LANG_SRC="$SRC"
              ;;
            typescript)
              BIN="crap4ts"
              if [ "$IS_MULTI" = "true" ]; then
                LANG_COVERAGE="$COVERAGE_TS"
                LANG_SRC="$SRC_TS"
              else
                LANG_COVERAGE="$COVERAGE"
                LANG_SRC="$SRC"
              fi
              ;;
            *)
              echo "::error::Emit inline annotations: internal iteration over unexpected language '$lang'; expected rust or typescript"
              exit 1
              ;;
          esac
          # Multi-root (crap-rs#336): same newline-split as the Run
          # analysis loop, so annotations cover every root rather than
          # silently only the first under multi-root. `--threshold` is
          # conditionally forwarded (crap-rs#346) for parity with the Run
          # analysis loop — omitted when the caller set no threshold so
          # the analyzer's config/default precedence owns the cutoff.
          args=(--coverage "$LANG_COVERAGE" --no-fail --format github-annotations)
          if [ "$THRESHOLD_EXPLICIT" = "true" ]; then
            args+=(--threshold "$THRESHOLD")
          fi
          while IFS= read -r src_root; do
            # Strip a trailing CR (CRLF-checkout / Windows-runner) so the
            # annotations loop doesn't emit `--src "…\r"` (gemini PR #344).
            src_root="${src_root%$'\r'}"
            [ -n "$src_root" ] && args+=(--src "$src_root")
          done <<<"$LANG_SRC"
          [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          if [ -n "$per_lang_budget" ]; then
            # Multi-language: the shared GH per-step cap is the hard
            # constraint, so the per-language division overrides both
            # the action input and any config-file value (otherwise
            # we'd silently drop annotations beyond the cap).
            args+=(--annotation-limit "$per_lang_budget")
          elif [ -n "$ANNOTATION_LIMIT" ]; then
            args+=(--annotation-limit "$ANNOTATION_LIMIT")
          fi
          "$BIN" "${args[@]}"
        done

    # PR γ (#294): per-language HTML artifact upload. Each step runs
    # only when `html-report: true` AND the corresponding language is
    # in the resolved set (single-language `rust|typescript` OR multi-
    # language `multi`). The `id:` is referenced by both the top-level
    # `html-artifact-url-{rust,typescript}` outputs AND the `Compose
    # sticky message` step below — keep the IDs stable.
    #
    # `name:` carries a suffix to disambiguate matrix-strategy uploads.
    # actions/upload-artifact@v4+ fails fatally on second-leg uploads
    # under the same artifact name; the default `-<runner.os>` covers
    # the common OS-matrix case (`crap4rs-report-Linux` /
    # `crap4rs-report-macOS` cleanly distinguishable). Callers with
    # matrix dimensions beyond OS override via `html-artifact-name-suffix`.
    #
    # `retention-days` defaults to 90 (the workflow / repository default
    # for upload-artifact@v4+). The action does not expose an input for
    # the retention window in this PR — `90` matches GitHub's default
    # quota allowance and covers the typical "review the PR within a
    # quarter" use case. A follow-up additive `retention-days` input
    # can land if real consumer friction surfaces post-ship.
    #
    # SHA pin matches the in-repo convention from `.github/workflows/
    # ci.yml:194` and `.github/workflows/release-plz.yml:243,402`
    # (`043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1`). Consistency
    # over chasing dependabot's latest — a future bump rebases all
    # three pins in one weekly group.
    # PR γ (#294): per-language HTML artifact upload. Each step runs
    # ONLY when `html-report: true` AND the resolved language matches
    # AND the run is single-language (not multi).
    #
    # PR ζ (#315): the per-language uploads now gate `language ==
    # 'rust'` / `language == 'typescript'` instead of also matching
    # 'multi'. In multi-language mode, the per-language artifacts are
    # superseded by the unified-render artifact uploaded by the
    # `Upload unified HTML report` step below; emitting both would
    # double the artifact count and contradict the "ONE artifact in
    # multi-language mode" invariant the deprecation contract relies
    # on. The `*-rust` / `*-typescript` outputs continue to populate
    # in multi-language mode as deep-link redirects to the unified
    # artifact — see the outputs block above for the redirect logic.
    - name: Upload Rust HTML report
      id: upload-rust
      if: inputs.html-report == 'true' && steps.lang.outputs.language == 'rust'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: crap4rs-report${{ inputs.html-artifact-name-suffix == '' && format('-{0}', runner.os) || inputs.html-artifact-name-suffix }}
        path: ${{ steps.run.outputs.html_path_rust }}
        if-no-files-found: error

    - name: Upload TypeScript HTML report
      id: upload-typescript
      if: inputs.html-report == 'true' && steps.lang.outputs.language == 'typescript'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: crap4ts-report${{ inputs.html-artifact-name-suffix == '' && format('-{0}', runner.os) || inputs.html-artifact-name-suffix }}
        path: ${{ steps.run.outputs.html_path_typescript }}
        if-no-files-found: error

    # PR ζ (#315): multi-language unified HTML pipeline.
    #
    # Three additive steps gated on `html-report: true` AND
    # `is_multi == 'true'` (single-language mode skips all three,
    # preserving byte-identical γ behavior for callers who never set
    # `languages: rust,typescript`).
    #
    # The install step mirrors the pre-installed-detection pattern
    # used for the adapter binaries above: if a `crap-render` is
    # already on PATH (workspace-local build staged by a pre-step,
    # for end-to-end dogfooding), skip the binstall and reuse it.
    # Otherwise resolve through `cargo binstall` against crap-core's
    # `[package.metadata.binstall]` block, which downloads the
    # pre-built tarball from the latest `crap-core-vX.Y.Z` release
    # uploaded by release-plz.yml's `build-crap-core-binaries` job.
    #
    # Until crap-core ships a release carrying crap-render (which
    # `release-plz` will trigger on the first crap-core 0.7.0+ merge),
    # binstall has nothing to resolve and the step fails — that's why
    # this PR's own CI smokes stage the workspace-built `crap-render`
    # onto PATH so the pre-installed branch fires.
    - name: Install crap-render
      if: inputs.html-report == 'true' && steps.presets.outputs.is_multi == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v crap-render >/dev/null 2>&1; then
          echo "Pre-installed crap-render detected ($(crap-render --version 2>/dev/null || echo 'version unknown')); skipping binstall."
        else
          cargo binstall --no-confirm crap-render || cargo install crap-render
        fi
        crap-render --help >/dev/null 2>&1 || true

    - name: Render unified HTML
      id: render-unified
      if: inputs.html-report == 'true' && steps.presets.outputs.is_multi == 'true'
      shell: bash
      env:
        # The per-language envelopes were already produced by the
        # `Run analysis` loop above (saved to
        # `$RUNNER_TEMP/${BIN}-envelope.json`). The unified renderer
        # composes both into one HTML document with a Language /
        # Combined toggle plus a Current/Delta View axis inside each
        # panel when a baseline is supplied.
        RUST_ENV: ${{ runner.temp }}/crap4rs-envelope.json
        TS_ENV: ${{ runner.temp }}/crap4ts-envelope.json
        # Baseline envelopes — already validated as paths to the
        # per-language baseline JSONs by the caller's input. Either
        # may be empty (analysis-only on that side); the render step
        # gates each `--baseline` argument independently so a
        # mismatched-baseline run still produces a unified report
        # (with the missing side's Delta tab disabled).
        RUST_BASELINE: ${{ inputs.baseline }}
        TS_BASELINE: ${{ inputs.baseline-ts }}
        UNIFIED: ${{ runner.temp }}/crap-scorecard-unified.html
      run: |
        set -euo pipefail
        args=(
          --input "rust=${RUST_ENV}"
          --input "typescript=${TS_ENV}"
        )
        if [[ -n "${RUST_BASELINE}" ]]; then
          args+=(--baseline "rust=${RUST_BASELINE}")
        fi
        if [[ -n "${TS_BASELINE}" ]]; then
          args+=(--baseline "typescript=${TS_BASELINE}")
        fi
        crap-render "${args[@]}" --format html --output "${UNIFIED}"
        echo "unified_path=${UNIFIED}" >> "$GITHUB_OUTPUT"

    - name: Upload unified HTML report
      id: upload-unified
      if: inputs.html-report == 'true' && steps.presets.outputs.is_multi == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: crap-scorecard-report${{ inputs.html-artifact-name-suffix == '' && format('-{0}', runner.os) || inputs.html-artifact-name-suffix }}
        path: ${{ steps.render-unified.outputs.unified_path }}
        if-no-files-found: error

    # Hosted per-PR report (crap-rs#377 epic, Wave 1): publish the
    # rendered HTML to a GitHub Pages branch so the sticky comment can
    # link a live hosted report instead of a download-a-zip artifact.
    #
    # Runs ONLY when `pages-publish: true` (validated in `Resolve
    # presets` to also require html-report:true + a deploy path + a
    # URL). Placed AFTER the HTML render (the file it copies was written
    # by `Run analysis` / `Render unified HTML`) and BEFORE `Compose
    # sticky message` (so the link the compose step emits is only ever
    # produced when the publish already succeeded — "publish before
    # post"). The PR's own report file is resolved here: the unified
    # render in multi-language mode, else the single-language per-adapter
    # render.
    #
    # `set -euo pipefail` makes a `git push` failure FAIL the job
    # (non-zero exit) — the whole point of ordering this before the
    # sticky step is that a failed publish reds the run rather than
    # posting a dead link. On a fork PR the caller passes
    # `pages-publish: false` (a fork token can't push), so this step is
    # skipped entirely and the action falls back to the artifact/no-link
    # path.
    #
    # Token: `github.token` (NOT `secrets.GITHUB_TOKEN`, which is
    # unavailable in composite-action context). `github.token` carries
    # the CALLER job's permissions, so the caller's `contents: write`
    # grant is what authorizes the push. It is referenced only via the
    # step `env:` block, never interpolated into the `run:` script
    # (template-injection hygiene). `$GITHUB_REPOSITORY` is shell-quoted.
    - name: Publish HTML to GitHub Pages
      id: pages
      if: steps.presets.outputs.pages_publish == 'true' && inputs.html-report == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PAGES_BRANCH: ${{ inputs.pages-branch }}
        PAGES_DEPLOY_PATH: ${{ inputs.pages-deploy-path }}
        IS_MULTI: ${{ steps.presets.outputs.is_multi }}
        LANGUAGE: ${{ steps.lang.outputs.language }}
        # Candidate report paths written by the render steps above. In
        # multi-language mode the unified render is canonical; in single-
        # language mode the per-adapter render path applies.
        UNIFIED_PATH: ${{ steps.render-unified.outputs.unified_path }}
        HTML_PATH_RUST: ${{ steps.run.outputs.html_path_rust }}
        HTML_PATH_TYPESCRIPT: ${{ steps.run.outputs.html_path_typescript }}
      run: |
        set -euo pipefail
        # Resolve the single report file to publish — unified (multi)
        # else the per-language render (single). One canonical "report
        # to publish" var keeps the empty-file guard and copy below
        # path-agnostic.
        if [ "$IS_MULTI" = "true" ]; then
          REPORT_HTML="$UNIFIED_PATH"
        elif [ "$LANGUAGE" = "rust" ]; then
          REPORT_HTML="$HTML_PATH_RUST"
        else
          REPORT_HTML="$HTML_PATH_TYPESCRIPT"
        fi
        # Empty-file guard (AGENTS.md release-envelope rule): a silent
        # render failure surfaces here as a named error, not as a
        # published empty page behind a live link.
        if [ -z "$REPORT_HTML" ] || [ ! -s "$REPORT_HTML" ]; then
          echo "::error::pages-publish: the rendered HTML report ('${REPORT_HTML:-<unset>}') is missing or empty; refusing to publish a dead/empty page."
          exit 1
        fi
        # Shallow tokened clone of the Pages branch. A SEPARATE clone
        # (not the workflow checkout) keeps the push self-contained and
        # works even though the caller's checkout sets
        # persist-credentials: false. The token is in the URL via the
        # env var, never echoed.
        git clone --branch "$PAGES_BRANCH" --single-branch --depth 1 \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          gh-pages-pr-pub
        # Copy the report to <deploy-path>/index.html. mkdir -p creates
        # the per-PR directory; existing Pages content outside it
        # (root index.html, .nojekyll, baselines/, other PR dirs) is
        # preserved because we copy in rather than wiping the tree.
        mkdir -p "gh-pages-pr-pub/${PAGES_DEPLOY_PATH}"
        cp "$REPORT_HTML" "gh-pages-pr-pub/${PAGES_DEPLOY_PATH}/index.html"
        cd gh-pages-pr-pub
        # No-op guard: skip an empty commit when the report is unchanged
        # (a re-run on the same SHA). In practice the envelope-embedded
        # render reflects code/coverage that usually differs, so this is
        # a safety net, not a deduplicator.
        if [ -z "$(git status --porcelain)" ]; then
          echo "gh-pages already up to date for ${PAGES_DEPLOY_PATH} — nothing to publish"
          exit 0
        fi
        git add "${PAGES_DEPLOY_PATH}/index.html"
        git \
          -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -m "ci(pages): publish per-PR CRAP report to ${PAGES_DEPLOY_PATH}"
        git push origin "HEAD:${PAGES_BRANCH}"

    # PR γ (#294) + ζ (#315): compose the sticky-comment body by
    # appending the HTML-artifact download link(s) to the rendered
    # markdown when `html-report: true`. Runs unconditionally (no
    # `if:`) so the downstream sticky step always reads
    # `steps.compose.outputs.message` — the appended-link branch is
    # gated by `$HTML_REPORT == "true"` inside the bash so the
    # no-`html-report` path passes the markdown through byte-
    # identically (existing-consumer back-compat).
    #
    # Step always runs the same way regardless of `comment-mode:` to
    # keep the output side-effect-free for aggregator consumers
    # (`comment-mode: 'none'` consumers ignore the composed message
    # entirely — they read `outputs.markdown` and the action-level
    # `html-artifact-url-*` outputs directly).
    #
    # Sticky-link shape:
    #   * single-language: `📊 [Download full HTML report](<url>)`
    #   * multi-language:  `📊 [Open report](<unified>) ·
    #                       [Rust panel](<unified>#rust) ·
    #                       [TypeScript panel](<unified>#typescript)`
    #
    # The multi-language shape ships one canonical link to the unified
    # HTML document plus two deep-link anchors so reviewers can land
    # directly on a per-language panel. Replaces γ's two separate
    # per-language URLs (which produced two confusing "Download" links
    # in the PR comment).
    #
    # Heredoc trailing-newline lesson (#260): both the markdown body
    # AND the appended link block emit an explicit `echo ""` before
    # the EOF delimiter so the heredoc terminator lands on its own
    # line. Same defensive pattern the `Run analysis` step uses for
    # the markdown emission upstream.
    - name: Compose sticky message
      id: compose
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi'
      shell: bash
      env:
        # Markdown body is read FROM the temp files Run analysis already
        # wrote (rather than re-piped through an env var) so we don't
        # tip the 64 KB env-var limit on large projects — gemini catch
        # on PR #312. Filenames: `${BIN}-scorecard.md` for single-lang,
        # `scorecard-combined.md` for multi-lang (see L898 + L1050).
        HTML_REPORT: ${{ inputs.html-report }}
        IS_MULTI: ${{ steps.presets.outputs.is_multi }}
        LANGUAGE: ${{ steps.lang.outputs.language }}
        # Caller-supplied markdown prepended above the scorecard body
        # (crap-rs#336). Empty → byte-identical to before this input.
        COMMENT_PREAMBLE: ${{ inputs.comment-preamble }}
        HTML_URL_RUST: ${{ steps.upload-rust.outputs.artifact-url }}
        HTML_URL_TS: ${{ steps.upload-typescript.outputs.artifact-url }}
        # PR ζ (#315): unified artifact URL produced by the
        # `Upload unified HTML report` step. Populates in
        # multi-language mode only; empty in single-language mode
        # (per the step's `if:` gate).
        HTML_URL_UNIFIED: ${{ steps.upload-unified.outputs.artifact-url }}
        # Hosted per-PR report (crap-rs#377, Wave 1): when the publish
        # step ran (pages-publish:true), the sticky link is the hosted
        # Pages URL instead of the artifact-download URL. The publish
        # step runs BEFORE this one and fails the job on a push error,
        # so reaching this step with PAGES_PUBLISH=true means the page
        # is live — "publish succeeded" is implicit in control flow.
        PAGES_PUBLISH: ${{ steps.presets.outputs.pages_publish }}
        PAGES_URL: ${{ inputs.pages-url }}
      run: |
        set -euo pipefail
        composed_file="$RUNNER_TEMP/scorecard-sticky-message.md"
        # Prepend the caller's preamble (crap-rs#336) above the body when
        # non-empty, followed by a blank line so the markdown body starts
        # a fresh block regardless of how the preamble ended. Empty
        # preamble writes nothing → the body is byte-identical to before
        # this input existed.
        : > "$composed_file"
        if [ -n "$COMMENT_PREAMBLE" ]; then
          printf '%s\n\n' "$COMMENT_PREAMBLE" >> "$composed_file"
        fi
        if [ "$LANGUAGE" = "multi" ]; then
          cat "$RUNNER_TEMP/scorecard-combined.md" >> "$composed_file"
        elif [ "$LANGUAGE" = "rust" ]; then
          cat "$RUNNER_TEMP/crap4rs-scorecard.md" >> "$composed_file"
        else
          cat "$RUNNER_TEMP/crap4ts-scorecard.md" >> "$composed_file"
        fi

        if [ "$HTML_REPORT" = "true" ]; then
          # Guard the link append on actual upload success — when an
          # upload-artifact step is skipped (its `if:` evaluated
          # false) or failed, its `artifact-url` output is empty, and
          # the action-level outputs are documented as empty in that
          # case. Append the link only when a URL is present.
          #
          # URLs wrapped in `<...>` per the GFM convention — keeps the
          # link renderable even if a future artifact-URL shape includes
          # parentheses or spaces (gemini catch on PR #312).
          link_block=""
          if [ "$PAGES_PUBLISH" = "true" ]; then
            # Hosted per-PR report (crap-rs#377, Wave 1): the link is the
            # live Pages URL, not a download-a-zip artifact. The publish
            # step already ran and would have failed the job on error, so
            # the page is live; PAGES_URL was validated non-empty in
            # `Resolve presets`. This branch is reached ONLY when the
            # caller opted in, so the artifact-link branches below stay
            # byte-identical for every existing consumer.
            link_block="📊 [Open report](<$PAGES_URL>)"
          elif [ "$IS_MULTI" = "true" ]; then
            # PR ζ (#315): in multi-language mode the unified artifact
            # is the canonical destination. Two deep-link anchors
            # (#rust / #typescript) let reviewers jump straight to a
            # language panel.
            if [ -n "$HTML_URL_UNIFIED" ]; then
              link_block="📊 [Open report](<$HTML_URL_UNIFIED>) · [Rust panel](<${HTML_URL_UNIFIED}#rust>) · [TypeScript panel](<${HTML_URL_UNIFIED}#typescript>)"
            fi
          elif [ "$LANGUAGE" = "rust" ] && [ -n "$HTML_URL_RUST" ]; then
            link_block="📊 [Download full HTML report](<$HTML_URL_RUST>)"
          elif [ "$LANGUAGE" = "typescript" ] && [ -n "$HTML_URL_TS" ]; then
            link_block="📊 [Download full HTML report](<$HTML_URL_TS>)"
          fi
          if [ -n "$link_block" ]; then
            # Two trailing newlines BEFORE the link block guarantee a
            # blank line separates the markdown body from the link
            # regardless of whether the markdown body itself ended in
            # `\n`. Markdown renderers collapse multiple blank lines
            # into one — the extra is invisible.
            printf '\n\n%s\n' "$link_block" >> "$composed_file"
          fi
        fi

        # PR ζ (#315): emit `::warning::` deprecation notice for
        # callers reading `outputs.html-artifact-url-{rust,typescript}`
        # in multi-language mode. The per-language outputs now resolve
        # to `<unified>#<lang>` deep-link anchors; future major version
        # will remove them entirely.
        if [ "$IS_MULTI" = "true" ] && [ "$HTML_REPORT" = "true" ]; then
          echo "::warning::scorecard action: outputs.html-artifact-url-rust and outputs.html-artifact-url-typescript are deprecated in multi-language mode and now resolve to deep-link anchors on outputs.html-artifact-url. Update aggregator workflows to read outputs.html-artifact-url instead."
        fi

        # Emit the composed body as a heredoc-style output. Explicit
        # `echo ""` before the EOF terminator defends against the
        # template-engine trailing-newline-strip regression (#260).
        {
          echo "message<<__CRAP_SCORECARD_STICKY_EOF__"
          cat "$composed_file"
          echo ""
          echo "__CRAP_SCORECARD_STICKY_EOF__"
        } >> "$GITHUB_OUTPUT"

    - name: Post sticky PR comment
      if: (steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi') && inputs.comment-mode == 'sticky' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        header: ${{ inputs.comment-header }}
        message: ${{ steps.compose.outputs.message }}

    - name: Enforce gates
      if: steps.lang.outputs.language == 'rust' || steps.lang.outputs.language == 'typescript' || steps.lang.outputs.language == 'multi'
      shell: bash
      env:
        # Gate values come from the preset-resolution step (single
        # source of truth) so `gate-mode: gate-on-both` actually
        # enforces both gates without the raw `analysis-gate` /
        # `delta-gate` defaults silently overriding.
        ANALYSIS_GATE: ${{ steps.presets.outputs.analysis_gate }}
        DELTA_GATE: ${{ steps.presets.outputs.delta_gate }}
        ANALYSIS_PASSED: ${{ steps.run.outputs.analysis_passed }}
        DELTA_PASSED: ${{ steps.run.outputs.delta_passed }}
      run: |
        set -euo pipefail
        if [ "$ANALYSIS_GATE" = "true" ] && [ "$ANALYSIS_PASSED" != "true" ]; then
          echo "::error::analysis-gate failed: result.passed=$ANALYSIS_PASSED"
          exit 1
        fi
        # delta_passed is "" when no baseline supplied; only enforce when a
        # boolean came back.
        if [ "$DELTA_GATE" = "true" ] && [ "$DELTA_PASSED" = "false" ]; then
          echo "::error::delta-gate failed: new threshold violations landed"
          exit 1
        fi
        echo "Gates passed (analysis-gate=$ANALYSIS_GATE delta-gate=$DELTA_GATE)"
