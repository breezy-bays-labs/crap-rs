    # (`--in-place`, per-run seed) is not intermittently RED.
    "mod\\.rs:880:13: delete match arm Expression::ImportExpression\\(ie\\) in",
    "mod\\.rs:884:13: delete match arm Expression::TSSatisfiesExpression\\(ts\\) in",
]
