# Pre-commit and pre-push hooks for the crap4rs workspace.
#
# After cloning, run `lefthook install` once to wire git hooks. CI
# runs the same gates (plus coverage); pre-push catches everything
# coverage-independent so most pushes don't burn CI minutes on
# easily-caught local issues.
#
# Mirror of `.github/workflows/ci.yml` minus coverage / mutation /
# self-CRAP / scorecard-smoke (those rely on cargo-llvm-cov +
# cargo-mutants, too slow for pre-push).

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
      timeout: 60s

pre-push:
  parallel: false
  commands:
    fmt:
      run: cargo fmt --all --check
      timeout: 60s
    ast-purity:
      # Mirror the `ast-purity` CI job. Rejects AST-library imports
      # in `crates/crap-core/src/`. Scope is `crap-core` ONLY —
      # adapter crates (crap4rs uses `syn`; future crap4ts uses
      # `oxc`/`swc`) legitimately import these. Do NOT widen the
      # path to `crates/*/src/` — that would reject every adapter.
      # Regex matches both `use` and `extern crate` forms; trailing
      # `([_:; ]|$)` is a portable word-boundary substitute (GNU +
      # BSD grep). Rejects false positives like
      # `use syntactic_analysis::X`.
      run: |
        set -euo pipefail
        if grep -rE '^[[:space:]]*(use|extern[[:space:]]+crate)[[:space:]]+(::)?(syn|quote|proc_macro2?|tree_sitter|swc|oxc)([_:; ]|$)' crates/crap-core/src/; then
          echo "crap-core must not import AST libraries — see CLAUDE.md and shaping.md"
          exit 1
        fi
      timeout: 30s
    ast-purity-strings:
      # Mirror of the same-named step in `.github/workflows/ci.yml`
      # — layer 4 of crap-core's purity gate. Bans adapter-vocabulary
      # string literals (proper-noun forms `LCOV`, `Istanbul`,
      # `TypeScript`, `LCOV-flavou?red`, case-sensitive) inside
      # `crates/crap-core/src/`. The case-sensitive match
      # distinguishes user-prose leaks from lowercase filename
      # literals (`"lcov.info"`). Doc/inline/block comments are
      # allowed (awk filter strips lines starting with //, /*, *).
      # Local-velocity layer so violations fail at `git push` time
      # rather than waiting for CI. See ci.yml for full rationale
      # and #261.
      run: |
        set -euo pipefail
        hits=$(rg -n '"[^"]*(LCOV|Istanbul|TypeScript|LCOV-flavou?red)[^"]*"' crates/crap-core/src 2>/dev/null || true)
        if [ -z "$hits" ]; then exit 0; fi
        non_comment_hits=$(echo "$hits" | awk -F: '
          {
            content = ""
            for (i = 3; i <= NF; i++) content = content (i > 3 ? ":" : "") $i
            gsub(/^[ \t]+/, "", content)
            if (content !~ /^(\/\/|\/\*|\*)/) print
          }
        ')
        if [ -n "$non_comment_hits" ]; then
          echo "crap-core adapter-vocabulary literals — see #261"
          echo "$non_comment_hits"
          exit 1
        fi
      timeout: 30s
    mutants-skip-lint:
      # Mechanical enforcement of the carry-forward rule documented at
      # the top of `.cargo/mutants.toml`: every test that shells
      # `cargo_bin("crap4rs"|"crap4ts")` under a scoped `cargo mutants`
      # gate that doesn't build that bin must carry a `--skip` substring
      # token in `additional_cargo_test_args`. #224's root cause was that
      # rule being silently violated when a new test landed without the
      # token, aborting the whole walker mutants run (cargo-mutants exits
      # 4, zero mutants tested). Documentation alone enforces nothing;
      # this hook is the local-velocity layer of the same check that
      # `.github/workflows/ci.yml`'s `mutants-skip-lint` job runs on
      # every push. Single source of truth: `scripts/mutants-skip-lint.py`.
      run: python3 scripts/mutants-skip-lint.py
      timeout: 30s
    bdd-tracked-lint:
      # Mechanical enforcement of AGENTS.md "BDD hygiene" Rule 2: every
      # `@unwired` or `@wip` scenario across `crates/*/tests/features/`
      # must carry a `# tracked: crap-rs#<n>` comment inside its
      # scenario block, naming the issue that owns the wiring deferral.
      # Local-velocity layer of the same check that
      # `.github/workflows/ci.yml`'s `bdd-tracked-lint` job runs on
      # every push. Single source of truth: `scripts/bdd-tracked-lint.py`.
      run: python3 scripts/bdd-tracked-lint.py
      timeout: 30s
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      timeout: 300s
    deny:
      run: cargo deny check
      timeout: 60s
    msrv:
      # Pre-flight gate. `cargo +1.93 check --workspace --all-targets`
      # exercises every crate's full target set (lib, bin, tests,
      # examples) under the declared MSRV. Lib-only `cargo check`
      # silently misses dev-dep MSRV breaks (cucumber 0.22 needs
      # 1.88, oxc 0.127+ needs 1.93); the `--all-targets` flag is
      # what surfaces them.
      run: cargo +1.93 check --workspace --all-targets
      timeout: 180s
    test:
      run: cargo nextest run --workspace --all-targets
      timeout: 300s
    insta:
      # Mechanical enforcement of wire-snapshot drift detection
      # (CEng ADVISORY-7, established with the dual-snapshot canary
      # in W1.3 / crap-rs#183). `--check` makes insta fail on pending
      # (unaccepted / .snap.new) snapshots, catching accidental
      # `cargo insta accept` without review and unreviewed diffs in a
      # branch's working tree before push. Without this step,
      # documentation alone enforces the wire-snapshot contract;
      # "documentation rots, CI doesn't."
      #
      # Note: this step previously pinned `--test-runner=nextest` as
      # a workaround for the `colored::set_override` mutex-poison
      # cascade in the table reporter test suite (crap-rs#202). The
      # cascade is now structurally broken by `acquire_color_lock()`
      # in `crates/crap-core/src/adapters/reporters/table.rs`, which
      # recovers from `PoisonError` instead of re-panicking. The
      # default backend is safe again, so the override is removed.
      run: cargo insta test --workspace --check
      timeout: 180s
    cucumber:
      # cucumber-rs harness=false targets bypass libtest's
      # `--list --format terse` probing, so nextest excludes them
      # via `.config/nextest.toml` and they run via `cargo test`.
      run: >-
        cargo test
        --test json_reporter_cucumber
        --test metric_unsupported_cucumber
        --test cyclomatic_walker_cucumber
        --test parity_with_v1_cucumber
        --test istanbul_parser_cucumber
        --test arrow_function_coverage_cucumber
        --test file_extensions_cucumber
        --test branch_coverage_cucumber
      timeout: 300s
    docs:
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps
      timeout: 120s
